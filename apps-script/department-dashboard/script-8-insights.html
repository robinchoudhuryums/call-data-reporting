<script>
  // ===================================================================
  // Insights Report (combined: department rollup + per-agent prior cards)
  // Reuses the shared picker HTML (irBuildAgentListHtml_), the shared KPI
  // tile + delta logic (dsKpiTile_), the IR insight callout
  // (irInsightsBlock_), and the Source chip (sourceChipHtml_). Server:
  // getInsightsReportInit / getInsightsReport (InsightsReport.gs).
  // ===================================================================
  let insLastRoster = { dept: null, agents: [], activeAgents: null, activeFloaters: null, rangeKey: '' };
  let insActiveFetchTimer = null;
  // Stale-response token for the Insights roster fetches (the IR
  // irRosterReqSeq_ pattern): only the newest init/refetch response may
  // write insLastRoster or repaint the picker.
  let insRosterReqSeq_ = 0;
  let insListChangeHandler_ = null;
  let insPendingAgentSelection_ = null;
  let insLastData = null;
  // The agent list the LAST report request was fired with (empty array =
  // agent-free whole-department run). insLastData.meta.agents carries the
  // server-RESOLVED selection (full roster on agent-free runs), so the edit
  // popover needs the requested form to preserve agent-free semantics.
  let insLastRequestedAgents_ = null;
  let insChartInstance = null;
  let insTrendView = 'monthly';    // 'monthly' | 'daily' (consolidated trend chart toggle)
  // Phase 2 #10: trend RENDERER for the team-metric tabs -- 'line' (the
  // chart) | 'calendar' (a weekday day-grid over the selected window, a
  // second renderer of the SAME trendDaily series). Line is the default;
  // Calendar is offered only when the window is long enough to read as a
  // calendar (INS_CALENDAR_MIN_DAYS_) and short enough that 'MM-DD' daily
  // labels are unambiguous (<= 366 days).
  let insTrendRender = 'line';     // 'line' | 'calendar'
  let insCalMetric = 'pct';        // calendar cell metric: 'pct' | 'missed' | 'abd' (R7)
  // R7 (I-1): month pagination -- ONE calendar month renders at a time
  // ('YYYY-MM'); ‹ › arrows flip through the months intersecting the report
  // window (the old all-weeks render clipped past the first month inside the
  // fixed-height chart slot). Defaults to the MOST RECENT month; resets when
  // the report window changes.
  let insCalMonth_ = '';
  let insCalWinKey_ = '';
  // I5a/R11-H history: the Agents default moved cards -> trend chart -> the
  // Absolute chart (Round-16 owner). A saved pref (insRestorePrefs_) still
  // wins; single-agent reports force cards.
  // Round-16 (owner): the CARDS view is HIDDEN for now (undecided whether it
  // stays) -- the #ins-cards-view-toggle control is display:none in
  // dashboard.html and insRestorePrefs_ only restores 'chart', so nothing can
  // strand a viewer in a view with no visible way out. All the cards code is
  // KEPT: single-agent reports still force cards (a one-card grid needs no
  // chart), and un-hiding the toggle restores the choice wholesale.
  let insCardsView = 'chart';   // 'cards' | 'chart' (#3)
  let insCardsChartMetric = 'answered';   // metric for the grouped Chart view (gap mode)
  // Chart-view basis: 'gap' (diverging bars vs the team average, one metric)
  // | 'abs' (absolute stacked Answered+Missed per agent + % Answered dots --
  // the retired Performance Report's Volume & Efficiency view). The third
  // 'prior' basis (Compare Ranges' grouped current-vs-prior bars) was
  // RETIRED by owner note -- the 3-way sub-selector read as confusing, and
  // the prior values stay reachable via the card delta-badge hover
  // tooltips. Persisted in the ins prefs blob ('prior' restores as 'gap').
  let insCardsChartMode = 'abs';   // 'gap' | 'abs' | 'trend'; Round-16 (owner): Absolute is the default basis (was Trend, R11-H)
  let insCardsChartInstance = null;
  let insHasQuiet_ = false;        // whether the current render has quiet agents
  // (the share-of-answered pie's insShareChartInstance is GONE -- Round-16
  // replaced the doughnut with HTML share-tally rows, no chart instance)
  let insActiveTrendMetric = 'answered';
  // gap 1: when the trend chart's "By Queue" tab is active, which per-queue
  // metric to plot -- 'abandonedPct' (default, the 5%-standard view) |
  // 'totalCalls' | 'violations'. Persisted in prefs.
  let insQueueMetric = 'abandonedPct';
  // Round-16 (sub-queue drill fix): Daily-breakdown scope state. '' renders
  // the dept-total dailySeries; a queue name renders that queue's OWN per-day
  // rows (qh.perQueue[i].daily), set when a violation-date chip is clicked so
  // the day's row shows the clicked queue's numbers rather than the parent
  // dept total. Reset to '' on every fresh Queue-health render.
  let insQhDailyAll_ = [];
  let insQhDailyByQueue_ = {};
  let insQhDailyScope_ = '';
  // Round-16b (owner): with 2+ queues carrying daily rows the table goes
  // MULTI mode -- per date one tally row per queue (parent + sub-queues, in
  // Queue-health order) + an "All queues" total row -- so no scoping is
  // needed; scope + chip only serve the single-queue fallback. This meta
  // list ([{queue, subDept}]) preserves payload order and drives the mode.
  let insQhDailyQueueMeta_ = [];
  let insCardSort = 'default';      // default (answered desc) | name | improvers | regressors
  // Round-16 (owner): the D1 Simple/Detailed MODE is RETIRED for per-section
  // PROGRESSIVE DISCLOSURE. Each heavy section is an always-present
  // collapsible fold (<details class="ins-fold">) whose collapsed summary
  // carries its headline -- nothing is hidden behind an invisible mode, and
  // the mode's special cases (Simple forcing the chart basis, the
  // build-on-switch chart rebuilds) are gone with it. Open state persists
  // per user per section; role seeds the defaults (admins open, managers
  // collapsed -- the same intent as the old role default). An old saved
  // density pref migrates: 'detailed' seeds the folds open, 'simple' closed.
  // The on-track card collapse that Simple introduced is UNIVERSAL now (it
  // was already the better disclosure).
  function insFoldsKey_() {
    var who = '';
    try { who = (typeof USER !== 'undefined' && USER && USER.email) ? USER.email : ''; } catch (e) {}
    return 'cdr.ins.folds.v1:' + who;
  }
  let insFolds_ = null;   // { qh, trend } open-state (team detail keeps its own element state)
  function insFoldsLoad_() {
    if (insFolds_) return insFolds_;
    try {
      const saved = JSON.parse(localStorage.getItem(insFoldsKey_()) || 'null');
      if (saved && typeof saved === 'object') { insFolds_ = saved; return insFolds_; }
    } catch (e) { /* fall through to defaults */ }
    // Migration: honor an old density pref once, then the folds key owns it.
    let seed = null;
    try {
      const prefs = JSON.parse(localStorage.getItem(insPrefsKey_()) || 'null');
      if (prefs && (prefs.density === 'simple' || prefs.density === 'detailed')) {
        seed = prefs.density === 'detailed';
      }
    } catch (e) { /* ignore */ }
    if (seed === null) {
      seed = (typeof USER !== 'undefined' && USER && USER.role === 'admin');
    }
    insFolds_ = { qh: !!seed, trend: !!seed };
    return insFolds_;
  }
  function insFoldOpen_(key) { return !!insFoldsLoad_()[key]; }
  function insFoldSet_(key, open) {
    const f = insFoldsLoad_();
    f[key] = !!open;
    try { localStorage.setItem(insFoldsKey_(), JSON.stringify(f)); } catch (e) { /* ignore */ }
  }
  // Reflect the saved open-state onto the fold elements (render-time; the
  // toggle listeners keep the store in sync the other way).
  function insFoldsApply_() {
    const f = insFoldsLoad_();
    ['qh', 'trend'].forEach(function (k) {
      const el = document.querySelector('.ins-fold[data-fold="' + k + '"]');
      if (el && el.open !== !!f[k]) el.open = !!f[k];
    });
  }
  // v2: prefs gain compareMode / priorFrom / priorTo / trendMetric
  // (older v1 blobs are silently dropped per the prefs-versioning
  // convention). Keyed PER USER (the reportLastGoodKey_ pattern) because
  // the blob stores the agent selection -- on a shared machine one
  // viewer's saved dept/agent picks must not restore for another.
  // (Pre-per-user blobs under the bare key become orphans and are ignored.)
  function insPrefsKey_() {
    var who = '';
    try { who = (typeof USER !== 'undefined' && USER && USER.email) ? USER.email : ''; } catch (e) {}
    return 'cdr.ins.prefs.v2:' + who;
  }

  // M1 (Insights merge): Insights is a lazy collapsible REGION of the dept
  // page (#dept-insights-region, docs/insights-merge-plan.md). This ensure
  // runs on region OPEN (deptInsightsOpen_ + the toggle listener), never on
  // dept-page load: first open runs the old openModal init (form + default
  // dates + prefs restore + roster); re-open only re-ensures the roster --
  // cheap when cached, re-splits the active grouping if the dept/dates
  // changed -- and never clobbers a rendered report (decision 3).
  var insPageInited_ = false;
  // First-entry auto-run one-shot (owner: the setup form is RETIRED from
  // the normal flow). Consumed in insRenderAgentList at the race-free
  // post-roster point, like the launcher flag.
  var insAutoRunPending_ = false;
  function insEnsurePage_() {
    if (!$('insights-page')) return;
    if (!insPageInited_) {
      insPageInited_ = true;
      insSetDefaultDates();
      insRestorePrefs_();
      // M2 (one date authority): the dept controls own the page's window --
      // seed the canonical ins dates from them, OVERRIDING any restored
      // prefs dates (compare-mode/agent prefs still apply). Priority ends up
      // share-link > quick-start chip / handoff > dept window > prefs >
      // defaults, because each later writer runs after this seed. The old
      // defaults survive only when the dept inputs are still blank (cold
      // deep-link load before the latest-date fetch lands).
      var df_ = $('from-date'), dt_ = $('to-date');
      if (df_ && dt_ && df_.value && dt_.value) {
        if ($('ins-from')) $('ins-from').value = df_.value;
        if ($('ins-to'))   $('ins-to').value   = dt_.value;
        if ($('ins-preset')) $('ins-preset').value = 'custom';
      }
      // Owner decision: no setup-form step. First OPEN AUTO-GENERATES --
      // an agent-free whole-department run (INV-45) over the seeded window
      // -- and every later change goes through the dept controls or the
      // "Comparison & agents" popover. The form survives HIDDEN as the
      // failure / empty-roster fallback surface only (insShowForm).
      insAutoRunPending_ = true;
      launcherShowLoading_('ins-launcher-loading', 'insights-form', 'insights-results',
        'How is my team doing lately?');
    }
    insEnsureRoster();
    insResizeCharts_();
  }

  // M2 (one date authority): converge an OPEN, initialized region onto the
  // dept controls' window. Compares against the RENDERED window (insLastData
  // meta) so a stale report re-runs even if the inputs were already
  // rewritten. No-ops while the region is closed (the next open converges),
  // while a programmatic run is armed (the launcher / handoff / first-open
  // auto-run owns its window -- syncing then would race two windows), when
  // either side is incomplete, or when already in sync. A rendered report
  // re-runs via insApplyWindow_ (the validated shared tail); with nothing
  // rendered yet it just rewrites the inputs.
  function insSyncToDeptWindow_() {
    var reg = $('dept-insights-region');
    if (!reg || !reg.open || !insPageInited_) return;
    if (insLauncherAutoRun_ || insAutoRunPending_) return;
    var df = $('from-date'), dt = $('to-date');
    if (!df || !dt || !df.value || !dt.value) return;
    var f = $('ins-from'), t = $('ins-to');
    if (!f || !t) return;
    var curFrom = (insLastData && insLastData.meta && insLastData.meta.from) || f.value;
    var curTo   = (insLastData && insLastData.meta && insLastData.meta.to)   || t.value;
    if (curFrom === df.value && curTo === dt.value) return;
    if (!insLastData) {
      f.value = df.value;
      t.value = dt.value;
      if ($('ins-preset')) $('ins-preset').value = 'custom';
      return;
    }
    insApplyWindow_({ from: df.value, to: dt.value });
  }
  // M1: open the dept page's Insights region and run the ensure
  // SYNCHRONOUSLY -- a programmatic `details.open = true` fires its 'toggle'
  // event ASYNC, and callers like handoffToInsights_ / launcherOpenInsights_
  // write ins-* fields right after setPage returns, so the ensure's
  // defaults/prefs restore must run before those writes (the ordering the
  // page era guaranteed). The later async toggle re-calls insEnsurePage_,
  // which is idempotent (insPageInited_ + cached roster).
  function deptInsightsOpen_(opts) {
    var reg = $('dept-insights-region');
    if (!reg) return;
    if (!reg.open) reg.open = true;
    insEnsurePage_();
    if (opts && opts.scroll) {
      try { reg.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (e) { /* best-effort */ }
    }
  }
  // Re-measure charts rendered on a previous visit: the region's content is
  // hidden while the <details> is closed (or the user is on another page),
  // and a window resize in between leaves Chart.js instances mis-sized (the
  // documented measure-while-hidden gotcha; the deptMissedResize_ pattern).
  // Double-rAF waits for the reveal layout to settle; no-ops on first entry
  // (all instances null) and when Chart.js failed to load.
  function insResizeCharts_() {
    if (typeof requestAnimationFrame !== 'function') return;
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      [insChartInstance, insCardsChartInstance].forEach(function (c) {
        try { if (c) c.resize(); } catch (e) { /* destroyed mid-swap */ }
      });
    }); });
  }

  function initInsightsReport() {
    // Round-16: the top-level Insights TAB is retired (the dept page's lens
    // switcher is the route), so #insights-report-btn is normally absent --
    // null-guarded rather than removed, and no longer gates the page init.
    const btn = $('insights-report-btn');
    const page = $('insights-page');
    // M1 (Insights merge): setPage('insights') maps to the dept page + the
    // #dept-insights-region collapsible. No modal open/close/drag/focus-trap/
    // scroll-lock/Escape -- the Escalations pattern (#6).
    if (btn) btn.addEventListener('click', function () { setPage('insights'); });
    if (!page) return;

    // M1: a USER-click open of the region lazily initializes / auto-generates
    // (the laziness contract: nothing Insights-related runs on dept-page
    // load). The programmatic path (deptInsightsOpen_) ensures synchronously
    // and this async toggle re-fires the ensure -- harmless, insEnsurePage_
    // is idempotent. Close is a no-op (the rendered report stays put).
    const insRegion = $('dept-insights-region');
    if (insRegion) insRegion.addEventListener('toggle', function () {
      if (!insRegion.open) return;
      insEnsurePage_();
      // M2 (one date authority): a re-open under a moved dept window
      // converges + re-runs; skipped while a programmatic run is armed
      // (that run owns its window -- see insSyncToDeptWindow_).
      insSyncToDeptWindow_();
      // M2: charts created while the region was CLOSED (user collapsed it
      // mid-generate) measured zero -- recreate them from the last data on
      // reveal. Destroy + create is the C3-safe path (a resize() alone does
      // not reliably recover a 0x0 create); each helper is its own guard
      // (fold-gated / detail-gated), and insApplyWindow_ above re-renders
      // everything anyway when it fired.
      if (insLastData) {
        try {
          if (insCardsView === 'chart') insRenderCardsChart_();
          if (insFoldOpen_('trend')) insDrawTrendChart_(insLastData);
          if (insDetailOpen_()) insRenderDeferredCharts_();
        } catch (e) { /* redraw is best-effort decoration of a rendered report */ }
      }
    });

    const preset = $('ins-preset');
    if (preset) preset.addEventListener('change', insApplyPreset);
    const fromEl = $('ins-from'), toEl = $('ins-to');
    if (fromEl) fromEl.addEventListener('change', function () {
      if ($('ins-preset')) $('ins-preset').value = 'custom';
      insScheduleActiveRefetch_(); insSavePrefs_();
    });
    if (toEl) toEl.addEventListener('change', function () {
      if ($('ins-preset')) $('ins-preset').value = 'custom';
      insScheduleActiveRefetch_(); insSavePrefs_();
    });

    const selAll = $('ins-select-all'), selNone = $('ins-select-none');
    if (selAll)  selAll.addEventListener('click',  function (e) { e.preventDefault(); insToggleAgents(true);  });
    if (selNone) selNone.addEventListener('click', function (e) { e.preventDefault(); insToggleAgents(false); });
    const search = $('ins-agent-search');
    if (search) search.addEventListener('input', function () { irFilterAgentList_($('ins-agent-list'), search.value); });

    // Edit-selection popover wiring (results header; IR's pattern).
    const editBtn = $('ins-edit-selection-btn');
    if (editBtn) editBtn.addEventListener('click', insOpenEditPopover_);
    // Custom-prior row: shown only for Compare=custom; prefilled from the
    // main form's prior fields (which hold the last-used custom window).
    const editCmp = $('ins-edit-compare-mode');
    if (editCmp) editCmp.addEventListener('change', function () {
      const row = $('ins-edit-prior-row');
      const isCustom = editCmp.value === 'custom';
      if (row) row.style.display = isCustom ? '' : 'none';
      if (isCustom) {
        if ($('ins-edit-prior-from') && !$('ins-edit-prior-from').value) {
          $('ins-edit-prior-from').value = $('ins-prior-from') ? $('ins-prior-from').value : '';
        }
        if ($('ins-edit-prior-to') && !$('ins-edit-prior-to').value) {
          $('ins-edit-prior-to').value = $('ins-prior-to') ? $('ins-prior-to').value : '';
        }
      }
    });
    const editClose = $('ins-edit-popover-close');
    if (editClose) editClose.addEventListener('click', insCloseEditPopover_);
    const editApply = $('ins-edit-apply-btn');
    if (editApply) editApply.addEventListener('click', insApplyEditPopover_);
    insInitHeaderDates_();   // Phase 2: header From/To + shared Quick-select chips
    // Lighter hand-off: Insights -> My Department (agent table / Missed detail)
    // for the same dept + window. handoffToMyDept_ carries the dates.
    const insMyDeptBtn = $('ins-open-mydept-btn');
    if (insMyDeptBtn) insMyDeptBtn.addEventListener('click', function () {
      handoffToMyDept_(($('ins-from') || {}).value, ($('ins-to') || {}).value, {});
    });
    // R7 (N-1): re-run the report in place for the current selection. Rides
    // runInsReport's SWR + the I-3 whole-report frost; note the server-side
    // report cache still applies (data refreshes as the 30-min TTL allows).
    const insRefreshBtn = $('ins-refresh-btn');
    if (insRefreshBtn) insRefreshBtn.addEventListener('click', function () { runInsReport(); });
    // R9-1/Phase 2: the results header (title + toolbar + the From/To
    // controls row) is the page's sticky strip, so the real date inputs
    // stay reachable while scrolling -- the My Department pattern.
    const insQhMissedBtn = $('ins-qh-missed-link');
    if (insQhMissedBtn) insQhMissedBtn.addEventListener('click', function () {
      handoffToMyDept_(($('ins-from') || {}).value, ($('ins-to') || {}).value, { missed: true });
    });
    // #5 Option A: delegated ~300ms hover-prefetch on the two Insights -> My
    // Department hand-offs (the button + the Queue-health missed link, which is
    // re-rendered with each report) so the jump SWR-paints instantly. Delegated
    // on the page (not the elements) so dynamically-rendered targets are
    // covered; the window is read lazily at fire time so a period/date edit
    // between hover and click is respected.
    let insMdPrefetchTimer = null;
    page.addEventListener('mouseover', function (e) {
      const t = e.target.closest && e.target.closest('#ins-open-mydept-btn, #ins-qh-missed-link');
      if (!t || !page.contains(t)) return;
      if (insMdPrefetchTimer) clearTimeout(insMdPrefetchTimer);
      insMdPrefetchTimer = setTimeout(function () {
        insMdPrefetchTimer = null;
        prefetchDeptSummary_(($('ins-from') || {}).value, ($('ins-to') || {}).value);
      }, 300);
    });
    page.addEventListener('mouseout', function (e) {
      const t = e.target.closest && e.target.closest('#ins-open-mydept-btn, #ins-qh-missed-link');
      if (t && insMdPrefetchTimer) { clearTimeout(insMdPrefetchTimer); insMdPrefetchTimer = null; }
    });
    const editSelAll  = $('ins-edit-select-all');
    const editSelNone = $('ins-edit-select-none');
    if (editSelAll)  editSelAll.addEventListener('click',  function (e) { e.preventDefault(); insTogglePopoverAgents_(true);  });
    if (editSelNone) editSelNone.addEventListener('click', function (e) { e.preventDefault(); insTogglePopoverAgents_(false); });
    const editSearch = $('ins-edit-search');
    if (editSearch) editSearch.addEventListener('input', function () {
      irFilterAgentList_($('ins-edit-list'), editSearch.value);
    });
    // Close on click outside the popover.
    document.addEventListener('click', function (e) {
      const pop = $('ins-edit-popover');
      if (!pop || pop.style.display === 'none') return;
      if (pop.contains(e.target)) return;
      if (e.target === editBtn) return;
      insCloseEditPopover_();
    });

    const genBtn = $('ins-generate-btn');
    if (genBtn) genBtn.addEventListener('click', runInsReport);

    // I2: needs-attention chips live inside the headline banner now -- delegate
    // from the results container so a chip click scrolls to that agent's card
    // wherever the chips are rendered.
    const insResults = $('insights-results');
    if (insResults) insResults.addEventListener('click', function (e) {
      const chip = e.target.closest('.ds-attn-chip');
      if (!chip) return;
      insSpotlightAgentCard_(chip.getAttribute('data-agent'));
    });

    // A2: Team-detail expander -- render the deferred trend + share canvases
    // on first open (and re-sync on later opens, cheap) so they never build
    // at zero height inside a collapsed <details>.
    const teamDetail = $('ins-team-detail');
    if (teamDetail) teamDetail.addEventListener('toggle', function () {
      if (teamDetail.open) {
        insRenderDeferredCharts_();
        // Round-16: the admin abandon heatmap lives in this fold and is only
        // fetched while it's open (was: density-gated) -- fetch on expand.
        if (USER.role === 'admin' && insLastData && insLastData.meta) {
          loadAbandonHeatmap_('ins-heatmap', insLastData.meta.department || '',
            insLastData.meta.from, insLastData.meta.to);
        }
      }
    });

    // Consolidated trend chart: Monthly/Daily view toggle (client-only
    // re-render from the cached payload; applies to all metric tabs).
    const trendViewToggle = $('ins-trend-view-toggle');
    if (trendViewToggle) trendViewToggle.addEventListener('click', function (e) {
      const b = e.target.closest('.seg-btn');
      if (!b) return;
      const next = b.getAttribute('data-view') || 'monthly';
      if (next === insTrendView) return;
      insTrendView = next;
      trendViewToggle.querySelectorAll('.seg-btn').forEach(function (x) {
        const active = x === b;
        x.classList.toggle('active', active);
        x.setAttribute('aria-checked', active ? 'true' : 'false');
      });
      insSavePrefs_();
      if (insLastData) insRenderTrendChart_(insLastData);
    });

    // Phase 2 #10: Line/Calendar renderer toggle (team-metric tabs only;
    // insRenderTrendChart_ shows it only when the calendar is applicable).
    const trendRenderToggle = $('ins-trend-render-toggle');
    if (trendRenderToggle) trendRenderToggle.addEventListener('click', function (e) {
      // R7 (I-1): ineligible tabs/windows show the toggle disabled (hover
      // title explains why) -- clicks are inert until it's eligible again.
      if (trendRenderToggle.classList.contains('is-disabled')) return;
      const b = e.target.closest('.seg-btn');
      if (!b || b.disabled) return;
      const next = b.getAttribute('data-render') || 'line';
      if (next === insTrendRender) return;
      insTrendRender = next;
      insSavePrefs_();
      if (insLastData) insRenderTrendChart_(insLastData);
    });
    // Calendar interactions (delegated, wired once): the metric seg + the
    // per-day drill (click a day -> reload the report for that day, the
    // trend-point-drill convention).
    const calHostInit = $('ins-trend-calendar');
    if (calHostInit) calHostInit.addEventListener('click', function (e) {
      const mBtn = e.target.closest('[data-cal-metric]');
      if (mBtn) {
        const m = mBtn.getAttribute('data-cal-metric') || 'pct';
        if (m !== insCalMetric) {
          insCalMetric = m;
          insSavePrefs_();
          if (insLastData) insRenderTrendCalendar_(insLastData);
        }
        return;
      }
      // R7 (I-1): ‹ › month nav -- the button carries its target 'YYYY-MM'.
      const nBtn = e.target.closest('[data-cal-nav]');
      if (nBtn) {
        const ym = nBtn.getAttribute('data-cal-nav') || '';
        if (ym && ym !== insCalMonth_) {
          insCalMonth_ = ym;
          if (insLastData) insRenderTrendCalendar_(insLastData);
        }
        return;
      }
      const cell = e.target.closest('.ins-cal-drill');
      if (cell) {
        const iso = cell.getAttribute('data-iso') || '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) insDrillToRange_({ from: iso, to: iso });
      }
    });

    // Data-labels toggle (opt-in; off by default like IR/CR).
    const insLabels = $('ins-show-datalabels');
    if (insLabels) insLabels.addEventListener('change', function () {
      insSavePrefs_();
      if (insLastData) {
        insRenderTrendChart_(insLastData);
        // The Absolute cards chart reads the toggle too (the gap chart's
        // value labels are always on -- they carry the absolute numbers).
        if (insCardsView === 'chart' && insCardsChartMode === 'abs') insRenderCardsChart_();
      }
    });

    // Per-card IR drill-through (delegated on the page section so it covers
    // both the main card grid and the quiet-agents collapsible).
    page.addEventListener('click', function (e) {
      const link = e.target.closest('.ins-card-ir-link');
      if (!link) return;
      const agent = link.getAttribute('data-agent');
      if (!agent || typeof irDrillToAgent_ !== 'function') return;
      irDrillToAgent_(agent, $('ins-from').value, $('ins-to').value, { fromInsights: true });
    });

    // IR hover-prefetch: rest the pointer ~300ms on an agent card -> fetch
    // that agent's Individual Report in the background using the drill's
    // EXACT request shape (same field order as runIrReport, so reportSig_
    // matches to the byte) and seed the D1b keep-last-good store; a
    // subsequent click-drill then SWR-paints instantly while its live fetch
    // confirms behind it. Guards: 300ms intent debounce (canceled when the
    // pointer leaves the card early), one fetch per signature per session
    // (insIrPrefetched_), skipped when the store already holds the signature.
    // Deliberately NOT a preload-all-agents pass -- one speculative call with
    // high intent probability instead of N per render (Apps Script quota +
    // contention with the user's real next request). Known trade-off: the
    // prefetch is indistinguishable from a real IR run server-side, so
    // Report Usage telemetry counts it (the signature must match exactly, so
    // no marker param is possible).
    let insIrPrefetchTimer = null;
    const insIrPrefetched_ = {};
    page.addEventListener('mouseover', function (e) {
      const card = e.target.closest && e.target.closest('.ins-card');
      if (!card || !page.contains(card)) return;
      const link = card.querySelector('.ins-card-ir-link');
      const agent = link && link.getAttribute('data-agent');
      if (!agent) return;
      if (insIrPrefetchTimer) clearTimeout(insIrPrefetchTimer);
      insIrPrefetchTimer = setTimeout(function () {
        insIrPrefetchTimer = null;
        const req = { department: getRequestedDept(),
                      from: $('ins-from') ? $('ins-from').value : '',
                      to:   $('ins-to')   ? $('ins-to').value   : '',
                      agents: [agent] };
        if (!req.department || !req.from || !req.to) return;
        const sig = reportSig_(req);
        if (!sig || insIrPrefetched_[sig]) return;
        insIrPrefetched_[sig] = true;   // mark up front so hover jitter can't double-fire
        if (reportLastGoodRead_('ir', sig)) return;   // already warm (e.g. a real run)
        google.script.run
          .withSuccessHandler(function (data) { reportLastGoodWrite_('ir', sig, data); })
          .withFailureHandler(function () { /* best-effort -- the drill's own fetch surfaces errors */ })
          .getIndividualReport(req);
      }, 300);
    });
    page.addEventListener('mouseout', function (e) {
      const card = e.target.closest && e.target.closest('.ins-card');
      if (!card) return;
      if (e.relatedTarget && card.contains(e.relatedTarget)) return;   // still inside the card
      if (insIrPrefetchTimer) { clearTimeout(insIrPrefetchTimer); insIrPrefetchTimer = null; }
    });
    // (The results-header "« Back" button is retired with the setup-form
    // step; insShowForm survives as the failure/empty-roster fallback.)

    insInitCompareMode_();

    // Card-sort control (CR pattern). Re-renders the card grid in
    // place; quiet agents stay in their collapsible regardless.
    const cardSortSel = $('ins-card-sort');
    if (cardSortSel) cardSortSel.addEventListener('change', function () {
      insCardSort = cardSortSel.value;
      insSavePrefs_();
      if (insLastData) {
        insRenderAgentCards_(insLastData.agentData || [], insLastData.meta, insLastData.teamStats);
      }
    });

    // Round-16 fold layer (replaced the D1 density toggle): apply the saved
    // open-state, then wire each fold's toggle -- persist the choice and run
    // the section's deferred draw on expand (the trend chart is the C3 case:
    // built while collapsed it renders at zero height and gives up).
    insFoldsApply_();
    document.querySelectorAll('.ins-fold').forEach(function (fold) {
      fold.addEventListener('toggle', function () {
        const key = fold.getAttribute('data-fold') || '';

        if (key === 'trend' && fold.open && insLastData) insDrawTrendChart_(insLastData);
      });
    });
    const introDismiss = $('ins-intro-dismiss');
    if (introDismiss) introDismiss.addEventListener('click', function () {
      try { localStorage.setItem('cdr.ins.intro.v1', 'done'); } catch (e2) {}
      const card = $('ins-intro-card');
      if (card) card.style.display = 'none';
    });

    // Cards/Chart view toggle (#3) + the Chart-view metric selector.
    const cardsViewToggle = $('ins-cards-view-toggle');
    if (cardsViewToggle) cardsViewToggle.addEventListener('click', function (e) {
      const b = e.target.closest('.seg-btn');
      if (!b) return;
      const next = b.getAttribute('data-view') || 'cards';
      if (next === insCardsView) return;
      insCardsView = next;
      cardsViewToggle.querySelectorAll('.seg-btn').forEach(function (x) {
        const active = x === b;
        x.classList.toggle('active', active);
        x.setAttribute('aria-checked', active ? 'true' : 'false');
      });
      insSavePrefs_();
      insApplyCardsView_();
    });
    const cardsChartMetricSel = $('ins-cards-chart-metric');
    if (cardsChartMetricSel) cardsChartMetricSel.addEventListener('change', function () {
      insCardsChartMetric = cardsChartMetricSel.value;
      insSavePrefs_();
      if (insCardsView === 'chart') insRenderCardsChart_();
    });
    // Chart-view basis sub-toggle: Gap vs team / Absolute (PR's volume view).
    const cardsChartModeSeg = $('ins-cards-chart-mode');
    if (cardsChartModeSeg) cardsChartModeSeg.addEventListener('click', function (e) {
      const b = e.target.closest('.seg-btn');
      if (!b) return;
      const next = b.getAttribute('data-mode') || 'gap';
      if (next === insCardsChartMode) return;
      insCardsChartMode = next;
      insSyncCardsChartMode_();
      insSavePrefs_();
      insApplyCardsView_();   // re-toggles the gap-only metric selector + re-renders
    });

    // R11-C3 (owner-approved consolidation): ONE metric dropdown replaced
    // the trend sub-tabs, the per-queue metric select, and the calendar's
    // cell-metric segment. "queues:<m>" values split into the queues view +
    // its sub-metric; the Avg-talk-time option is REMOVED for non-admins
    // (an <option> can't ride the data-admin-only reveal loop).
    const trendSel = $('ins-trend-metric');
    if (trendSel) {
      if (typeof USER === 'undefined' || !USER || USER.role !== 'admin') {
        const attOpt = trendSel.querySelector('option[data-admin-metric]');
        if (attOpt) attOpt.remove();
      }
      trendSel.addEventListener('change', function () {
        const v = trendSel.value || 'answered';
        if (v.indexOf('queues:') === 0) {
          insActiveTrendMetric = 'queues';
          insQueueMetric = v.slice(7) || 'abandonedPct';
        } else {
          insActiveTrendMetric = v;
        }
        insSavePrefs_();
        if (insLastData) insRenderTrendChart_(insLastData);
      });
    }

    // R11-J: floating admin A/B remote. Its buttons FORWARD a click to the
    // real segmented controls (so the existing state/prefs/render wiring runs
    // once, unduplicated); the metric select mirrors #ins-trend-metric.
    // insSyncAbPanel_ reflects state back onto it after each render.
    const abPanel = $('ins-ab-panel');
    if (abPanel) {
      // R12-11 (I-2): the fixed card sits over real chart/calendar data when
      // expanded, so it starts COLLAPSED unless the admin last left it open;
      // the choice persists (localStorage).
      const AB_OPEN_KEY = 'cdr.ins.abpanel';
      const abCol = $('ins-ab-collapse');
      (function () {
        let open = false;
        try { open = localStorage.getItem(AB_OPEN_KEY) === 'open'; } catch (e) {}
        if (!open) {
          abPanel.classList.add('ins-ab-collapsed');
          if (abCol) abCol.innerHTML = '+';
        }
      })();
      const abForward = function (realId, attr, val) {
        const real = $(realId);
        if (!real) return;
        const btn = real.querySelector('.seg-btn[' + attr + '="' + val + '"]');
        if (btn) btn.click();
      };
      abPanel.addEventListener('click', function (e) {
        const col = e.target.closest('#ins-ab-collapse');
        if (col) {
          const on = abPanel.classList.toggle('ins-ab-collapsed');
          col.innerHTML = on ? '+' : '&#8211;';
          try { localStorage.setItem(AB_OPEN_KEY, on ? 'collapsed' : 'open'); } catch (e2) {}
          return;
        }
        const vb = e.target.closest('[data-ab-view]');
        if (vb) { abForward('ins-cards-view-toggle', 'data-view', vb.getAttribute('data-ab-view')); return; }
        const mb = e.target.closest('[data-ab-mode]');
        if (mb) { abForward('ins-cards-chart-mode', 'data-mode', mb.getAttribute('data-ab-mode')); return; }
        const rb = e.target.closest('[data-ab-render]');
        if (rb) { abForward('ins-trend-render-toggle', 'data-render', rb.getAttribute('data-ab-render')); return; }
      });
      const abMetric = $('ins-ab-metric');
      if (abMetric) abMetric.addEventListener('change', function () {
        const real = $('ins-trend-metric');
        if (!real) return;
        real.value = abMetric.value;
        real.dispatchEvent(new Event('change'));
      });
    }

    // Export dropdown -- same pattern as Individual / Performance.
    const exportBtn  = $('ins-export-btn');
    const exportMenu = $('ins-export-menu');
    if (exportBtn && exportMenu) {
      exportBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        insSetExportMenuOpen_(exportMenu.style.display === 'none');
      });
      exportMenu.addEventListener('click', function (e) {
        const item = e.target.closest('[data-action]');
        if (!item) return;
        const action = item.getAttribute('data-action');
        insSetExportMenuOpen_(false);
        if (action === 'csv')        insDownloadCsv_();
        else if (action === 'copy')  insCopyImage_();
        else if (action === 'email') insEmailReport_();
        else if (action === 'email-summary') insEmailReport_({ summary: true });   // Phase 2 #9
        else if (action === 'print') insPrint_();
      });

      // Phase 2 #8: Views menu (saved views + copy share link). Rebuilt on
      // every open so the list reflects saves/deletes; clicks inside the
      // save row keep the menu open.
      const viewsBtn = $('ins-views-btn');
      const viewsMenu = $('ins-views-menu');
      if (viewsBtn && viewsMenu) {
        const setViewsOpen = function (open) {
          viewsMenu.style.display = open ? '' : 'none';
          viewsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
          if (open) insRenderViewsMenu_();
        };
        viewsBtn.addEventListener('click', function () {
          setViewsOpen(viewsMenu.style.display === 'none');
        });
        document.addEventListener('click', function (e) {
          if (viewsMenu.style.display === 'none') return;
          if (viewsBtn.contains(e.target) || viewsMenu.contains(e.target)) return;
          setViewsOpen(false);
        });
        viewsMenu.addEventListener('click', function (e) {
          if (e.target.closest('[data-views-action="share"]')) {
            setViewsOpen(false);
            insCopyShareLink_();
            return;
          }
          const del = e.target.closest('.ins-views-del');
          if (del) {
            const views = insViewsLoad_();
            views.splice(Number(del.getAttribute('data-view-idx')), 1);
            insViewsStore_(views);
            insRenderViewsMenu_();
            return;
          }
          const apply = e.target.closest('.ins-views-apply');
          if (apply) {
            const v = insViewsLoad_()[Number(apply.getAttribute('data-view-idx'))];
            setViewsOpen(false);
            if (v) insApplyViewState_(v.state);
            return;
          }
          if (e.target.closest('#ins-views-save')) insSaveCurrentView_();
        });
        viewsMenu.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' && e.target && e.target.id === 'ins-views-name') {
            e.preventDefault();
            insSaveCurrentView_();
          }
        });
      }
      document.addEventListener('click', function (e) {
        if (exportMenu.style.display === 'none') return;
        if (exportMenu.contains(e.target) || e.target === exportBtn) return;
        insSetExportMenuOpen_(false);
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && exportMenu.style.display !== 'none') {
          insSetExportMenuOpen_(false);
        }
      });
    }
  }

  /**
   * Resolves the "Compare against" selection to an explicit prior
   * window (mirrors IR's irResolvePriorRange_, with ins-* element
   * ids). Returns:
   *   null              -> prevPeriod: omit priorFrom/priorTo and let
   *                        the server compute the INV-28 auto-adjacent
   *                        window (keeps the cache key 'auto').
   *   { from, to }      -> explicit window to send (yoy / custom).
   *   { error }         -> custom mode with missing/invalid dates.
   */
  function insResolvePriorRange_(from, to) {
    const mode = $('ins-compare-mode') ? $('ins-compare-mode').value : 'prevPeriod';
    if (!mode || mode === 'prevPeriod') return null;
    if (mode === 'custom') {
      const pf = $('ins-prior-from') ? $('ins-prior-from').value : '';
      const pt = $('ins-prior-to')   ? $('ins-prior-to').value   : '';
      if (!pf || !pt) return { error: 'Pick prior start and end dates (or switch Compare against to a preset).' };
      if (pf > pt)    return { error: 'Prior start must be on or before prior end.' };
      const out = { from: pf, to: pt };
      // F3: warn (don't block) when the custom prior overlaps the current
      // range -- server attribution is "current wins", so overlapping days
      // count toward the current period only and the prior reads low.
      if (from && to && pf <= to && pt >= from) {
        out.warn = 'Note: this prior window overlaps the current range ('
          + from + ' – ' + to + '). Overlapping days count toward the current '
          + 'period only, so the prior period may read low.';
      }
      return out;
    }
    if (mode === 'yoy') {
      const p1 = from.split('-'), p2 = to.split('-');
      const ps = new Date(Number(p1[0]) - 1, Number(p1[1]) - 1, Number(p1[2]), 12);
      const pe = new Date(Number(p2[0]) - 1, Number(p2[1]) - 1, Number(p2[2]), 12);
      return { from: insIsoOf_(ps), to: insIsoOf_(pe) };
    }
    return null;
  }

  // Wire the Compare against dropdown: show/hide custom inputs and
  // preview the resolved window in the hint (mirrors irInitCompareMode_).
  function insInitCompareMode_() {
    const sel = $('ins-compare-mode');
    if (!sel) return;
    const refresh = function () {
      const mode = sel.value;
      const showCustom = (mode === 'custom');
      if ($('ins-prior-from-wrap')) $('ins-prior-from-wrap').style.display = showCustom ? '' : 'none';
      if ($('ins-prior-to-wrap'))   $('ins-prior-to-wrap').style.display   = showCustom ? '' : 'none';
      const hint = $('ins-prior-hint');
      if (!hint) return;
      const from = $('ins-from').value, to = $('ins-to').value;
      if (!from || !to) { hint.textContent = ''; return; }
      const prior = insResolvePriorRange_(from, to);
      if (!prior) { hint.textContent = ''; return; }   // prevPeriod: server hint suffices
      if (prior.error) { hint.textContent = prior.error; return; }
      // INV-35-style form-side warning when a custom window's length
      // differs >= 1.2x from the current range (CR's S18 pattern).
      let lengthNote = '';
      // F-38: WORKING-day ratio, matching the server's INV-35 flag
      // (insights v12) so the hint and the generated report agree.
      const curDays = workingDaysBetween_(from, to);
      const priDays = workingDaysBetween_(prior.from, prior.to);
      if (curDays > 0 && priDays > 0
          && Math.max(curDays, priDays) / Math.min(curDays, priDays) >= 1.2) {
        const ratio = (Math.max(curDays, priDays) / Math.min(curDays, priDays)).toFixed(1);
        lengthNote = ' (the ' + (priDays > curDays ? 'prior window' : 'selected range')
                   + ' is ' + ratio + 'x longer in working days — volume totals won\'t be directly comparable)';
      }
      hint.textContent = 'Comparing against ' + prior.from + ' to ' + prior.to + '.' + lengthNote
        + (prior.warn ? ' ' + prior.warn : '');
    };
    sel.addEventListener('change', function () { refresh(); insSavePrefs_(); });
    ['ins-from', 'ins-to', 'ins-prior-from', 'ins-prior-to'].forEach(function (id) {
      const el = $(id);
      if (el) el.addEventListener('change', refresh);
    });
    refresh();
  }

  function insShowForm()    { launcherHideLoading_('ins-launcher-loading'); $('insights-form').style.display = ''; $('insights-results').style.display = 'none'; insSetFormError(''); }
  function insShowResults() { launcherHideLoading_('ins-launcher-loading'); $('insights-form').style.display = 'none'; $('insights-results').style.display = ''; }
  function insSetFormError(msg) {
    const el = $('ins-form-error'); if (!el) return;
    if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
    el.textContent = msg; el.style.display = '';
  }

  function insIsoOf_(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')
      + '-' + String(d.getDate()).padStart(2, '0');
  }
  function insSetDefaultDates() {
    if ($('ins-from') && $('ins-from').value) return;   // keep restored/last value
    // Default = the launcher window (last 30 days ending yesterday) -- the
    // exact agent-free request CacheWarm pre-warms per dept, so the
    // form-less first entry usually paints from cache instead of a cold
    // aggregation. (Was month-to-date, which was never warmed.)
    if ($('ins-from')) $('ins-from').value = launcherIsoDaysAgo_(30);
    if ($('ins-to'))   $('ins-to').value   = launcherIsoDaysAgo_(1);
  }
  function insApplyPreset() {
    const v = $('ins-preset').value; insSavePrefs_();
    if (v === 'custom') return;
    const today = new Date(); let s, e = new Date(today);
    // Short-window presets (#2) for the agent-free queue/dept quick-look.
    // daysSinceMon: 0=Mon .. 6=Sun (JS getDay is 0=Sun..6=Sat).
    if (v === 'yesterday')        { s = new Date(today); s.setDate(today.getDate() - 1); e = new Date(s); }
    else if (v === 'thisWeek')    { const dsm = (today.getDay() + 6) % 7; s = new Date(today); s.setDate(today.getDate() - dsm); }
    else if (v === 'lastWeek')    { const dsm = (today.getDay() + 6) % 7;
                                    e = new Date(today); e.setDate(today.getDate() - dsm - 1);
                                    s = new Date(e); s.setDate(e.getDate() - 6); }
    else if (v === 'thisMonth')   { s = new Date(today.getFullYear(), today.getMonth(), 1); }
    else if (v === 'lastMonth')   { s = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                                    e = new Date(today.getFullYear(), today.getMonth(), 0); }
    // "Last 30 days" = 30 days ending yesterday (matches the main page's
    // chip, the Overview launcher window, and CacheWarm -- see applyIrPreset).
    else if (v === 'last30')      { e = new Date(today); e.setDate(today.getDate() - 1);
                                    s = new Date(today); s.setDate(today.getDate() - 30); }
    else if (v === 'last3Months') { s = new Date(today); s.setMonth(today.getMonth() - 3); }
    else if (v === 'last12Months'){ s = new Date(today); s.setFullYear(today.getFullYear() - 1); }
    else if (v === 'lastYear')    { s = new Date(today.getFullYear() - 1, 0, 1);
                                    e = new Date(today.getFullYear() - 1, 11, 31); }
    if (!s) return;
    $('ins-from').value = insIsoOf_(s);
    $('ins-to').value   = insIsoOf_(e);
    insScheduleActiveRefetch_(); insSavePrefs_();
  }

  // -- Picker (mirrors the IR picker; reuses the shared helpers) ----------
  function insEnsureRoster() {
    const dept = getRequestedDept();
    if (!dept) { $('ins-agent-loader').textContent = 'No department selected.'; $('ins-agent-list').style.display = 'none'; return; }
    const from = $('ins-from').value, to = $('ins-to').value;
    const rangeKey = from + '|' + to;
    if (insLastRoster.dept === dept && insLastRoster.agents.length && insLastRoster.rangeKey === rangeKey) {
      insRenderAgentList(); return;
    }
    $('ins-agent-loader').style.display = ''; $('ins-agent-list').style.display = 'none'; $('ins-generate-btn').disabled = true;
    const __rk = ++insRosterReqSeq_;
    google.script.run
      .withSuccessHandler(function (data) {
        if (__rk !== insRosterReqSeq_) return;   // superseded by a newer fetch
        insLastRoster = {
          dept: dept,
          agents: (data && data.agents) || [],
          activeAgents:   (data && data.activeAgents)   || null,
          activeFloaters: (data && data.activeFloaters) || null,
          subQueueGroups: (data && data.subQueueGroups) || null,   // G-1
          rangeKey: rangeKey,
        };
        insRenderAgentList();
      })
      .withFailureHandler(function (err) {
        if (__rk !== insRosterReqSeq_) return;   // a newer fetch owns the picker
        // The launcher AND the first-entry auto-run hide the form behind a
        // loading pane; on a roster failure, cancel the pending auto-run
        // and fall back to the form so the loader error is visible instead
        // of an eternal loading pane (the IR #1-Part-B pattern).
        if (insLauncherAutoRun_ || insAutoRunPending_) {
          insLauncherAutoRun_ = false;
          insAutoRunPending_ = false;
          insShowForm();
        }
        // R8-A7: disarm the one-shot chip-scroll too (the dept page's
        // deptMissedScrollPending_ discipline) -- a leaked flag would
        // scroll-jump + spotlight on the NEXT unrelated successful render,
        // and in Simple mode force-switch the user to Detailed.
        insScrollPending_ = null;
        // G-7: inline Retry (see ensureIrRoster).
        const insLoader = $('ins-agent-loader');
        insLoader.style.display = '';
        insLoader.innerHTML = 'Error loading roster: '
          + escapeHtml(err && err.message ? err.message : String(err))
          + ' <button type="button" class="link-btn" id="ins-roster-retry">Retry</button>';
        const insRetry = $('ins-roster-retry');
        if (insRetry) insRetry.addEventListener('click', function () { insEnsureRoster(); });
      })
      .getInsightsReportInit({ department: dept, from: from, to: to });
  }
  function insScheduleActiveRefetch_() {
    if (insActiveFetchTimer) clearTimeout(insActiveFetchTimer);
    insActiveFetchTimer = setTimeout(function () {
      const dept = getRequestedDept(); if (!dept) return;
      const from = $('ins-from').value, to = $('ins-to').value;
      if (!from || !to || from > to) return;
      const rangeKey = from + '|' + to;
      if (insLastRoster.dept === dept && insLastRoster.rangeKey === rangeKey) return;
      const __rk = ++insRosterReqSeq_;
      google.script.run
        .withSuccessHandler(function (data) {
          if (__rk !== insRosterReqSeq_) return;   // superseded by a newer fetch
          if (insLastRoster.dept !== dept) return;   // G-5: dept switched mid-flight
          insLastRoster.activeAgents   = (data && data.activeAgents)   || null;
          insLastRoster.activeFloaters = (data && data.activeFloaters) || null;
          insLastRoster.subQueueGroups = (data && data.subQueueGroups) || null;   // G-1
          insLastRoster.rangeKey = rangeKey;
          const checked = irGetCheckedAgents_($('ins-agent-list'));
          insRenderAgentList();
          irApplyCheckedAgents_($('ins-agent-list'), checked);
          insUpdateGenerate();
        })
        .withFailureHandler(function () { /* keep existing grouping */ })
        .getInsightsReportInit({ department: dept, from: from, to: to });
    }, 350);
  }
  function insRenderAgentList() {
    const list = $('ins-agent-list');
    $('ins-agent-loader').style.display = 'none';
    if (!insLastRoster.agents.length) {
      list.innerHTML = '<div class="ir-agent-empty">No agents on this department\'s roster.</div>';
      list.style.display = ''; $('ins-generate-btn').disabled = true; return;
    }
    // Insights is roster-only (see computeInsights_ visibleAgents) -- don't
    // offer the queue-only floater group in the picker, so it can't be picked
    // into a report that would then drop it. IR/PR/CR still surface floaters.
    list.innerHTML = irBuildAgentListHtml_(insLastRoster.agents, insLastRoster.activeAgents, [], insLastRoster.subQueueGroups || []);
    list.style.display = '';
    if (insListChangeHandler_) list.removeEventListener('change', insListChangeHandler_);
    insListChangeHandler_ = function () { insUpdateGenerate(); insSavePrefs_(); };
    list.addEventListener('change', insListChangeHandler_);
    if (insPendingAgentSelection_) { irApplyCheckedAgents_(list, insPendingAgentSelection_); insPendingAgentSelection_ = null; }
    insUpdateGenerate();
    // Overview question-launcher flow: the picker render is the race-free
    // point to select the whole active roster and run. One-shot.
    if (insLauncherAutoRun_) {
      insLauncherAutoRun_ = false;
      insAutoRunPending_ = false;   // the launcher run covers first-entry too
      insToggleAgents(true);
      if (!$('ins-generate-btn').disabled) runInsReport();
      else insShowForm();   // empty roster: surface the picker's message, not an eternal pane
    } else if (insAutoRunPending_) {
      // First-entry auto-run (form retired): respect any prefs-restored
      // agent selection (applied via insPendingAgentSelection_ above);
      // nothing checked = the agent-free whole-department run (INV-45).
      insAutoRunPending_ = false;
      if (!$('ins-generate-btn').disabled) runInsReport();
      else insShowForm();
    }
  }
  function insToggleAgents(on) { selectAllActiveAgents_($('ins-agent-list'), on); insUpdateGenerate(); insSavePrefs_(); }
  function insUpdateGenerate() {
    // Agent-free run: Generate is enabled whenever the roster has any agent
    // (checked or not) -- leaving everything unchecked runs the whole
    // department (the QCD-style queue / dept quick-look). Only a truly empty
    // roster disables it.
    const total = $('ins-agent-list').querySelectorAll('.ir-agent-cb').length;
    $('ins-generate-btn').disabled = total === 0;
  }

  // -- In-results edit popover (IR's pattern, adapted to Insights) --------
  // Lets the user change dates / comparison / agent selection from the
  // results header without a round-trip through the setup form (fewer
  // screens). Two Insights-specific semantics vs the IR popover:
  //  (1) Apply allows an EMPTY selection -- Insights' agent-free contract
  //      runs the whole department roster (INV-45 digest pattern), so
  //      "Select none (whole department)" is a feature, not an invalid
  //      state, and Apply is never disabled.
  //  (2) The compare control defaults to a 'keep' sentinel: left there,
  //      Apply re-resolves through the MAIN form's compare mode (including
  //      a custom prior window the popover can't represent); picking a
  //      preset syncs it back into the form first, so the form and the
  //      report never disagree.

  /** Compact "Showing: ..." label (IR's truncation rules) + the agent-free
   *  wording when the last request carried no explicit agents. */
  function insRenderEditingLine_(data) {
    const el = $('ins-editing-agents');
    if (!el) return;
    const meta = (data && data.meta) || {};
    const resolved = Array.isArray(meta.agents) ? meta.agents : [];
    let visible, tooltip;
    if (insLastRequestedAgents_ && !insLastRequestedAgents_.length) {
      visible = 'Whole department (' + resolved.length + ' agent' + (resolved.length === 1 ? '' : 's') + ')';
      tooltip = resolved.join(', ');
    } else if (resolved.length <= 3) {
      visible = resolved.join(', ');
      tooltip = visible;
    } else {
      visible = resolved.slice(0, 2).join(', ') + ', +' + (resolved.length - 2) + ' more';
      tooltip = resolved.join(', ');
    }
    el.textContent = visible || '(none)';
    el.title = tooltip;
  }

  function insOpenEditPopover_() {
    const pop = $('ins-edit-popover');
    const list = $('ins-edit-list');
    if (!pop || !list) return;
    const meta = (insLastData && insLastData.meta) || {};
    if ($('ins-edit-from')) $('ins-edit-from').value = meta.from || ($('ins-from') ? $('ins-from').value : '');
    if ($('ins-edit-to'))   $('ins-edit-to').value   = meta.to   || ($('ins-to')   ? $('ins-to').value   : '');
    if ($('ins-edit-compare-mode')) $('ins-edit-compare-mode').value = 'keep';
    if ($('ins-edit-prior-row')) $('ins-edit-prior-row').style.display = 'none';   // re-shown on Compare=custom
    // Roster-only list (no floater group), same as the main Insights picker.
    list.innerHTML = irBuildAgentListHtml_(insLastRoster.agents || [], insLastRoster.activeAgents, [], insLastRoster.subQueueGroups || []);
    // Pre-check the REQUESTED selection -- an agent-free run pre-checks
    // nothing, so an untouched Apply preserves the whole-department run.
    irApplyCheckedAgents_(list, insLastRequestedAgents_ || []);
    // D2: the compare / prior / agent controls live behind Advanced options
    // now. Auto-open it when the CURRENT report already uses them -- a custom
    // prior window or a partial agent selection must stay visible, never
    // silently folded away.
    const adv = $('ins-edit-advanced');
    if (adv) {
      const partialAgents = !!(insLastRequestedAgents_ && insLastRequestedAgents_.length);
      const customPrior = (insLastData && insLastData.meta
        && insLastData.meta.comparisonMode === 'custom');
      adv.open = partialAgents || !!customPrior;
    }
    pop.style.display = '';
    const search = $('ins-edit-search');
    if (search) { search.value = ''; setTimeout(function () { search.focus(); }, 0); }
    irFilterAgentList_(list, '');
  }

  function insCloseEditPopover_() {
    const pop = $('ins-edit-popover');
    if (pop) pop.style.display = 'none';
  }

  function insTogglePopoverAgents_(checked) {
    selectAllActiveAgents_($('ins-edit-list'), checked);
  }

  // Round-16 Phase 2 (header unification): the I4 period chips are replaced
  // by the My-Department controls pattern -- real From/To inputs + the SHARED
  // Quick-select preset chips (buildDatePresetChips_, script-2). The header
  // inputs MIRROR the canonical #ins-from/#ins-to (still in the hidden
  // fallback form; what deep links / saved views / the popover write): this
  // sync copies canonical -> header on every render, and a header edit
  // copies back + re-runs through insApplyWindow_ (the old period-chip
  // pipeline: prior-window validation, picker regroup, prefs, runInsReport).
  function insSyncHeaderDates_(meta) {
    const from = meta && meta.from, to = meta && meta.to;
    recordPageWindow_('insights', from, to);   // R9-3: the shared-window store
    const f = $('ins-hdr-from'), t = $('ins-hdr-to');
    if (f && from) f.value = from;
    if (t && to) t.value = to;
  }

  // Apply a { from, to } window to the report -- the shared tail every entry
  // point uses (preset chip, header date edit).
  function insApplyWindow_(r) {
    if (!r || !r.from || !r.to) return;
    if (r.from > r.to) { insSetResultsStatus_('error', 'Start date must be on or before end date.'); return; }
    if ($('ins-from')) $('ins-from').value = r.from;
    if ($('ins-to'))   $('ins-to').value   = r.to;
    if ($('ins-preset')) $('ins-preset').value = 'custom';
    // Validate the (kept) comparison before firing -- the setup form is
    // hidden, so its error line would be invisible; surface on the results.
    const prior = insResolvePriorRange_(r.from, r.to);
    if (prior && prior.error) { insSetResultsStatus_('error', prior.error); return; }
    insScheduleActiveRefetch_();   // re-group the picker for the new range
    insSavePrefs_();
    insSetResultsStatus_('loading', 'Refreshing report…');
    runInsReport();
  }

  let insHeaderDatesWired_ = false;
  function insInitHeaderDates_() {
    if (insHeaderDatesWired_) return;
    const f = $('ins-hdr-from'), t = $('ins-hdr-to');
    if (!f || !t) return;
    insHeaderDatesWired_ = true;
    buildDatePresetChips_($('ins-date-presets'), insApplyWindow_);
    // Debounced like the dept page's date edits, so typing / rapid arrow
    // presses coalesce into one request.
    const onEdit = debounce_(function () {
      if (!f.value || !t.value) return;
      const w = $('ins-date-presets');
      if (w) w.querySelectorAll('.date-preset-chip').forEach(function (c) { c.classList.remove('active'); });
      insApplyWindow_({ from: f.value, to: t.value });
    }, 350);
    f.addEventListener('change', onEdit);
    t.addEventListener('change', onEdit);
  }

  function insApplyEditPopover_() {
    const from = $('ins-edit-from') ? $('ins-edit-from').value : '';
    const to   = $('ins-edit-to')   ? $('ins-edit-to').value   : '';
    if (!from || !to) { insSetResultsStatus_('error', 'Pick a start and end date.'); return; }
    if (from > to)    { insSetResultsStatus_('error', 'Start date must be on or before end date.'); return; }
    const newAgents = irGetCheckedAgents_($('ins-edit-list'));   // empty = whole department
    const popMode = $('ins-edit-compare-mode') ? $('ins-edit-compare-mode').value : 'keep';

    // Custom prior range (owner note: with the setup-form step retired,
    // the popover must be able to EXPRESS a custom prior, not just keep
    // one): validate + stage the prior dates before the form sync below.
    if (popMode === 'custom') {
      const pf = $('ins-edit-prior-from') ? $('ins-edit-prior-from').value : '';
      const pt = $('ins-edit-prior-to')   ? $('ins-edit-prior-to').value   : '';
      if (!pf || !pt) { insSetResultsStatus_('error', 'Pick prior start and end dates.'); return; }
      if (pf > pt)    { insSetResultsStatus_('error', 'Prior start must be on or before prior end.'); return; }
      if ($('ins-prior-from')) $('ins-prior-from').value = pf;
      if ($('ins-prior-to'))   $('ins-prior-to').value   = pt;
    }

    // Sync the popover state back into the (hidden) setup form so re-open /
    // saved prefs all agree, then reuse runInsReport end-to-end (it brings
    // the SWR paint, D1b keep-last-good, and the stale-response guard).
    if ($('ins-from')) $('ins-from').value = from;
    if ($('ins-to'))   $('ins-to').value   = to;
    if ($('ins-preset')) $('ins-preset').value = 'custom';
    if (popMode !== 'keep' && $('ins-compare-mode')) {
      $('ins-compare-mode').value = popMode;
      $('ins-compare-mode').dispatchEvent(new Event('change'));   // custom-input visibility + hint
    }
    irApplyCheckedAgents_($('ins-agent-list'), newAgents);
    insScheduleActiveRefetch_();   // re-group the main picker for the new range
    insSavePrefs_();

    // Validate the (possibly kept-custom) comparison BEFORE firing: the
    // setup form is hidden here, so its error line would be invisible.
    const prior = insResolvePriorRange_(from, to);
    if (prior && prior.error) { insSetResultsStatus_('error', prior.error); return; }

    insCloseEditPopover_();
    insSetResultsStatus_('loading', 'Refreshing report…');
    runInsReport();
  }

  function runInsReport() {
    const dept = getRequestedDept(); if (!dept) { insSetFormError('No department selected.'); return; }
    const from = $('ins-from').value, to = $('ins-to').value;
    if (!from || !to) { insSetFormError('Pick a start and end date.'); return; }
    if (from > to) { insSetFormError('Start date must be on or before end date.'); return; }
    const agents = irGetCheckedAgents_($('ins-agent-list'));
    // Agent-free run: an empty selection is allowed -- the server defaults to
    // the full department roster (the QCD-replacement queue / dept view).
    // Resolve the comparison window. prevPeriod -> null (server's
    // INV-28 auto-adjacent default); yoy/custom -> explicit dates.
    const prior = insResolvePriorRange_(from, to);
    if (prior && prior.error) { insSetFormError(prior.error); return; }
    // Sub-queue Phase 2: same one-dept-per-run rule as the Individual Report.
    // Insights' team rollup + per-agent-vs-team comparisons are all per-dept
    // (INV-25/27), so a selection spanning depts is refused, and a selection
    // confined to a sub-queue group runs against THAT department.
    const __sq = subqPickerScope_($('ins-agent-list'));
    if (__sq.mixed) {
      insSetFormError('Pick agents from one department at a time — the team '
        + 'rollup is per-department, so a mixed selection would compare agents '
        + 'against the wrong team.');
      return;
    }
    const reportDept = __sq.dept || dept;
    insSetFormError('');
    insLastRequestedAgents_ = agents.slice();   // edit popover reads the REQUESTED form
    const req = { department: reportDept, from: from, to: to, agents: agents };
    if (prior) { req.priorFrom = prior.from; req.priorTo = prior.to; }
    const gen = $('ins-generate-btn'); const prev = gen.textContent;
    gen.disabled = true; gen.innerHTML = DS_EQ_HTML_ + 'Generating…';
    const __rtok = ++reportReqSeq_.ins;   // F10 stale-response guard
    const __sig = reportSig_(req);   // D1b keep-last-good key
    // R7 (I-3): a re-run over an ALREADY-RENDERED report (period slider, edit
    // popover, Refresh) frosts the whole results container -- the M3/M-1
    // pattern -- instead of relying on the thin one-line status note. The SWR
    // pre-paint below stays readable under the frost; live/fail handlers clear
    // it. A first run (results hidden) keeps the existing loading pane.
    const __insFrostHost = $('insights-results');
    const __insUseFrost = !!(__insFrostHost && __insFrostHost.style.display !== 'none'
                             && __insFrostHost.childElementCount > 0);
    if (__insUseFrost) dsFrostShow_(__insFrostHost, 'Refreshing report…');
    // Repaint path shared by live data / SWR / fail-fallback; clears the
    // results-status line so the SWR "refreshing" note can't outlive the
    // response it announced.
    const __insRepaint = function (d, opts) {
      insRenderReport_(d, opts); insShowResults(); reportSetStatus_('ins-results-status', '');
      // SWR pre-paint keeps the frost up (still refreshing); live/fallback clears.
      if (!(opts && opts.swr) && __insFrostHost) dsFrostHide_(__insFrostHost);
    };
    reportSwrPaint_('ins', __sig, __insRepaint, 'ins-results-status');   // SWR: instant repeat-paint
    // With the frost up, the "previous result — refreshing" status line is
    // redundant (the dept-table M3 precedent) -- the frost signals the refresh.
    if (__insUseFrost) reportSetStatus_('ins-results-status', '');
    google.script.run
      .withSuccessHandler(function (data) {
        gen.disabled = false; gen.textContent = prev;
        if (__rtok !== reportReqSeq_.ins) return;
        reportLastGoodWrite_('ins', __sig, data);
        insSavePrefs_(); __insRepaint(data);
      })
      .withFailureHandler(function (err) {
        gen.disabled = false; gen.textContent = prev;
        if (__rtok !== reportReqSeq_.ins) return;
        if (__insFrostHost) dsFrostHide_(__insFrostHost);   // R7 (I-3)
        // D1b: repaint last-good for this exact request (if any) instead of blanking.
        if (reportFailFallback_('ins', __sig, __insRepaint, 'ins-results-status')) return;
        // R8-A7: no render is coming -- disarm the one-shot chip scroll so it
        // can't fire on a later unrelated render. (The fallback branch above
        // is fine: its repaint consumes the flag normally.)
        insScrollPending_ = null;
        insShowForm();   // dismisses the launcher loading pane if active
        insSetFormError('Error: ' + (err && err.message ? err.message : String(err)));
      })
      .getInsightsReport(req);
  }

  /**
   * Shared ds-* KPI tile (Phase 1 redesign; see docs/design-update-plan.md).
   * Used by the Insights team rollup (and, until its retirement, the
   * Performance Report rollup -- the first ds-* component shared across two
   * reports). Same (label, stat, valenceDirection, sparklineData,
   * sparklineColor) shape. Behavior is identical to the retired prKpiTile_ -- same
   * valence-to-color mapping, the same binary benchValueCls_ tint on the value
   * (92% / 5% only; NO invented 85%/8% bands, decision C2), and the same shared
   * irSparkline_. Emits the ds-kpi structure (mono label + delta pill on top,
   * display value, full-width sparkline, quiet "vs prior" footer).
   */
  function dsKpiTile_(label, stat, valenceDirection, sparklineData, sparklineColor) {
    const s = stat || { formatted: '-', deltaPct: 0, type: 'volume' };
    const isPctType = s.type === 'pctPoints';
    const dp = Number(s.deltaPct || 0);
    let badge;
    if (Math.abs(dp) < 0.05) {
      badge = '<span class="ds-delta ds-delta--neutral">— no change</span>';
    } else {
      let mod = 'ds-delta--neutral';
      if (valenceDirection === 'pos')      mod = dp > 0 ? 'ds-delta--good' : 'ds-delta--warn';
      else if (valenceDirection === 'neg') mod = dp > 0 ? 'ds-delta--warn' : 'ds-delta--good';
      const arrow = dp > 0 ? '▲' : '▼';
      const suffix = isPctType ? ' pts' : '%';
      badge = '<span class="ds-delta ' + mod + '">' + arrow + ' ' + Math.abs(dp).toFixed(1) + suffix + '</span>';
    }
    const spark = irSparkline_(sparklineData || [], sparklineColor || '#4E79A7');
    return '<div class="ds-kpi">'
         +   '<div class="ds-kpi__top">'
         +     '<span class="ds-kpi__label">' + label + '</span>'
         +     badge
         +   '</div>'
         +   '<div class="ds-kpi__value' + benchValueCls_(label, s.formatted, true) + '">' + escapeHtml(String(s.formatted)) + '</div>'
         +   '<div class="ds-kpi__spark">' + spark + '</div>'
         +   '<div class="ds-kpi__foot">vs prior</div>'
         + '</div>';
  }

  // "N workdays" (singular-aware). Prefers the server's INV-35 count
  // (holiday-aware) when present; falls back to the client mirror.
  function insWorkdaysLabel_(serverCount, fromIso, toIso) {
    const n = (serverCount && serverCount > 0)
      ? serverCount
      : workingDaysBetween_(fromIso, toIso);
    if (!n) return '';
    return n + (n === 1 ? ' workday' : ' workdays');
  }

  // A2: is the Team-detail <details> currently expanded? A missing wrapper
  // (older markup) counts as open so the charts always render.
  function insDetailOpen_() {
    var d = $('ins-team-detail');
    return !d || d.open;
  }

  // A2: render the two Chart.js canvases (trend + share) from the cached
  // payload. Called during the main render when the Team-detail is already
  // open, and by the <details> toggle handler on first open (charts built
  // while collapsed render at zero height -- the missed-chart offsetParent
  // lesson). Queue health + heatmap are DOM/CSS-grid, so they render in the
  // main pass whether or not this section is open.
  function insRenderDeferredCharts_() {
    if (!insLastData || !insDetailOpen_()) return;
    // I4: only the share tally is deferred now -- the trend chart moved out
    // of this <details> to the always-visible bottom Trends section and renders
    // in the main pass (insDrawTrendChart_).
    insRenderShareChart_(insLastData.agentData || []);
  }

  // I4: measure-guarded trend render for the main pass. The trend chart lives
  // at the bottom of the report as its own always-visible section now, but the
  // main render can run before #insights-results is shown (the __insRepaint
  // path renders then calls insShowResults), so Chart.js could measure a
  // zero-size canvas and come up blank. Defer creation via bounded rAF until
  // the wrap is laid out -- the missed-chart lesson (MC2). User-interaction
  // callers (subtab / view toggle / datalabels) run while visible and call
  // insRenderTrendChart_ directly.
  var insTrendDrawAttempts_ = 0;
  function insDrawTrendChart_(data) {
    var wrap = $('ins-trend-wrap');
    if (!wrap) { insRenderTrendChart_(data); return; }   // older markup: render directly
    var measurable = wrap.offsetParent !== null && wrap.clientWidth > 0;
    if (!measurable) {
      if (insTrendDrawAttempts_ < 30 && typeof requestAnimationFrame === 'function') {
        insTrendDrawAttempts_++;
        requestAnimationFrame(function () { insDrawTrendChart_(data); });
      }
      return;
    }
    insTrendDrawAttempts_ = 0;
    insRenderTrendChart_(data);
  }

  // A1: among the valenced volume/rate metrics, the one that moved MOST
  // unfavorably (per-working-day-adjusted, matching the trend pill's
  // classification). Returns { label, arrow } or null when nothing moved
  // the wrong way. Valence: % answered / answered up = good; missed up = bad.
  function insWorstMover_(metrics, meta) {
    var adj = insPerDayMetrics_(metrics || {}, meta) || {};
    var defs = [
      { key: 'pct',      label: '% answered', inverse: false },
      { key: 'answered', label: 'answered',   inverse: false },
      { key: 'missed',   label: 'missed',     inverse: true  },
    ];
    var worst = null;
    defs.forEach(function (d) {
      var st = adj[d.key];
      if (!st || st.deltaPct == null) return;
      var dp = Number(st.deltaPct) || 0;
      var badness = d.inverse ? dp : -dp;   // > 0 = an unfavorable move
      if (badness <= 0.05) return;
      if (!worst || badness > worst.badness) {
        worst = { badness: badness, label: d.label, arrow: d.inverse ? '▲' : '▼' };
      }
    });
    return worst ? { label: worst.label, arrow: worst.arrow } : null;
  }

  // I2: the needs-attention chips are now folded INTO the headline banner (one
  // "here's who's behind" surface instead of a separate strip). One chip per
  // BEHIND-TEAM agent -- the SAME peer-relative set the card orange rails flag
  // (insClassifyAgent_ 'attention'), so the banner count, these chips, and the
  // rails all agree (I6). Each chip scrolls to that agent's card. Hidden for a
  // single-agent report; no chips when nobody's behind (the banner's team
  // sentence carries the story). The standalone #ins-needs-attention element is
  // retired (kept hidden).
  // D3 (#6): the all-clear renders only when the team is also flat -- within
  // this many pct-POINTS of the prior window (the pct stat is pctPoints).
  var INS_ALLCLEAR_MAX_PTS_ = 1.5;

  // D3 (#7): small-sample display threshold -- average answerable calls
  // (answered + missed) per shown agent over the window. FRONT-END display
  // constant only: below it a note renders near the headline and the delta
  // pills mute (CSS), so a newcomer doesn't over-read a ±40% swing on 5
  // calls. Never changes the compute or hides data.
  var INS_SMALL_SAMPLE_PER_AGENT_ = 10;
  function insRenderSmallSampleNote_(data) {
    var el = $('ins-small-sample');
    var res = $('insights-results');
    if (!el) return;
    var cards = (data && data.agentData) || [];
    var small = false;
    if (cards.length) {
      var total = 0;
      cards.forEach(function (c) {
        var m = c.metrics || {};
        total += (Number(m.answered && m.answered.val) || 0)
               + (Number(m.missed && m.missed.val) || 0);
      });
      small = (total / cards.length) < INS_SMALL_SAMPLE_PER_AGENT_;
    }
    el.style.display = small ? '' : 'none';
    if (small) {
      el.textContent = 'Small sample — on average fewer than ' + INS_SMALL_SAMPLE_PER_AGENT_
        + ' calls per agent in this window, so the change indicators may be noisy.';
    }
    if (res) res.classList.toggle('ins-small-sample-mode', small);
  }

  function insRenderNeedsAttentionStrip_(data) {
    var strip = $('ins-needs-attention');
    if (strip) { strip.style.display = 'none'; strip.innerHTML = ''; }
    var headEl = $('ins-headline');
    if (!headEl) return;
    // Clear any chips appended on a prior render (reportHeadline_ rebuilds the
    // banner's innerHTML, but guard anyway).
    var prev = headEl.querySelector('.ins-headline-attn');
    if (prev && prev.parentNode) prev.parentNode.removeChild(prev);
    if (headEl.style.display === 'none') return;
    var cards = (data && data.agentData) || [];
    if (cards.length <= 1) return;
    var ts = (data && data.teamStats) || {};
    var teamPct = Number((ts.pct && ts.pct.val) || 0);
    var behind = cards.filter(function (c) { return insClassifyAgent_(c, teamPct) === 'attention'; });
    if (!behind.length) {
      // D3 (#6): an explicit all-clear beats empty space for occasional
      // users -- but ONLY when the team is also flat vs prior (a big team
      // move already carries the headline's story). Same values the
      // headline computes; presentation only.
      var teamDp = Number((ts.pct && ts.pct.deltaPct) || 0);
      if (isFinite(teamDp) && Math.abs(teamDp) <= INS_ALLCLEAR_MAX_PTS_) {
        var ok = document.createElement('div');
        ok.className = 'ins-headline-attn ins-headline-allclear';
        ok.textContent = 'Steady period — no agent is behind the team average, and the team answer rate is within ±'
          + INS_ALLCLEAR_MAX_PTS_ + ' pts of the prior period.';
        headEl.appendChild(ok);
      }
      return;
    }
    var chips = behind.map(function (c) {
      var pct = Number((c.metrics && c.metrics.pct && c.metrics.pct.val) || 0);
      var gap = Math.round(teamPct - pct);
      var sub = '<span class="ds-attn-chip-metric">' + (gap > 0 ? gap + ' pts behind' : 'behind') + '</span>';
      return '<button type="button" class="ds-attn-chip" data-agent="' + escapeHtml(c.name) + '"'
        + ' title="Jump to ' + escapeHtml(c.name) + '’s card">'
        + '<span class="ds-attn-chip-name">' + escapeHtml(c.name) + '</span>' + sub + '</button>';
    }).join('');
    var row = document.createElement('div');
    row.className = 'ins-headline-attn ds-attn-chips';
    row.innerHTML = chips;
    headEl.appendChild(row);
  }

  // A1: scroll to + pulse an agent's card by name (the strip chip target).
  // Reuses the .qs-spotlight accent-ring pulse (reduced-motion aware via CSS).
  function insSpotlightAgentCard_(name) {
    var wrap = $('ins-agent-cards');
    if (!wrap || !name) return;
    var el = wrap.querySelector('[data-ins-agent="' + escCssId_(name) + '"]');
    // A regressed agent whose card is in the collapsed quiet group won't be
    // found in the main grid -- expand it so the target exists, then retry.
    if (!el) {
      var det = $('ins-quiet-details');
      if (det) {
        det.open = true;
        var qc = $('ins-quiet-cards');
        el = qc && qc.querySelector('[data-ins-agent="' + escCssId_(name) + '"]');
      }
    }
    if (!el) return;
    try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) {}
    el.classList.remove('qs-spotlight');
    void el.offsetWidth;
    el.classList.add('qs-spotlight');
    setTimeout(function () { el.classList.remove('qs-spotlight'); }, 2600);
  }

  function insRenderReport_(data, opts) {
    insLastData = data;
    coverageNoteUpsert_('insights-results', 'insights',
      (data && data.meta && data.meta.from) || null, 'dqe');   // R12-26
    // Round-16: reflect the saved fold open-state before painting so the
    // draw-on-open gating below reads the right state (incl. SWR pre-paints).
    insFoldsApply_();
    // D3: one-time first-run intro. R7 (I-3, owner): shown ONCE, period --
    // the first render auto-marks it seen, so it never re-nags on later
    // entries even if the user doesn't click Got it (the dismiss button still
    // hides it immediately this session). Best-effort on storage errors
    // (private mode -> shows each visit, the pre-R7 behavior).
    (function () {
      const card = $('ins-intro-card');
      if (!card) return;
      let done = null;
      try { done = localStorage.getItem('cdr.ins.intro.v1'); } catch (e) {}
      card.style.display = done ? 'none' : '';
      if (!done) { try { localStorage.setItem('cdr.ins.intro.v1', 'done'); } catch (e2) {} }
    })();
    insCloseEditPopover_();
    // I1: belt-and-suspenders -- ensure the launcher's auto-generate loading
    // pane is hidden whenever a report renders. Its ~120px skeleton, if left
    // visible, reads as a large blank band above the results.
    launcherHideLoading_('ins-launcher-loading');
    insRenderEditingLine_(data);
    // Date line: label the window so the range doesn't read as arbitrary --
    // name the launcher-default shape ("last 30 days") when it matches, and
    // always show how many workdays the window actually represents.
    (function () {
      const meta = data.meta || {};
      const bits = [data.dateLabel || ''];
      if (meta.from === launcherIsoDaysAgo_(30) && meta.to === launcherIsoDaysAgo_(1)) {
