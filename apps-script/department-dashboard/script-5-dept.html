    content.innerHTML = sections.join('');
    wrap.style.display = '';
  }

  function onError(err, hadSwrPaint) {
    $('refresh-btn').disabled = false;
    // M3: clear the frost overlay on failure (the stale table stays visible).
    var __fh = document.querySelector('.agents-table-wrap');
    if (__fh) dsFrostHide_(__fh);
    var __sh = $('dept-team-strip');
    if (__sh) dsFrostHide_(__sh);
    // R7 (M-1): the missed-section frost armed at refresh() start has no
    // deptMissedFetch_ coming to clear it -- unfrost here (content stays as-is).
    var __mw = $('dept-missed-section');
    if (__mw) { dsFrostHide_(__mw); __mw.classList.remove('dm-loading'); }
    var msg = (err && err.message ? err.message : String(err));
    // When this request SWR-painted the last-good table, keep it on screen
    // under the error status (the behavior refresh()'s SWR comment promises)
    // instead of wiping the rows to an empty table.
    if (hadSwrPaint && state.rows.length) {
      setStatus('error', "Couldn't refresh — showing your previous result. " + msg);
      return;
    }
    state.rows = [];
    state.totals = null;
    state.meta = null;
    state.diagnostics = null;
    setStatus('error', 'Error: ' + msg);
    render();
    renderInfoLine();
    renderDiagnostics();
  }

  // -- Sort ---------------------------------------------------------------

  function onSort(key) {
    if (state.sortKey === key) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortKey = key;
      // Numbers default desc (most useful first), text asc.
      const col = COLUMNS.find(function (c) { return c.key === key; });
      state.sortDir = (col && col.type === 'text') ? 'asc' : 'desc';
    }
    render();
  }

  // #8: parametrized so the Overview mini-table can reuse it with its own sort
  // state (was reading the My Department `state` globals). Callers pass
  // (rows, sortKey, sortDir).
  function sortRows(rows, sortKey, sortDir) {
    const key = sortKey;
    const dir = sortDir === 'asc' ? 1 : -1;
    const col = COLUMNS.find(function (c) { return c.key === key; });
    const isText = col && col.type === 'text';
    return rows.slice().sort(function (a, b) {
      // Answer-rate sort (the stacked bar column). Idle agents -- no
      // rung activity at all -- always sink to the bottom regardless of
      // direction so they don't crowd the top of an ascending sort.
      if (key === 'answerRate') {
        const at = (Number(a.totalAnswered) || 0) + (Number(a.totalMissed) || 0);
        const bt = (Number(b.totalAnswered) || 0) + (Number(b.totalMissed) || 0);
        if (!at && !bt) return String(a.agent).localeCompare(String(b.agent));
        if (!at) return 1;
        if (!bt) return -1;
        const ar = (Number(a.totalAnswered) || 0) / at;
        const br = (Number(b.totalAnswered) || 0) / bt;
        if (ar !== br) return (ar - br) * dir;
        return String(a.agent).localeCompare(String(b.agent));
      }
      const av = a[key], bv = b[key];
      if (isText) {
        return String(av).localeCompare(String(bv)) * dir;
      }
      return ((Number(av) || 0) - (Number(bv) || 0)) * dir;
    });
  }

  // -- Render -------------------------------------------------------------

  // opts (Round-16, bar column only): { tallyUnit } on AGENT rows renders the
  // volume-proportional tally at the cohort's shared scale; { tallyLegend }
  // on a TOTALS row keeps the classic bar and appends the "each block = N
  // calls" legend beneath it -- the totals tbody is pinned at the TOP of the
  // table, so the legend leads the tallies it explains.
  function fmtCell(col, row, opts) {
    if (col.type === 'chip' && col.key === 'source') {
      return sourceChipHtml_(row);
    }
    if (col.type === 'bar') {
      var barHtml = answeredBarHtml_(row, (opts && opts.tallyUnit) || 0);
      if (opts && opts.tallyLegend > 1) {
        barHtml += '<div class="ans-tally-legend"><span class="tly a"></span> = '
          + opts.tallyLegend + ' calls</div>';
      }
      return barHtml;
    }
    if (col.type === 'pct') {
      // #8 Answer % = answered / (answered + missed), matching the bar + the
      // answerRate sort. Idle rows (no rung) show a muted dash; the rest carry
      // the 92% benchmark tint (symmetric), like the bar's inline rate.
      const pa = Number(row.totalAnswered) || 0, pm = Number(row.totalMissed) || 0, pt = pa + pm;
      if (!pt) return zeroCell_('–');
      const prate = Math.round(pa / pt * 100);
      return '<span class="ans-rate' + benchValueCls_('% answered', prate + '%', true) + '">' + prate + '%</span>';
    }
    const v = row[col.key];
    if (col.type === 'text') return escapeHtml(v == null ? '' : v);
    if (col.type === 'duration') {
      const dur = fmtDuration(v);
      return (Number(v) || 0) === 0 ? zeroCell_(dur) : dur;
    }
    // E5: append a small prior-period delta chip after the number on
    // the three chipped columns. No chip on totals row (no prior
    // window for a sum row). Zero values are muted (zeroCell_), but the
    // WoW chip stays full-color since a delta against zero is signal.
    const num = fmtNumber(v);
    const numHtml = (Number(v) || 0) === 0 ? zeroCell_(num) : num;
    return numHtml + wowChipHtml_(row, col);
  }

  // E5 prior-period delta chip. Maps each chipped column to its
  // prior-window field on `row` (priorRung / priorMissed /
  // priorAnswered), computes the delta, and returns a small inline
  // chip with the direction arrow + magnitude. Returns '' when:
  //   - the column isn't one we chip (only totalRung/Missed/Answered)
  //   - the row is the tfoot totals row (no priorHasData field)
  //   - the prior window had no included rows for this agent
  //     (priorHasData=false; client renders the plain number alone)
  //
  // Valence:
  //   totalRung     -> up = good (more inbound engagement)
  //   totalAnswered -> up = good (more handled)
  //   totalMissed   -> up = warn (worse)
  // Small deltas (|delta| < WOW_NOISE_THRESHOLD) get the muted
  // styling regardless of direction so the table isn't a sea of
  // colors on routine day-to-day fluctuation.
  const WOW_NOISE_THRESHOLD = 3;
  const WOW_PRIOR_KEYS = {
    totalRung:     { priorKey: 'priorRung',     valence: 'good' },
    totalAnswered: { priorKey: 'priorAnswered', valence: 'good' },
    totalMissed:   { priorKey: 'priorMissed',   valence: 'warn' },
  };
  function wowChipHtml_(row, col) {
    const spec = WOW_PRIOR_KEYS[col.key];
    if (!spec) return '';
    if (!row || row.priorHasData !== true) return '';
    const current = Number(row[col.key]) || 0;
    const prior   = Number(row[spec.priorKey]) || 0;
    const delta   = current - prior;
    const abs     = Math.abs(delta);
    let cls;
    let arrow;
    if (delta === 0) {
      cls = 'wow-chip-muted';
      arrow = '→';   // → flat
    } else if (abs < WOW_NOISE_THRESHOLD) {
      cls = 'wow-chip-muted';
      arrow = delta > 0 ? '▲' : '▼';  // ▲ ▼ muted
    } else {
      // Above threshold: color by valence direction. For "good"
      // metrics (rung/answered), up = good; for "warn" (missed),
      // up = bad. Down inverts.
      const isUp = delta > 0;
      if (spec.valence === 'good') {
        cls = isUp ? 'wow-chip-good' : 'wow-chip-warn';
      } else {
        cls = isUp ? 'wow-chip-warn' : 'wow-chip-good';
      }
      arrow = isUp ? '▲' : '▼';
    }
    const sign = delta > 0 ? '+' : (delta < 0 ? '−' : '');  // − minus
    const label = delta === 0 ? '0' : (sign + abs);
    // Tooltip carries the raw prior value + the explicit window so
    // a manager can sanity-check the delta without doing math. Uses the
    // RENDER CONTEXT's meta (C-3): the Overview mini-table sets
    // wowChipMetaOverride_ for its synchronous render pass, because its rows
    // come from its OWN getDepartmentSummary call -- reading the dept PAGE's
    // state.meta here cited that page's prior window (or blank) on the
    // Overview chips. Deltas were always per-row correct; only this hover
    // label borrowed the wrong window.
    const wm = wowChipMetaOverride_ || (state && state.meta) || {};
    const pf = wm.priorFrom || '';
    const pt = wm.priorTo   || '';
    const tip = 'Prior period ' + pf + ' – ' + pt
              + ': ' + prior + '. Delta ' + (delta >= 0 ? '+' : '') + delta + '.';
    return ' <span class="wow-chip ' + cls + '" title="' + escapeHtml(tip) + '">'
         +   arrow + label
         + '</span>';
  }

  // Source chip for the Phase D Source column. Three variants:
  //   - matchedViaRoster && matchedViaQueue -> BOTH (good-soft)
  //   - matchedViaRoster only               -> ROSTER (accent-soft)
  //   - matchedViaQueue only                -> QUEUE [· dept1, dept2] (warn-soft)
  // sourceHomes is an array (server-populated) listing every dept
  // whose roster a queue-only floater appears on. Empty array =
  // bare "QUEUE" with no suffix (floater on no dept's roster --
  // they only touched the current dept's queue extensions). One
  // entry = "QUEUE · Sales". Multiple = "QUEUE · Sales, Power" so
  // multi-rostered floaters surface their full home list.
  function sourceChipHtml_(row) {
    if (row.matchedViaRoster && row.matchedViaQueue) {
      return '<span class="src-chip src-chip-both"><span class="src-dot"></span>BOTH</span>';
    }
    if (row.matchedViaRoster) {
      return '<span class="src-chip src-chip-roster"><span class="src-dot"></span>ROSTER</span>';
    }
    if (row.matchedViaQueue) {
      const homes = Array.isArray(row.sourceHomes) ? row.sourceHomes : [];
      const suffix = homes.length
        ? ' &middot; ' + homes.map(escapeHtml).join(', ')
        : '';
      return '<span class="src-chip src-chip-queue"><span class="src-dot"></span>QUEUE' + suffix + '</span>';
    }
    return '';
  }

  // CSV-safe plain text for a source row. Mirrors the chip's
  // variants without the chip markup; consumed by exportTableCsv_.
  function sourceChipCsv_(row) {
    if (row.matchedViaRoster && row.matchedViaQueue) return 'BOTH';
    if (row.matchedViaRoster) return 'ROSTER';
    if (row.matchedViaQueue) {
      const homes = Array.isArray(row.sourceHomes) ? row.sourceHomes : [];
      return homes.length ? 'QUEUE - ' + homes.join(', ') : 'QUEUE';
    }
    return '';
  }

  // B1: derive the ROSTER team prior-window totals from the per-row prior
  // fields the server already ships (priorAnswered/priorMissed/priorRung on
  // matchedViaRoster rows with priorHasData). Same roster-only scope as the
  // tfoot totals + the same limitation as the per-row WoW chips: agents with
  // prior-only activity (no current-window row) aren't represented. `has` is
  // false when no row carried a prior baseline -> the strip shows no delta.
  function deptTeamPrior_(rows) {
    var out = { answered: 0, missed: 0, rung: 0, has: false };
    (rows || []).forEach(function (r) {
      if (!r.matchedViaRoster || r.priorHasData !== true) return;
      out.answered += Number(r.priorAnswered) || 0;
      out.missed   += Number(r.priorMissed)   || 0;
      out.rung     += Number(r.priorRung)     || 0;
      out.has = true;
    });
    return out;
  }

  // B1: compact vs-prior delta chip for the team strip. Mirrors the table's
  // WoW valence + noise-muting (WOW_NOISE_THRESHOLD) so a small move stays
  // quiet. `valence` = 'good' (up is good: answered/rate) or 'warn' (up is
  // bad: missed).
  function deptStripDelta_(delta, valence, threshold, unit, tip) {
    var abs = Math.abs(delta);
    var cls, arrow;
    if (delta === 0) { cls = 'wow-chip-muted'; arrow = '→'; }
    else if (abs < threshold) { cls = 'wow-chip-muted'; arrow = delta > 0 ? '▲' : '▼'; }
    else {
      var up = delta > 0;
      cls = (valence === 'good') ? (up ? 'wow-chip-good' : 'wow-chip-warn')
                                 : (up ? 'wow-chip-warn' : 'wow-chip-good');
      arrow = up ? '▲' : '▼';
    }
    var sign = delta > 0 ? '+' : (delta < 0 ? '−' : '');
    var label = delta === 0 ? '0' : (sign + abs + (unit || ''));
    return '<span class="dts-delta ' + cls + '" title="' + escapeHtml(tip || '') + '">'
         + arrow + ' ' + label + '</span>';
  }

  // B1: team summary strip (answer rate hero + answered / missed / avg talk)
  // for the selected range. Built from state.totals (roster-only, server-
  // summed) -- no new fetch. Hidden when there are no data rows.
  // ==== Sub-queue scope (Phase 1) ==========================================
  // A sub-queue (PAP, Spanish, PAK) is a FULL department with its own roster
  // column -- NOT a floater (INV-53). The switcher lets a parent manager see
  // their own dept, the sub-queue alone, or both COMBINED, and "combined" here
  // means grouped-and-subtotalled: every row keeps its dept, every dept keeps
  // its own subtotal, and the grand total is explicitly labelled. A single
  // merged number would be unreconcilable against each dept's own view, which
  // is exactly what the QCD carousel learned the hard way (P3).

  // `cdr.dept.subscope` (the retired scope switcher's saved per-dept view) is
  // an ORPHAN key: nothing reads or writes it since the switcher was replaced
  // by collapsible groups. Swept on load by sweepOrphanPrefs_() (#5, Round-16;
  // read-before-remove, so the steady state costs no writes). Listed with the
  // other orphaned prefs in docs/client-ui-conventions.md.

  /**
   * The always-on relationship line. Renders whenever a sub-queue relationship
   * exists in either direction, because the whole point is that a manager
   * should not have to DISCOVER that a sub-queue exists -- before this, the
   * relationship was completely invisible from the table.
   *
   * (Named for the scope switcher it used to carry; the switcher is retired.
   * The name is kept because it is referenced from docs and the harness.)
   */
  var SUBQ_BAR_HIDDEN_ = true;   // Round-16 owner removal; false restores the bar + chip
  function subqRenderScopeBar_(state) {
    var host = $('dept-subq-bar');
    if (!host) return;
    // Round-16 (owner): the relationship bar is HIDDEN entirely -- the
    // "Combined view: X and Y..." banner, the child's upward pointer AND the
    // subqSplitChip_ "all queues" flag. The grouped table's own subheaders +
    // subtotals carry the relationship; the chip's mapping-mismatch warnings
    // now surface only via auditQueueSplitAttribution() (Operator State #41).
    // Everything below is kept intact -- flip the constant to restore it.
    if (SUBQ_BAR_HIDDEN_) { host.style.display = 'none'; host.innerHTML = ''; return; }
    var m = (state && state.meta) || {};
    var subs = m.subQueues || [];
    var parentOf = m.subQueueOf || null;
    if (!subs.length && !parentOf) { host.style.display = 'none'; host.innerHTML = ''; return; }
    host.style.display = '';
    var dept = m.department || '';

    // A CHILD dept just gets the upward pointer, because the
    // combined view belongs to the parent (one level, matching the server).
    if (!subs.length && parentOf) {
      host.innerHTML = '<div class="subq-bar-row">'
        + '<div class="ds-note subq-note">'
        + escapeHtml(dept) + ' is a sub-queue of <strong>'
        + escapeHtml(parentOf) + '</strong>. These figures are '
        + escapeHtml(dept) + '\u2019s only.</div>'
        + subqSplitChip_(m)
        + '</div>';
      return;
    }

    // OWNER ROUND: the three-way scope switcher is RETIRED. Every view it
    // offered is reachable from the combined table by collapsing a group --
    // "<dept> only" is the combined view with the sub-queue collapsed, and vice
    // versa -- and each dept's subtotal stays on screen either way. The tabs
    // cost a SERVER ROUND TRIP per view to show what a local toggle shows
    // instantly, and put the reader in a mode they then had to keep track of.
    //
    // The server still accepts `subScope` (it drives the CSV's Department
    // column and the combined default), so this is a client-side retirement,
    // not a capability removal. The client simply stops sending one and lets
    // the server pick: combined for a parent, own for everyone else.
    var list = subs.map(escapeHtml).join(', ');
    var one = subs.length === 1;
    host.innerHTML =
        '<div class="subq-bar-row">'
      +   '<div class="ds-note subq-note">Combined view: <strong>'
      +     escapeHtml(dept) + '</strong> and <strong>' + list + '</strong>, each '
      +     'with its own subtotal. ' + (one ? 'It ' : 'They ')
      +     'can be collapsed from its heading row below.</div>'
      +   subqSplitChip_(m)
      + '</div>';
  }

  /**
   * Sub-queue Phase 2: the "these numbers are not queue-split yet" disclosure.
   *
   * A per-queue split can only exist for dates built after the Phase 1 pipeline
   * shipped -- Call_Legs is pruned at 14 days, so earlier dates are
   * PERMANENTLY all-queue. For an agent who works two departments' queues,
   * an un-split figure includes the OTHER department's calls, which is exactly
   * the bug this feature exists to fix. Rendering that silently would be worse
   * than the bug, so the range says which of its days are narrowed.
   *
   * Returns '' when there is nothing to disclose (fully split, or a dept with
   * no sub-queue relationship at all).
   */
  function subqSplitChip_(m) {
    if (!m) return '';
    var hasRel = (m.subQueues && m.subQueues.length) || m.subQueueOf;
    if (!hasRel) return '';                       // nothing to be confused by
    var dept = m.department || 'this department';
    var label, tip;
    // B-1: the dept's mapped queue names matched NOTHING in this window's
    // per-queue detail, so the server kept the all-queue rollup rather than
    // reporting the dept as zero. This is a CONFIG fault and it is the loudest
    // thing this chip can say -- an admin has to fix it, and until they do the
    // sub-queue separation is simply not happening for this dept.
    if (m.queueSplitFellOpen) {
      // NB every branch builds tip as PLAIN text -- the single escapeHtml(tip)
      // at the return escapes it once. Escaping here too would double-encode
      // the queue names (which originate in the external CDR feed).
      label = 'all queues — queue mapping mismatch';
      tip = 'Per-queue detail exists for this range, but none of the queue names '
          + 'it carries (' + (m.queueSplitUnmatched || []).join(', ')
          + ') are mapped to ' + dept + '. Showing ALL-QUEUE figures rather than '
          + 'zero. Fix this in Dept Config → "Inbound queue aliases" (the raw '
          + 'phone-system names differ from the QCD-canonical ones), then re-run '
          + 'auditQueueSplitAttribution().';
    // S2-0: narrowing is switched OFF (QUEUE_SPLIT_SCOPE unset / 'off'), so
    // these figures are all-queue BY DESIGN and match every other page. Say
    // that plainly -- the legacy "detail is not available" wording below would
    // claim the data is missing when it is merely not being applied.
    } else if (m.queueSplitScope === 'off') {
      label = 'all queues';
      tip = 'These figures cover ALL queues these agents worked, matching the '
          + 'Overview, Insights and the Individual Report. Per-department '
          + 'narrowing is currently switched off (QUEUE_SPLIT_SCOPE) so every '
          + 'page reports the same basis; an agent who also works another '
          + 'department’s queue is counted in both.';
    } else if (m.queueSplitMapped === false) {
      label = 'all queues';
      tip = 'These figures cover ALL queues these agents worked. No queues are '
          + 'mapped to ' + dept + ', so there is nothing to narrow them to \u2014 '
          + 'map them in Dept Config (Admin \u25be \u2192 Dept Config).';
    } else if (m.queueSplitUnmatched && m.queueSplitUnmatched.length) {
      // B-1, partial case: SOME of the dept's queues matched, so the narrowing
      // is real and correct for those -- but the unmatched ones are being
      // dropped from this dept's totals with no other signal. Checked BEFORE
      // the fully-split early-return below, because a range can be 100%
      // split-aware and still be short a queue.
      label = 'missing a queue';
      tip = 'These figures are narrowed to ' + dept + '’s mapped queues, but '
          + 'this range also carries calls on ' + m.queueSplitUnmatched.join(', ')
          + ', which no mapping claims for ' + dept + ' — those calls are NOT '
          + 'counted here. If any of them belong to ' + dept + ', add them to Dept '
          + 'Config → "Inbound queue aliases".';
    } else {
      var days = m.queueSplitDays || 0;
      var total = daysInRangeInclusive_(m.from, m.to);
      if (days && total && days >= total) return '';   // fully split: say nothing
      if (!days) {
        label = 'all queues';
        tip = 'These figures cover ALL queues these agents worked, not just '
            + dept + '\u2019s. Per-queue detail is not available for this date '
            + 'range, so an agent who also works another department\u2019s queue '
            + 'reads high. Earlier days cannot be split retroactively.';
      } else {
        label = 'all queues before ' + (m.queueSplitFrom || '');
        tip = 'Per-queue detail starts ' + (m.queueSplitFrom || '') + '. Earlier '
            + 'days in this range count ALL queues an agent worked, so an agent '
            + 'who also works another department\u2019s queue reads high before '
            + 'that date. Earlier days cannot be split retroactively.';
      }
    }
    // A CHIP, not a banner (owner request), but deliberately still warn-toned
    // and still on screen: it states that the numbers above include another
    // department's calls, which changes how they should be read. A pure
    // tooltip would make that discoverable only by accident -- and right after
    // deploy EVERY range is pre-split, which is exactly when it matters most.
    // It removes itself once the range is fully split.
    return '<span class="subq-split-chip" title="' + escapeHtml(tip) + '">'
      + '\u26a0 ' + escapeHtml(label) + '</span>';
  }

  /** Inclusive day count between two ISO dates; 0 if either is unusable. */
  function daysInRangeInclusive_(fromIso, toIso) {
    if (!fromIso || !toIso) return 0;
    var a = Date.parse(fromIso + 'T00:00:00Z');
    var b = Date.parse(toIso + 'T00:00:00Z');
    if (isNaN(a) || isNaN(b) || b < a) return 0;
    return Math.round((b - a) / 86400000) + 1;
  }


  /**
   * Grouped tbody HTML for a combined view, or null when there is nothing to
   * group (single-dept payloads take the unchanged flat path).
   */
  function subqRowGroups_(state, sorted) {
    var m = (state && state.meta) || {};
    var order = m.deptsShown || [];
    var byDept = state.deptGroups || null;
    if (!byDept || order.length < 2) return null;
    var totalsFor = {};
    byDept.forEach(function (g) { totalsFor[g.dept] = g.totals || {}; });
    var collapsed = subqCollapsedGet_(m.department);
    // Round-16 tally: ONE unit across the whole combined cohort (both depts'
    // rows), so block counts compare across groups too.
    var tallyUnit = ansTallyUnitFor_(sorted);
    var out = [];
    order.forEach(function (d) {
      var rows = sorted.filter(function (r) { return r.dept === d; });
      if (!rows.length) return;
      var isChild = d !== m.department;
      var isShut = collapsed.indexOf(d) !== -1;
      // The group HEADER is the disclosure control. Collapsing hides the agent
      // rows but deliberately KEEPS the subtotal on screen -- that is the whole
      // point of the disclosure: you keep the department's number and drop the
      // detail. Replaces the three-way scope switcher, which needed a server
      // round trip per view to show the same thing.
      out.push('<tr class="subq-group-head' + (isShut ? ' is-collapsed' : '')
        + '" data-subq-group="' + escapeHtml(d) + '" tabindex="0" role="button"'
        + ' aria-expanded="' + (isShut ? 'false' : 'true') + '"'
        + ' title="' + (isShut ? 'Show' : 'Hide') + ' ' + escapeHtml(d)
        + '\u2019s agents (its subtotal stays visible)">'
        + '<td colspan="' + COLUMNS.length + '">'
        + '<span class="subq-caret" aria-hidden="true">' + (isShut ? '\u25b8' : '\u25be') + '</span> '
        + escapeHtml(d) + (isChild ? ' <span class="subq-tag">sub-queue</span>' : '')
        + ' <span class="subq-count">' + rows.length + ' agent'
        + (rows.length === 1 ? '' : 's') + '</span>'
        // Round-16 (owner): the "View <sub-queue>'s missed calls" button is
        // REMOVED from the group heading (it was the route to a child's own
        // missed report after the scope tabs retired; the owner ruled the
        // heading should stay clean -- a child's missed calls are reachable
        // from its own dept view via the header selector). The
        // subqMissedSetDept_ machinery stays inert behind it.
        + '</td></tr>');
      if (!isShut) rows.forEach(function (row) { out.push(subqAgentRowHtml_(row, tallyUnit)); });
      out.push(subqSubtotalRowHtml_(d, totalsFor[d] || {}));
    });
    return out.join('');
  }

  /**
   * Which groups are collapsed, per parent dept. Defaults to NONE -- the
   * combined view stays exactly what it was on open, and hiding is something
   * the reader chooses rather than something the page decides for them.
   */
  var SUBQ_COLLAPSE_KEY_ = 'cdr.dept.subqcollapse';
  function subqCollapsedGet_(dept) {
    if (!dept) return [];
    try {
      var all = JSON.parse(localStorage.getItem(SUBQ_COLLAPSE_KEY_) || '{}');
      var v = all && all[dept];
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function subqCollapsedToggle_(parentDept, group) {
    if (!parentDept || !group) return;
    try {
      var all = JSON.parse(localStorage.getItem(SUBQ_COLLAPSE_KEY_) || '{}');
      if (!all || typeof all !== 'object') all = {};
      var list = Array.isArray(all[parentDept]) ? all[parentDept] : [];
      var i = list.indexOf(group);
      if (i === -1) list.push(group); else list.splice(i, 1);
      all[parentDept] = list;
      localStorage.setItem(SUBQ_COLLAPSE_KEY_, JSON.stringify(all));
    } catch (e) { /* a full/blocked store just means collapse won't persist */ }
  }

  function subqAgentRowHtml_(row, tallyUnit) {
    var rowClass = (row.matchedViaQueue && !row.matchedViaRoster) ? 'via-queue' : '';
    return '<tr data-agent="' + escapeHtml(row.agent) + '" tabindex="0"'
      + (rowClass ? ' class="' + rowClass + '"' : '')
      + ' title="Open ' + escapeHtml(row.agent) + '\u2019s Individual Report">'
      + COLUMNS.map(function (col, i) {
          var fk = (col.type === 'bar') ? ' data-flash-key="ag:' + escapeHtml(row.agent) + '"' : '';
          return '<td class="' + cellClass_(col, i) + '"' + fk + '>' + fmtCell(col, row, { tallyUnit: tallyUnit }) + '</td>';
        }).join('') + '</tr>';
  }

  /** A department's OWN subtotal -- identical to what its own view shows. */
  function subqSubtotalRowHtml_(dept, totals) {
    return '<tr class="subq-subtotal">' + COLUMNS.map(function (col, i) {
      if (i === 0) return '<td>' + escapeHtml(dept) + ' subtotal</td>';
      if (col.key === 'sourceHomes' || col.type === 'source') return '<td></td>';
      return '<td class="' + cellClass_(col, i) + '">' + fmtCell(col, totals) + '</td>';
    }).join('') + '</tr>';
  }

  function renderDeptTeamStrip_(state) {
    var zone = $('dept-team-zone');
    var strip = $('dept-team-strip');
    if (!strip) return;
    var t = state && state.totals;
    if (!t || !state.rows || !state.rows.length) {
      strip.style.display = 'none'; strip.innerHTML = '';
      strip.classList.remove('ds-frost-host');   // a frosted strip that empties out drops its overlay too
      if (zone) zone.style.display = 'none';
      return;
    }
    var a = Number(t.totalAnswered) || 0;
    var m = Number(t.totalMissed)   || 0;
    var total = a + m;
    var rate = total ? Math.round(a / total * 100) : 0;

    var prior = deptTeamPrior_(state.rows);
    var priorTip = '';
    if (prior.has) {
      var pf = (state.meta && state.meta.priorFrom) || '';
      var pt = (state.meta && state.meta.priorTo)   || '';
      priorTip = 'Prior period ' + pf + ' – ' + pt;
    }
    var rateDeltaHtml = '', ansDeltaHtml = '';
    if (prior.has) {
      var pTotal = prior.answered + prior.missed;
      var pRate = pTotal ? Math.round(prior.answered / pTotal * 100) : 0;
      rateDeltaHtml = deptStripDelta_(rate - pRate, 'good', 1, ' pts', priorTip + ': ' + pRate + '%');
      ansDeltaHtml  = deptStripDelta_(a - prior.answered, 'good', WOW_NOISE_THRESHOLD, '', priorTip + ': ' + prior.answered);
    }

    var rateCls = total ? benchValueCls_('% answered', rate + '%', true) : '';
    var under92 = total && rate < answerTarget_('global');
    var fillPct = total ? Math.max(0, Math.min(100, rate)) : 0;

    var heroTile = '<div class="dts-tile dts-tile--hero">'
      + '<div class="dts-label">% Answered (rings) <span class="dts-scope">this range</span></div>'
      + '<div class="dts-value' + rateCls + '" data-flash-key="dts:rate">' + (total ? rate + '%' : '–') + '</div>'
      + '<div class="dts-track" title="' + answerTarget_('global') + '% company target">'
      +   '<span class="dts-track-fill' + (under92 ? ' is-under' : '') + '" style="width:' + fillPct + '%"></span>'
      +   '<span class="dts-track-tick" style="left:' + answerTarget_('global') + '%"></span>'
      + '</div>'
      + (rateDeltaHtml ? '<div class="dts-sub">' + rateDeltaHtml + ' vs prior</div>' : '')
      + '</div>';
    // Round-16 (owner request, refined): the 'Answered' and 'Queue calls'
    // tiles MERGE into ONE tile reading "<queue total> (<answered> /
    // <abandoned>)" -- total in ink, answered sage, abandoned warm (muted
    // when 0). All three figures are the SAME population (QCD: total =
    // answered + abandoned across the dept's mapped queues), which is what
    // makes the parenthetical a true breakdown -- the earlier draft paired
    // the DQE agent-answered count with the queue total, two populations
    // that don't subtract. The DQE answered count still reads from the hero
    // % and the table's pinned Total row. Sub-line keeps the multi-day
    // per-workday pace. A dept with no queue range data keeps the plain
    // (DQE) Answered tile.
    var ansTile;
    // Batch D: range-scoped queue figures come from the QCD snapshot's
    // `range` block (own-queues-only, the selected From/To); the per-WORKDAY
    // rate uses the INV-35 workingDaysBetween_ mirror, so it agrees with the
    // Insights workday math.
    var qAbdTile = '';
    var qr = state.qcd && state.qcd.range;
    var hasQueueRange = !!(qr && (Number(qr.totalCalls) || 0) > 0);
    if (hasQueueRange) {
      var qCalls = Number(qr.totalCalls) || 0;
      var qAbd   = Number(qr.abandoned) || 0;
      var abStr  = qr.abandonedPctStr || ((Number(qr.abandonedPct) || 0).toFixed(2) + '%');
      var abCls  = benchValueCls_('abandoned %', abStr, true);   // 5% company standard
      var qFrom = (state.meta && state.meta.from) || ($('from-date') && $('from-date').value) || '';
      var qTo   = (state.meta && state.meta.to)   || ($('to-date')   && $('to-date').value)   || '';
      var wd = workingDaysBetween_(qFrom, qTo);
      // QCD identity: total = answered + abandoned; prefer the block's own
      // answered figure, derive only if a stale payload lacks it.
      var qAns = (qr.totalAnswered != null) ? (Number(qr.totalAnswered) || 0)
                                            : Math.max(0, qCalls - qAbd);
      // R7 (M-4): a 1-workday range's "≈ N/day over 1 workday" just restates
      // the headline number -- the per-day pace joins the sub only on
      // multi-day ranges (the tooltip carries scope on single days).
      var qPaceSub = wd > 1
        ? '<div class="dts-sub">&asymp; ' + (Math.round((qCalls / wd) * 10) / 10)
          + '/day over ' + wd + ' workdays</div>'
        : '';
      ansTile =
          '<div class="dts-tile dts-tile--queue" title="Calls offered to the department&#39;s mapped queues this range &mdash; total (answered / abandoned). Workdays = Mon&ndash;Fri minus company holidays.">'
        +   '<div class="dts-label">Queue calls <span class="dts-scope">this range</span></div>'
        +   '<div class="dts-value dts-value--split">'
        +     '<span class="dts-qcalls" data-flash-key="dts:qcalls">' + fmtNumber(qCalls) + '</span>'
        +     ' <span class="dts-paren">(</span>'
        +     '<span class="dts-ans" data-flash-key="dts:qans">' + fmtNumber(qAns) + '</span>'
        +     '<span class="dts-sep"> / </span>'
        +     '<span class="dts-abd' + (qAbd > 0 ? '' : ' is-zero') + '" data-flash-key="dts:qabdn">' + fmtNumber(qAbd) + '</span>'
        +     '<span class="dts-paren">)</span>'
        +   '</div>'
        +   qPaceSub
        + '</div>';
      // (Its "N abandoned" sub is gone -- the count now reads in warm type
      // one tile over, and restating it side-by-side was pure duplication.)
      qAbdTile =
          '<div class="dts-tile dts-tile--queue">'
        +   '<div class="dts-label">Abandoned %</div>'
        +   '<div class="dts-value' + abCls + '" data-flash-key="dts:qabd">' + escapeHtml(abStr) + '</div>'
        + '</div>';
    } else {
      ansTile = '<div class="dts-tile">'
        + '<div class="dts-label">Answered</div>'
        + '<div class="dts-value" data-flash-key="dts:answered">' + fmtNumber(a) + '</div>'
        + (ansDeltaHtml ? '<div class="dts-sub">' + ansDeltaHtml + ' vs prior</div>' : '')
        + '</div>';
    }
    // (Owner round: the Missed + Avg-talk tiles were dropped so the strip fits
    // one row -- missed lives in the agent table's split bar + the Missed
    // section below; ATT keeps its per-agent column.)

    // R10-5: Avg answer time tile -- answered-weighted over the dept's own
    // queues for the selected range (qcd.range.avgAnswer, QCD Historical
    // Data col J). Renders wherever the data exists (any QCD-mapped dept).
    // R11-C1: + a delta chip vs the E5 prior window (qcd.rangePrior).
    // LOWER is better for time-to-answer, so valence is inverted ('bad' =
    // an increase warns); 3s noise threshold.
    var qAvgTile = '';
    if (qr && qr.avgAnswer) {
      var qAvgChip = '';
      var qrp = state.qcd && state.qcd.rangePrior;
      if (qrp && qrp.avgAnswerSec != null && qr.avgAnswerSec != null) {
        qAvgChip = deptStripDelta_(qr.avgAnswerSec - qrp.avgAnswerSec, 'bad', 3, 's',
          priorTip + ': ' + qrp.avgAnswer);
      }
      qAvgTile =
          '<div class="dts-tile dts-tile--queue" title="Answered-weighted average time to answer across the department&#39;s mapped queues, this range.">'
        +   '<div class="dts-label">Avg answer <span class="dts-scope">queue</span></div>'
        +   '<div class="dts-value" data-flash-key="dts:qavg">' + escapeHtml(qr.avgAnswer) + '</div>'
        +   '<div class="dts-sub">' + (qAvgChip ? qAvgChip + ' vs prior' : 'time to answer') + '</div>'
        + '</div>';
    }
    // R10-5: Transfer % tile -- CSR only (server ships csrTransfer only for
    // CSR, from CSR Transfer Historical Data; weighted transferred/total).
    // R11-C1: + a delta chip vs the prior window (csrTransfer.prior). A
    // transfer-rate INCREASE reads warn (more hand-offs); 1pt noise floor.
    var trTile = '';
    var tr = state.csrTransfer;
    if (tr && tr.pctStr) {
      var trChip = '';
      if (tr.prior && tr.prior.pct != null && tr.pct != null) {
        trChip = deptStripDelta_(Math.round((tr.pct - tr.prior.pct) * 10) / 10, 'bad', 1, ' pts',
          priorTip + ': ' + tr.prior.pctStr);
      }
      trTile =
          '<div class="dts-tile dts-tile--queue" title="Transferred &divide; total calls across CSR agents, this range (CSR Transfer Historical Data).">'
        +   '<div class="dts-label">Transfer % <span class="dts-scope">this range</span></div>'
        +   '<div class="dts-value" data-flash-key="dts:transfer">' + escapeHtml(tr.pctStr) + '</div>'
        +   '<div class="dts-sub">' + fmtNumber(tr.transferred) + ' of ' + fmtNumber(tr.totalCalls) + ' calls'
        +     (trChip ? ' &middot; ' + trChip + ' vs prior' : '') + '</div>'
        + '</div>';
    }

    strip.innerHTML = heroTile + ansTile + qAbdTile + qAvgTile + trTile;
    strip.style.display = '';
    if (zone) zone.style.display = '';
    // Round-16: the innerHTML replace above destroyed any active frost
    // overlay (the SWR pre-paint renders while the live fetch is still out;
    // the .ds-frost-host class survives the wipe) -- restore it so the strip
    // stays visibly "refreshing" until the live repaint unfrosts.
    if (strip.classList.contains('ds-frost-host')) dsFrostShow_(strip, 'Refreshing…');
    dsFlashChanged_(strip, 'deptstrip:' + getRequestedDept());
  }

  // (Round-16, owner: renderDeptInsightsStrip_/wireDeptInsightsStrip_ -- the
  // Insights hand-off TEASER STRIP -- are RETIRED. The lens switcher in the
  // controls row is the route to Insights now, via handoffToInsights_.)

  function render() {
    // Header sort arrows
    document.querySelectorAll('#agents-table thead th[data-sort]').forEach(function (th) {
      const key = th.getAttribute('data-sort');
      const arrow = th.querySelector('.arrow');
      if (!arrow) return;
      if (key === state.sortKey) {
        arrow.textContent = state.sortDir === 'asc' ? '▲' : '▼';
        arrow.style.color = THEME.ink || '#374151';
        th.setAttribute('aria-sort', state.sortDir === 'asc' ? 'ascending' : 'descending');
      } else {
        arrow.textContent = '▽';
        arrow.style.color = THEME.muted || '#9ca3af';
        th.removeAttribute('aria-sort');
      }
    });

    subqRenderScopeBar_(state);

    const tbody = $('agents-tbody');
    const tfoot = $('agents-tfoot');

    if (!state.rows.length) {
      tbody.innerHTML = '';
      tfoot.innerHTML = '';
      renderDeptTeamStrip_(state);   // B1: hides itself when there are no rows
      return;
    }

    const sorted = sortRows(state.rows, state.sortKey, state.sortDir);
    // Sub-queue Phase 1: in a COMBINED view, rows are grouped under a per-dept
    // subheader with that dept's own subtotal, so nothing is silently summed.
    // Sorting stays GLOBAL within each group (the group order follows
    // meta.deptsShown, i.e. parent first), so a manager's chosen sort still
    // means what it did -- it just applies inside each department.
    // Round-16 tally: cohort-wide block unit (same scale for every agent row).
    const tallyUnit = ansTallyUnitFor_(sorted);
    const groups = subqRowGroups_(state, sorted);
    if (groups) { tbody.innerHTML = groups; }
    else {
    tbody.innerHTML = sorted.map(function (row) {
      // Agents matched only via queue (not in the roster) get a small
      // "(queue-only)" tag next to the name in CSS.
      // Phase D: the .via-queue row class is no longer needed for
      // visual distinction (the Source chip handles that), but we
      // keep it so any consumer that styles whole-row queue-only
      // emphasis (e.g. user CSS, future hover handling) still works.
      const rowClass = (row.matchedViaQueue && !row.matchedViaRoster) ? 'via-queue' : '';
      // data-agent powers the row drill-through to the Individual Report.
      // F13: tabindex makes the drill keyboard-reachable (the delegated
      // keydown on #agents-tbody activates it); no role override -- see
      // makeActivatable_'s note on preserving table row semantics.
      return '<tr data-agent="' + escapeHtml(row.agent) + '" tabindex="0"'
           + (rowClass ? ' class="' + rowClass + '"' : '')
           + ' title="Open ' + escapeHtml(row.agent) + '’s Individual Report">'
           + COLUMNS.map(function (col, i) {
        // B1: tag the Answered/Missed bar cell so a date-range refresh flashes
        // the agents whose volume actually changed (key by agent name, stable).
        var fk = (col.type === 'bar') ? ' data-flash-key="ag:' + escapeHtml(row.agent) + '"' : '';
        return '<td class="' + cellClass_(col, i) + '"' + fk + '>' + fmtCell(col, row, { tallyUnit: tallyUnit }) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    }

    if (state.totals) {
      // Roster-vs-floater count caption surfaced as the tfoot's
      // first cell when queue-only floaters are visible. Keeps the
      // "totals exclude floaters" semantics legible without a second
      // tfoot row. Falls back to the plain "Total" label when there
      // are no floaters in the current view.
      const queueCount = state.totals.queueOnlyAgentCount || 0;
      // Sub-queue Phase 0: in a combined view an agent on BOTH depts' rosters
      // is one person shown in two groups, so the grand total counts them ONCE
      // and is therefore LESS than the sum of the per-dept subtotals. That
      // mismatch has to be stated: the whole point of per-dept subtotals is
      // that a reader can add them up, and an unexplained shortfall reads as a
      // bug. The subtotals stay un-deduped on purpose -- each is exactly what
      // that dept's own view shows (S35).
      const crossCount = state.totals.crossoverAgentCount || 0;
      const parts = [];
      if (queueCount > 0) {
        parts.push(queueCount + ' floater' + (queueCount === 1 ? '' : 's') + ' excluded');
      }
      if (crossCount > 0) {
        parts.push(crossCount + ' in both departments, counted once');
      }
      const totalLabel = parts.length
        ? 'Total (roster only · ' + parts.join(' · ') + ')'
        : 'Total';
      tfoot.innerHTML = '<tr>' + COLUMNS.map(function (col, i) {
        if (i === 0) return '<td>' + totalLabel + '</td>';
        // Source column has no aggregate value -- leave its tfoot
        // cell empty so it doesn't try to render a chip from totals.
        if (col.type === 'chip' && col.key === 'source') return '<td class="src-cell' + (col.hideable ? ' col-extra' : '') + '"></td>';
        // The bar / num / duration cells render from the totals object
        // (ATT and abd-wait are weighted on the server).
        return '<td class="' + cellClass_(col, i) + '">' + fmtCell(col, state.totals, { tallyLegend: tallyUnit }) + '</td>';
      }).join('') + '</tr>';
    } else {
      tfoot.innerHTML = '';
    }
    // B1: team summary strip for the selected range (roster rollup), lifted
    // from the same server totals -- rendered here so it repaints on sort /
    // refresh alongside the table.
    renderDeptTeamStrip_(state);
    // B1: flash agents whose Answered/Missed changed since the last paint for
    // this dept. Scoped per dept so switching depts doesn't cross-flash; a sort
    // re-render leaves values unchanged per key, so it never flashes.
    dsFlashChanged_($('agents-tbody'), 'dept:' + getRequestedDept());
  }

  // Round-16 (owner): "Email me this report" -- the styled EmailKit summary
  // of the current dept + range, sent to the signed-in requester only
  // (server: sendDepartmentSummaryEmail, which re-runs the same auth +
  // compute path as the table's own fetch).
  function deptEmailReport_() {
    var dept = getRequestedDept();
    var from = $('from-date') ? $('from-date').value : '';
    var to = $('to-date') ? $('to-date').value : '';
    if (!dept || !from || !to) {
      showToast('Pick a department and date range first', 'error');
      return;
    }
    showToast('Sending…');
    google.script.run
      .withSuccessHandler(function (res) {
        showToast('Report emailed to ' + (res && res.to ? res.to : 'you'), 'success');
      })
      .withFailureHandler(function (err) {
        showToast('Email failed: ' + (err && err.message ? err.message : err), 'error');
      })
      .sendDepartmentSummaryEmail({ department: dept, from: from, to: to });
  }

  // -- CSV export for the main agent table --------------------------------
  function exportTableCsv_() {
    var sorted = sortRows(state.rows, state.sortKey, state.sortDir);
    if (!sorted.length) return;
    var csvEscape = function (v) {
      var s = csvSafeCell_(v);
      return (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1)
        ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    // CSV exports ALL columns (incl. the foldable detail ones) regardless
    // of the on-screen toggle -- a data dump should be complete. The bar
    // column emits "answered / missed (rate%)" text.
    var barCsv = function (row) {
      var a = Number(row.totalAnswered) || 0, m = Number(row.totalMissed) || 0, t = a + m;
      return a + ' / ' + m + (t ? ' (' + Math.round(a / t * 100) + '%)' : '');
    };
    // #8: Answer % column value for CSV (answered / (answered+missed)).
    var pctCsv = function (row) {
      var a = Number(row.totalAnswered) || 0, m = Number(row.totalMissed) || 0, t = a + m;
      return t ? Math.round(a / t * 100) + '%' : '';
    };
    // Owner round 4: the on-screen Total-calls column folded into the bar,
    // but the CSV stays complete -- a numeric Total calls column is spliced
    // in right after the bar column.
    // Sub-queue Phase 1 follow-up: in a COMBINED view the flat CSV was
    // unreadable -- no way to tell which department a row belonged to, and no
    // subtotals, so the on-screen grouping was lost entirely on export. A
    // leading Department column is added ONLY when more than one dept is shown,
    // so a single-dept export is byte-identical to before.
    var deptsShown = (state.meta && state.meta.deptsShown) || [];
    var multiDept = deptsShown.length > 1 && !!state.deptGroups;
    var cellsFor = function (row, isTotals, deptLabel) {
      var out = [];
      if (multiDept) out.push(csvEscape(deptLabel == null ? (row.dept || '') : deptLabel));
      COLUMNS.forEach(function (col, i) {
        if (isTotals && i === 0) { out.push(csvEscape(isTotals === 'sub'
          ? (deptLabel || '') + ' subtotal'
          // Phase 0: say it here too. A spreadsheet reader is MORE likely than
          // an on-screen one to add the subtotals up and find them larger than
          // the grand total, and they have no tooltip to fall back on.
          : ((state.totals && state.totals.crossoverAgentCount)
             ? 'Total (roster only · ' + state.totals.crossoverAgentCount
               + ' in both departments, counted once)'
             : 'Total (roster only)'))); }
        // Source column has no aggregate meaning in the totals row.
        else if (col.type === 'chip' && col.key === 'source') out.push(isTotals ? '' : csvEscape(sourceChipCsv_(row)));
        else if (col.type === 'bar') out.push(csvEscape(barCsv(row)));
        else if (col.type === 'pct') out.push(csvEscape(pctCsv(row)));
        else if (col.type === 'duration') out.push(csvEscape(fmtDuration(row[col.key])));
        else out.push(csvEscape(row[col.key]));
        if (col.type === 'bar') out.push(csvEscape(row.totalRung != null ? row.totalRung : ''));
      });
      return out.join(',');
    };
    var header = COLUMNS.reduce(function (acc, c) {
      acc.push(csvEscape(c.label));
      if (c.type === 'bar') acc.push(csvEscape('Total calls'));
      return acc;
    }, multiDept ? [csvEscape('Department')] : []).join(',');
    var rows = [];
    if (multiDept) {
      // Grouped like the table: each dept's rows, then that dept's OWN
      // subtotal (from deptGroups, i.e. the same numbers its own view shows),
      // then the labelled grand total. NO group-header pseudo-rows -- a
      // spreadsheet reader wants a Department COLUMN it can pivot on, not
      // banner rows that break sorting and filtering.
      var subtotalFor = {};
      (state.deptGroups || []).forEach(function (g) { subtotalFor[g.dept] = g.totals || {}; });
      deptsShown.forEach(function (d) {
        var mine = sorted.filter(function (r) { return r.dept === d; });
        if (!mine.length) return;
        mine.forEach(function (row) { rows.push(cellsFor(row, false)); });
        rows.push(cellsFor(subtotalFor[d] || {}, 'sub', d));
      });
      if (state.totals) rows.push(cellsFor(state.totals, true, 'All shown'));
    } else {
      sorted.forEach(function (row) { rows.push(cellsFor(row, false)); });
      if (state.totals) rows.push(cellsFor(state.totals, true));
    }
    var blob = new Blob([header + '\n' + rows.join('\n')], { type: 'text/csv' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var scopeTag = (state.meta && state.meta.subScope && state.meta.subScope !== 'own')
      ? '_' + state.meta.subScope : '';
    a.download = (getRequestedDept() || 'department') + scopeTag + '_'
      + (($('from-date') && $('from-date').value) || 'data') + '_to_'
      + (($('to-date') && $('to-date').value) || 'data') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

</script>
