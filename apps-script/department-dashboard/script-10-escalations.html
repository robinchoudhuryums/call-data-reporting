    var a     = Number(r.totalAnswered) || 0;
    var ab    = Number(r.abandoned)     || 0;
    var pctA  = total ? (a  / total * 100) : 0;
    var pctAb = total ? (ab / total * 100) : 0;
    var rest  = Math.max(0, 100 - pctA - pctAb);
    var abStr = r.abandonedPctStr || ((Number(r.abandonedPct) || 0).toFixed(2) + '%');
    // #3d: over the abandon threshold reads BOLD (+ the warn tint from benchValueCls_)
    // so it pops on the split bar and the granular source lines.
    var over = (Number(r.abandonedPct) || 0) >= ABANDON_STANDARD_;
    var rateCls = benchValueCls_('abandoned %', abStr, true) + (over ? ' qcd-rate-over' : '');
    var title = fmtNumber(a) + ' answered · ' + fmtNumber(ab) + ' abandoned · '
              + fmtNumber(total) + ' calls · ' + abStr + ' abandoned';
    // QV-1 (opt-in, all-dept report only): an abandon-threshold tick on the split
    // bar. The bar is share-of-total (green answered, then red abandoned),
    // so the tick sits at (answered% + the standard) -- the red segment ENDING past it
    // is exactly "abandoned > standard% of offered". Hidden when answered is so high
    // the tick would overflow (abandon can't exceed the standard there anyway)
    // and on zero-volume rows. Screen-only decoration (`qcd-screen-only` is
    // stripped by the print path; the CSV builds from data, never the DOM) --
    // exported cell text is unchanged.
    var tick = '';
    if (opts && opts.tick && total > 0 && (pctA + ABANDON_STANDARD_) < 100) {
      tick = '<span class="qcd-thresh-tick qcd-screen-only" style="left:' + (pctA + ABANDON_STANDARD_) + '%"></span>';
    }
    var segs = total
      ? '<span class="ans-seg ans" style="width:' + pctA + '%"></span>'
        + '<span class="ans-seg miss" style="width:' + pctAb + '%"></span>'
        + (rest > 0.1 ? '<span class="ans-seg none" style="width:' + rest + '%"></span>' : '')
      : '<span class="ans-seg none" style="width:100%"></span>';
    // R10-4: passing the abandon standard renders the abandoned segment
    // light/translucent; failing keeps the full red (value bolding already
    // rides .qcd-rate-over above).
    var passCls = total ? (over ? ' ans-bar--fail' : ' ans-bar--pass') : '';
    // Round-16 (owner): opts.tallyUnit > 0 renders the agent-table's
    // volume-proportional TALLY instead of the fixed-length bar -- answered
    // sage + abandoned red blocks at the caller's cohort-shared unit, so a
    // busy queue visibly dwarfs a quiet one. Callers keep the classic bar on
    // subtotal / company rows (aggregates dwarf queue-scale blocks). The
    // Insights daily breakdown tallies too (owner follow-up) -- its unit is
    // computed per render from the DISPLAYED rows (insQhDailyRender_), so a
    // re-scope to a quiet sub-queue re-normalizes instead of shrinking to
    // dots. The abandon-standard soft-red treatment rides the same ans-bar--pass
    // class.
    var useTally = opts && opts.tallyUnit > 0 && total > 0;
    if (useTally && opts.tallyUnit > 1) title += ' · each block ≈ ' + opts.tallyUnit + ' calls';
    // R18b (owner): CLIP at opts.tallyMax when the caller sets one. Callers
    // that share ONE unit across a whole report (the all-departments table)
    // need it: a fine unit is what makes the small queues separable, and
    // without a ceiling the busiest queue then wraps into a block of colour
    // that dwarfs the table. Proportions between answered and abandoned are
    // preserved inside the ceiling, and the row carries a "»" so a clipped
    // bar reads as "off the scale, see the count" rather than as a tie with
    // the longest. Callers with a per-cohort unit pass no max and are
    // unchanged (their unit already fits by construction).
    var nA = a > 0 ? Math.max(1, Math.round(a / (opts && opts.tallyUnit))) : 0;
    var nAb = ab > 0 ? Math.max(1, Math.round(ab / (opts && opts.tallyUnit))) : 0;
    var tallyMax = (opts && opts.tallyMax > 0) ? opts.tallyMax : 0;
    var clipped = useTally && tallyMax > 0 && (nA + nAb) > tallyMax;
    if (clipped) {
      var keepAb = nAb > 0 ? Math.min(nAb, Math.max(1, Math.round(tallyMax * nAb / (nA + nAb)))) : 0;
      nAb = keepAb;
      nA = Math.max(0, tallyMax - keepAb);
      title += ' · bar clipped at ' + tallyMax + ' blocks';
    }
    var track = useTally
      ? '<div class="ans-tally" aria-hidden="true">'
        + ansTallyBlocksN_(nA, 'a') + ansTallyBlocksN_(nAb, 'm')
        + (clipped ? '<span class="tly-clip" title="past the end of the shared scale">&raquo;</span>' : '')
        + '</div>'
      : '<div class="ans-track">' + segs + tick + '</div>';
    // Round-16b (owner): the counts color-code to their blocks -- a zero
    // count carries is-zero so quiet days mute instead of flashing a bold
    // green/red 0 (CSS scopes the treatment to .qcd-daily-bar-cell).
    return '<div class="ans-bar' + passCls + '" title="' + escapeHtml(title) + '">'
         +   track
         +   '<div class="ans-nums">'
         +     '<span class="ans-n'  + (a  === 0 ? ' is-zero' : '') + '">' + fmtNumber(a)  + '</span>'
         +     '<span class="ans-slash">/</span>'
         +     '<span class="miss-n' + (ab === 0 ? ' is-zero' : '') + '">' + fmtNumber(ab) + '</span>'
         +     '<span class="ans-rate' + rateCls + '">' + (total ? abStr : '–') + '</span>'
         +   '</div>'
         + '</div>';
  }

  // Shared daily QCD rows. Default = the QCD modal's 6-column numeric table.
  // opts.bar (Insights Daily breakdown) folds Answered / Abandoned / Abandoned %
  // into one split-bar cell -- 4 columns: Date | Total | Answered vs Abandoned |
  // Violations (keep the #ins-qh-daily thead in sync).
  function qcdDailyRowsHtml_(rows, opts) {
    var bar = !!(opts && opts.bar);
    return (rows || []).map(function (r) {
      var pct = Number(r.abandonedPct) || 0;
      var pctCls = pct >= ABANDON_STANDARD_ ? 'num qcd-warn-light' : 'num';
      var viol = Number(r.violations) || 0;
      var violCls = viol > 0 ? 'num qcd-warn-light' : 'num';
      // data-date keys the violation-date -> daily-row jump (insJumpToDailyRow_).
      if (bar) {
        // opts.tallyUnit forwards to the shared cell so the Insights Daily
        // breakdown renders the volume tally (0/omitted keeps the classic bar).
        return '<tr data-date="' + escapeHtml(r.date) + '">'
             +   '<td>' + escapeHtml(r.date) + '</td>'
             +   '<td class="num">' + fmtNumber(r.totalCalls) + '</td>'
             +   '<td class="qcd-daily-bar-cell">' + qcdDailyBarCell_(r, (opts && opts.tallyUnit > 0) ? { tallyUnit: opts.tallyUnit } : null) + '</td>'
             +   '<td class="' + violCls + '">' + fmtNumber(r.violations) + '</td>'
             + '</tr>';
      }
      return '<tr data-date="' + escapeHtml(r.date) + '">'
           +   '<td>' + escapeHtml(r.date) + '</td>'
           +   '<td class="num">' + fmtNumber(r.totalCalls)    + '</td>'
           +   '<td class="num">' + fmtNumber(r.totalAnswered) + '</td>'
           +   '<td class="num">' + fmtNumber(r.abandoned)     + '</td>'
           +   '<td class="' + pctCls + '">' + escapeHtml(r.abandonedPctStr) + '</td>'
           +   '<td class="' + violCls + '">' + fmtNumber(r.violations)    + '</td>'
           + '</tr>';
    }).join('');
  }

  // Pure: the per-call-source breakdown subtable (Overall + CSR / Ad-campaign /
  // New Call Menu / Non-CSR ...) shared by the QCD modal's expandable queue
  // rows AND the Insights Queue health expandable rows (consolidation Phase 1,
  // gap 2). '' when there are no sources.
  function qcdSourceSubtableHtml_(sources) {
    sources = sources || [];
    if (!sources.length) return '';
    return '<table class="qcd-source-subtable"><thead><tr>'
         +    '<th>Call source</th><th class="num">Total</th><th class="num">Answered</th>'
         +    '<th class="num">Abandoned</th><th class="num">Aban %</th>'
         +    '<th class="num">Longest</th><th class="num">Avg ans</th><th class="num">Viol</th>'
         +  '</tr></thead><tbody>'
         +  sources.map(function (s) {
              var sPct = Number(s.abandonedPct) || 0;
              var sViol = Number(s.violations) || 0;
              return '<tr class="' + (s.isOverall ? 'qcd-source-overall' : '') + '">'
                +  '<td>' + escapeHtml(s.source) + '</td>'
                +  '<td class="num">' + fmtNumber(s.totalCalls)    + '</td>'
                +  '<td class="num">' + fmtNumber(s.totalAnswered) + '</td>'
                +  '<td class="num">' + fmtNumber(s.abandoned)     + '</td>'
                +  '<td class="num' + (sPct >= ABANDON_STANDARD_ ? ' qcd-warn-light qcd-rate-over' : '') + '">' + escapeHtml(s.abandonedPctStr) + '</td>'
                +  '<td class="num">' + escapeHtml(s.longestWait)  + '</td>'
                +  '<td class="num">' + escapeHtml(s.avgAnswer)    + '</td>'
                +  '<td class="num' + (sViol > 0 ? ' qcd-warn-light' : '') + '">' + fmtNumber(s.violations) + '</td>'
                +  '</tr>';
            }).join('')
         +  '</tbody></table>';
  }

</script>
