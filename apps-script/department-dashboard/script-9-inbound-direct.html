      if (!tbEl) return;
      srtApply_(id, g.rows, function (sorted) {
        tbEl.innerHTML = sorted.map(directAgentRowHtml_).join('');
      }, directImpact_);
    });
  }

  function directCallDownloadCsv_() {
    if (!directCallLastData || (directCallLastData.meta || {}).available === false) return;
    const d = directCallLastData;
    const meta = d.meta || {};
    const esc = function (v) {
      const s = csvSafeCell_(v == null ? '' : v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    const row = function (cells) { return cells.map(esc).join(','); };
    const lines = [];
    lines.push(row(['Direct Calls report', meta.from + ' to ' + meta.to]));
    lines.push(row(['Scope', meta.companyView ? 'All departments' : (meta.department || '')]));
    lines.push('');
    lines.push(row(['Agent', 'Dept', 'IB answered', 'IB missed (free)', 'IB missed (busy)',
      'Answer %', 'IB ATT sec', 'OB calls', 'OB connected', 'OB ATT sec',
      'IB int answered', 'IB ext answered', 'OB int calls', 'OB ext calls']));
    (d.agents || []).forEach(function (r) {
      lines.push(row([r.agent, r.dept, r.ibAnswered, r.ibMissedFree, r.ibMissedBusy,
        r.ibAnswerRate != null ? r.ibAnswerRate : '', r.ibAttSec, r.obTotal, r.obConnected, r.obAttSec,
        r.ibIntAnswered, r.ibExtAnswered, r.obIntTotal, r.obExtTotal]));
    });
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'direct-calls_' + (meta.from || '') + '_' + (meta.to || '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 0);
  }

  // -- Outbound report (Batch G, admin-only while vetted) ------------------
  // "Did we call back the ones who abandoned?" + per-agent outbound activity
  // from getOutboundReport (OutboundReport.gs). Mirrors the Direct report's
  // client shape (form -> results, stale-response token, csvSafeCell_ CSV).
  // The two caveat captions in the markup are part of the report's contract.

  var outboundLastData = null;

  function initOutboundReport() {
    const btn = $('outbound-report-btn');
    const modal = $('outbound-modal');
    if (!btn || !modal) return;
    const closeBtn = modal.querySelector('.modal-close');
    const backdrop = modal.querySelector('[data-close]');

    function openModal() {
      modal.style.display = '';
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      trapFocus_(modal);
      initModalDragResize_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.addEventListener('keydown', onKeyDown);
      outboundShowForm();
      outboundSetDefaultDates();
      outboundEnsureDeptOptions_();
    }
    function closeModal() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      releaseFocus_();
      resetModalTransform_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKeyDown);
      btn.focus();
    }
    function onKeyDown(e) { if (e.key === 'Escape') closeModal(); }

    btn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (backdrop) backdrop.addEventListener('click', closeModal);

    const preset = $('outbound-preset');
    if (preset) preset.addEventListener('change', outboundApplyPreset);
    const fromEl = $('outbound-from'), toEl = $('outbound-to');
    if (fromEl) fromEl.addEventListener('change', function () { if ($('outbound-preset')) $('outbound-preset').value = 'custom'; });
    if (toEl)   toEl.addEventListener('change',   function () { if ($('outbound-preset')) $('outbound-preset').value = 'custom'; });
    const gen = $('outbound-generate-btn');
    if (gen) gen.addEventListener('click', runOutboundReport);
    const back = $('outbound-back-btn');
    if (back) back.addEventListener('click', outboundShowForm);
    const csv = $('outbound-csv-btn');
    if (csv) csv.addEventListener('click', outboundDownloadCsv_);
  }

  function outboundShowForm()    { $('outbound-form').style.display = ''; $('outbound-results').style.display = 'none'; outboundSetError(''); }
  function outboundShowResults() { $('outbound-form').style.display = 'none'; $('outbound-results').style.display = ''; }
  function outboundSetError(msg) {
    const el = $('outbound-form-error'); if (!el) return;
    if (!msg) { el.style.display = 'none'; el.textContent = ''; return; }
    el.textContent = msg; el.style.display = '';
  }
  function outboundSetDefaultDates() {
    if ($('outbound-from') && $('outbound-from').value) return;
    const today = new Date(); const s = new Date(today); s.setDate(today.getDate() - 30);
    if ($('outbound-from')) $('outbound-from').value = directCallIsoOf_(s);
    if ($('outbound-to'))   $('outbound-to').value   = directCallIsoOf_(today);
  }
  function outboundApplyPreset() {
    const v = $('outbound-preset').value;
    if (v === 'custom') return;
    const today = new Date(); let s, e = new Date(today);
    if (v === 'last7')        { s = new Date(today); s.setDate(today.getDate() - 7); }
    else if (v === 'last30')  { e = new Date(today); e.setDate(today.getDate() - 1);
                                s = new Date(today); s.setDate(today.getDate() - 30); }
    else if (v === 'thisMonth') { s = new Date(today.getFullYear(), today.getMonth(), 1); }
    else if (v === 'lastMonth') { s = new Date(today.getFullYear(), today.getMonth() - 1, 1); e = new Date(today.getFullYear(), today.getMonth(), 0); }
    else if (v === 'last3Months') { s = new Date(today); s.setMonth(today.getMonth() - 3); }
    if (!s) return;
    $('outbound-from').value = directCallIsoOf_(s);
    $('outbound-to').value   = directCallIsoOf_(e);
  }
  function outboundEnsureDeptOptions_() {
    const sel = $('outbound-dept');
    if (!sel || sel.options.length) return;
    if (USER.role === 'admin') {
      const opts = ['<option value="">All departments</option>'];
      (USER.departments || []).forEach(function (d) {
        opts.push('<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>');
      });
      sel.innerHTML = opts.join('');
    } else {
      const d = USER.department || '';
      sel.innerHTML = '<option value="' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>';
      sel.disabled = true;
    }
  }

  function runOutboundReport() {
    const from = $('outbound-from').value, to = $('outbound-to').value;
    if (!from || !to) { outboundSetError('Pick a start and end date.'); return; }
    if (from > to) { outboundSetError('Start date must be on or before end date.'); return; }
    outboundSetError('');
    const dept = $('outbound-dept') ? $('outbound-dept').value : '';
    const gen = $('outbound-generate-btn'); const prev = gen.textContent;
    gen.disabled = true; gen.innerHTML = DS_EQ_HTML_ + 'Generating…';
    const __rtok = ++reportReqSeq_.out;   // C-8: stale-response guard
    google.script.run
      .withSuccessHandler(function (data) {
        if (__rtok !== reportReqSeq_.out) return;
        gen.disabled = false; gen.textContent = prev;
        outboundRenderReport_(data);
        outboundShowResults();
      })
      .withFailureHandler(function (err) {
        if (__rtok !== reportReqSeq_.out) return;
        gen.disabled = false; gen.textContent = prev;
        outboundSetError('Error: ' + (err && err.message ? err.message : String(err)));
      })
      .getOutboundReport({ from: from, to: to, department: dept });
  }

  function outboundRenderReport_(data) {
    outboundLastData = data;
    const meta = (data && data.meta) || {};
    coverageNoteUpsert_('outbound-body', 'outbound',
      meta.from || null, null, meta.coverageStart || null);
    const unavail = $('outbound-unavailable');
    const empty = $('outbound-empty');
    const body = $('outbound-body');
    if (unavail) unavail.style.display = 'none';
    if (empty) empty.style.display = 'none';
    if (body) body.style.display = '';

    const dateEl = $('outbound-results-date');
    if (dateEl) {
      dateEl.textContent = (meta.from || '') + ' to ' + (meta.to || '')
        + (meta.companyView ? ' · All departments' : (meta.department ? ' · ' + meta.department : ''));
    }
    if (meta.available === false) {
      if (body) body.style.display = 'none';
      if (unavail) unavail.style.display = '';
      return;
    }
    const agents = (data && data.agents) || [];
    const cb = (data && data.callback) || {};
    if (!agents.length && !cb.abandonedTotal) {
      if (body) body.style.display = 'none';
      if (empty) empty.style.display = '';
      return;
    }

    const k = (data && data.kpis) || {};
    const kpiRow = $('outbound-kpi-row');
    if (kpiRow) kpiRow.innerHTML = [
      inboundKpiTile_('Agents', fmtNumber(k.agents), 'with outbound calls', ''),
      inboundKpiTile_('OB calls', fmtNumber(k.obTotal), fmtNumber(k.attempts) + ' dial attempts', ''),
      inboundKpiTile_('Connected', fmtNumber(k.obConnected),
        k.obConnectRate != null ? (k.obConnectRate + '% of calls') : '', ''),
      inboundKpiTile_('Talk time', fmtDuration(k.obTalkSec), 'ATT ' + fmtDuration(k.obAttSec) + ' per connected', ''),
    ].join('');

    // Callback block ("did we call back the ones who abandoned?").
    const cbRow = $('outbound-callback-kpis');
    if (cbRow) cbRow.innerHTML = [
      inboundKpiTile_('Abandoned', fmtNumber(cb.abandonedTotal),
        fmtNumber(cb.abandonedAnonymous) + ' anonymous (untrackable)', ''),
      inboundKpiTile_('Called back', fmtNumber(cb.calledBack),
        'of ' + fmtNumber(cb.abandonedTracked) + ' trackable', ''),
      inboundKpiTile_('Callback rate', cb.calledBackPct != null ? cb.calledBackPct + '%' : '—',
        fmtNumber(cb.calledBackConnected) + ' actually connected', ''),
      inboundKpiTile_('Median time to callback',
        cb.medianCallbackSec != null ? fmtDuration(cb.medianCallbackSec) : '—',
        'first dial after the abandon', ''),
    ].join('');
    const winEl = $('outbound-cb-window');
    if (winEl) winEl.textContent = meta.callbackWindowDays != null ? meta.callbackWindowDays : 3;

    // Attribution disclosure (the roster-dept caveat, quantified).
    const note = $('outbound-attribution-note');
    if (note) {
      const bits = [];
      if (!meta.companyView && meta.offRosterAgents) {
        bits.push(fmtNumber(meta.offRosterAgents) + ' dialing agent(s) not on the '
          + (meta.department || '') + ' roster are excluded from this dept view (see All departments).');
      }
      if (meta.companyView && meta.unrosteredAgents) {
        bits.push(fmtNumber(meta.unrosteredAgents) + ' agent(s) on no roster are shown as "Unrostered".');
      }
      bits.push('Attribution is by roster department (exact-name match), never the phone system’s org label.');
      note.textContent = bits.join(' ');
    }

    const tb = $('outbound-agent-tbody');
    if (tb) {
      srtApply_('outbound-agent-tbody', agents, function (sorted) {
        tb.innerHTML = sorted.map(outboundAgentRowHtml_).join('');
      }, function (r) { return Number(r.obTotal) || 0; });
    }
    const agentSection = $('outbound-agent-section');
    if (agentSection) agentSection.style.display = agents.length ? '' : 'none';
  }

  function outboundAgentRowHtml_(r) {
    return '<tr>'
      + '<td>' + escapeHtml(r.agent) + '</td>'
      + '<td>' + escapeHtml(r.dept || '') + '</td>'
      + '<td class="num">' + fmtNumber(r.obTotal) + '</td>'
      + '<td class="num">' + fmtNumber(r.obConnected) + '</td>'
      + '<td class="num">' + (r.obConnectRate != null ? r.obConnectRate + '%' : '—') + '</td>'
      + '<td class="num">' + fmtDuration(r.obTalkSec) + '</td>'
      + '<td class="num">' + fmtDuration(r.obAttSec) + '</td>'
      + '<td class="num">' + fmtNumber(r.attempts) + '</td>'
      + '</tr>';
  }

  function outboundDownloadCsv_() {

  // -- Caller Lookup (admin) ----------------------------------------------
  // "Explain the full call path for this caller on this day." Phone +
  // date range -> getCallerLookup (CallerLookup.gs) -> one timeline card

  // -- System Health (admin-only) ---------------------------------------
  // Read-only status table from getSystemHealth() (SystemHealth.gs) + the
  // Neon-backup service controls (NeonBackup.gs). Rows carry a status chip
  // (ok / warn / muted) and a remediation hint on warn rows.
  function initSystemHealth_() {
    const btn = $('system-health-btn');
    const modal = $('health-modal');
    if (!btn || !modal) return;
    const closeBtn = modal.querySelector('.modal-close');
    const backdrop = modal.querySelector('[data-close]');
    function openModal() {
      modal.style.display = '';
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      trapFocus_(modal);
      initModalDragResize_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.addEventListener('keydown', onKeyDown);
      healthLoad_();
    }
    function closeModal() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      releaseFocus_();
      resetModalTransform_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKeyDown);
      btn.focus();
    }
    function onKeyDown(e) { if (e.key === 'Escape') closeModal(); }
    btn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (backdrop) backdrop.addEventListener('click', closeModal);
    if ($('health-refresh-btn')) $('health-refresh-btn').addEventListener('click', healthLoad_);
    const wireBackup = function (id, fnName, busyLabel) {
      const b = $(id);
      if (!b) return;
      b.addEventListener('click', function () {
        const prev = b.textContent;
        b.disabled = true; b.textContent = busyLabel;
        google.script.run
          .withSuccessHandler(function (st) {
            b.disabled = false; b.textContent = prev;
            healthRenderBackup_(st);
            healthLoad_();   // outcome rows changed
          })
          .withFailureHandler(function (err) {
            b.disabled = false; b.textContent = prev;
            const el = $('health-backup-status');
            if (el) el.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
          })[fnName]();
      });
    };
    wireBackup('health-backup-install',   'installNeonBackupTrigger',   'Installing…');
    wireBackup('health-backup-uninstall', 'uninstallNeonBackupTrigger', 'Uninstalling…');
    wireBackup('health-backup-now',       'runNeonBackupNow',           'Backing up… (can take a minute)');
    // R7 (G-3): UI surface toggles editor.
    const uiSave = $('health-uiflags-save');
    if (uiSave) uiSave.addEventListener('click', function () {
      const list = $('health-uiflags-list');
      if (!list) return;
      const flags = Array.prototype.slice.call(list.querySelectorAll('input[type=checkbox]:checked'))
        .map(function (cb) { return cb.getAttribute('data-flag'); });
      const st = $('health-uiflags-status');
      if (st) st.textContent = 'Saving…';
      uiSave.disabled = true;
      google.script.run
        .withSuccessHandler(function (resp) {
          uiSave.disabled = false;
          if (st) st.textContent = 'Saved — '
            + ((resp && resp.flags && resp.flags.length) ? (resp.flags.length + ' surface(s) hidden') : 'all surfaces visible')
            + '. Users pick this up on their next page load.';
        })
        .withFailureHandler(function (err) {
          uiSave.disabled = false;
          if (st) st.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
        })
        .saveUiFlags({ flags: flags });
    });
  }

  // R7 (G-3): render the UI-toggle checkboxes from the server registry
  // (checked = HIDDEN). Loaded alongside the health table.
  function healthLoadUiFlags_() {
    const list = $('health-uiflags-list');
    const section = $('health-uiflags-section');
    if (!list || !section) return;
    google.script.run
      .withSuccessHandler(function (resp) {
        if (!resp || !resp.registry) { section.style.display = 'none'; return; }
        section.style.display = '';
        const flags = resp.flags || [];
        list.innerHTML = Object.keys(resp.registry).map(function (k) {
          const on = flags.indexOf(k) !== -1;
          return '<label class="health-uiflag-row"><input type="checkbox" data-flag="' + escapeHtml(k) + '"'
            + (on ? ' checked' : '') + '> ' + escapeHtml(resp.registry[k])
            + ' <code class="health-uiflag-key">' + escapeHtml(k) + '</code></label>';
        }).join('');
      })
      .withFailureHandler(function () { section.style.display = 'none'; })
      .getUiFlags();
  }

  // R21: two-pass load. The fast part (property reads + bounded sheet tails)
  // paints immediately; the Neon part -- the ONLY rows that open a live Neon
  // connection, which pays a free-tier cold start of up to ~15s outside the
  // keep-warm window -- streams in and replaces a "checking…" placeholder.
  // A stale-token guard keeps a slow Neon response from a PREVIOUS refresh
  // from painting over a newer one.
  var healthLoadSeq_ = 0;
  var healthFastData_ = null;
  var healthNeonData_ = null;

  function healthMergedRows_() {
    var fast = (healthFastData_ && healthFastData_.rows) || [];
    var neon = healthNeonData_ ? (healthNeonData_.rows || []) : [{
      section: 'neon', key: 'mirror-pending', label: 'Neon mirror health',
      status: 'muted', value: 'checking… (can take ~15 s if Neon is waking from idle)', hint: '',
    }];
    // Insert the mirror rows right after the last fast 'neon'-section row so
    // the section renders as one group (the renderer keys headers on section
    // transitions).
    var idx = -1;
    for (var i = 0; i < fast.length; i++) if (fast[i].section === 'neon') idx = i;
    if (idx === -1) return fast.concat(neon);
    return fast.slice(0, idx + 1).concat(neon, fast.slice(idx + 1));
  }

  function healthPaint_() {
    if (!healthFastData_) return;
    var warns = (Number(healthFastData_.warnCount) || 0)
      + (healthNeonData_ ? (Number(healthNeonData_.warnCount) || 0) : 0);
    healthRender_({ rows: healthMergedRows_(), warnCount: warns });
    if (!healthNeonData_) {
      var sum = $('health-summary');
      if (sum) sum.textContent += ' · Neon check still running…';
    }
  }

  function healthLoad_() {
    var tok = ++healthLoadSeq_;
    healthFastData_ = null;
    healthNeonData_ = null;
    reportSetStatus_('health-status', 'loading', 'Checking…');
    if ($('health-table')) $('health-table').style.display = 'none';
    healthLoadUiFlags_();   // R7 (G-3): the toggle editor loads alongside
    google.script.run
      .withSuccessHandler(function (data) {
        if (tok !== healthLoadSeq_) return;
        reportSetStatus_('health-status', '');
        healthFastData_ = data || { rows: [] };
        healthPaint_();
      })
      .withFailureHandler(function (err) {
        if (tok !== healthLoadSeq_) return;
        reportSetStatus_('health-status', 'error', 'Error: ' + (err && err.message ? err.message : String(err)));
      })
      .getSystemHealth({ part: 'fast' });
    google.script.run
      .withSuccessHandler(function (data) {
        if (tok !== healthLoadSeq_) return;
        healthNeonData_ = data || { rows: [] };
        healthPaint_();
      })
      .withFailureHandler(function (err) {
        if (tok !== healthLoadSeq_) return;
        healthNeonData_ = { rows: [{ section: 'neon', key: 'mirror-health', label: 'Neon mirror health',
          status: 'warn', value: 'probe failed', hint: (err && err.message ? err.message : String(err)) }], warnCount: 1 };
        healthPaint_();
      })
      .getSystemHealth({ part: 'neon' });
    google.script.run
      .withSuccessHandler(healthRenderBackup_)
      .withFailureHandler(function () { /* section stays hidden for non-admins/errors */ })
      .getNeonBackupStatus();
  }

  const HEALTH_SECTIONS_ = {
    presence: 'Active now',                 // live-presence heartbeats (pre-deploy glance)
    pipeline: 'Pipeline', neon: 'Neon', triggers: 'Trigger-driven services',
    config: 'Script Properties', sheets: 'Sheets',
    usage: 'Report usage (last 30 days)',   // the consolidation/un-gating evidence
    users: 'User activity (last 30 days)',  // R19: per-user rollup, collapsed by default
  };
  // R19: sections rendered COLLAPSED behind a clickable header (currently just
  // 'users' -- one row per user gets long with real adoption). State is
  // per-render (a refresh re-collapses), which is the right default for a
  // drill-in section.
  const HEALTH_FOLDED_SECTIONS_ = { users: true };

  function healthRender_(data) {
    const tbody = $('health-tbody');
    if (!tbody) return;
    const rows = data.rows || [];
    const chip = function (st) {
      const cls = st === 'ok' ? 'sh-ok' : st === 'warn' ? 'sh-warn' : 'sh-muted';
      const label = st === 'ok' ? 'OK' : st === 'warn' ? 'ATTENTION' : 'info';
      return '<span class="sh-chip ' + cls + '">' + label + '</span>';
    };
    let html = '', lastSection = null;
    rows.forEach(function (r) {
      const folded = !!HEALTH_FOLDED_SECTIONS_[r.section];
      if (r.section !== lastSection) {
        lastSection = r.section;
        if (folded) {
          const n = rows.filter(function (x) { return x.section === r.section; }).length;
          html += '<tr class="sh-section sh-fold-head" data-fold="' + escapeHtml(r.section) + '" tabindex="0" role="button" aria-expanded="false">'
            + '<td colspan="3"><span class="sh-fold-arrow">▸</span> '
            + escapeHtml(HEALTH_SECTIONS_[r.section] || r.section)
            + ' <span class="sh-fold-count">(' + n + ' — click to expand)</span></td></tr>';
        } else {
          html += '<tr class="sh-section"><td colspan="3">'
            + escapeHtml(HEALTH_SECTIONS_[r.section] || r.section) + '</td></tr>';
        }
      }
      html += '<tr' + (folded ? ' class="sh-fold-row" data-fold-of="' + escapeHtml(r.section) + '" style="display:none"' : '') + '>'
        + '<td>' + escapeHtml(r.label) + '</td>'
        + '<td>' + chip(r.status) + '</td>'
        + '<td>' + escapeHtml(r.value || '')
        + (r.hint ? '<span class="sh-hint">' + escapeHtml(r.hint) + '</span>' : '')
        + '</td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="3" class="al-empty">No checks returned.</td></tr>';
    // Fold toggles (delegated per render; innerHTML replaced the old rows).
    Array.prototype.forEach.call(tbody.querySelectorAll('.sh-fold-head'), function (head) {
      const toggle = function () {
        const key = head.getAttribute('data-fold');
        const open = head.getAttribute('aria-expanded') === 'true';
        head.setAttribute('aria-expanded', open ? 'false' : 'true');
        const arrow = head.querySelector('.sh-fold-arrow');
        if (arrow) arrow.textContent = open ? '▸' : '▾';
        Array.prototype.forEach.call(
          tbody.querySelectorAll('.sh-fold-row[data-fold-of="' + key + '"]'),
          function (tr) { tr.style.display = open ? 'none' : ''; });
      };
      head.addEventListener('click', toggle);
      head.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });
    });
    if ($('health-table')) $('health-table').style.display = '';
    const sum = $('health-summary');
    if (sum) {
      const warns = Number(data.warnCount) || 0;
      sum.textContent = warns
        ? warns + ' item(s) need attention'
        : 'All checks healthy';
    }
  }

  function healthRenderBackup_(st) {
    const sec = $('health-backup-section');
    if (!sec || !st) return;
    sec.style.display = '';
    const el = $('health-backup-status');
    if (el) {
      el.textContent = (st.installed ? 'Weekly trigger installed (Sat ' + st.hour + ':00). ' : 'No trigger installed. ')
        + (st.lastRun ? ('Last run ' + st.lastRun + ' — ' + (st.lastResult || '')) : 'Never run.');
    }
  }

  function initCallerLookup() {
    const btn = $('caller-lookup-btn');
    const modal = $('caller-lookup-modal');
    if (!btn || !modal) return;
    const closeBtn = modal.querySelector('.modal-close');
    const backdrop = modal.querySelector('[data-close]');

    function openModal() {
      modal.style.display = '';
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      trapFocus_(modal);
      initModalDragResize_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.addEventListener('keydown', onKeyDown);
      clSetDefaultDates_();
      const phone = $('cl-phone');
      if (phone) phone.focus();
    }
    function closeModal() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      releaseFocus_();
      resetModalTransform_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKeyDown);
      btn.focus();
    }
    function onKeyDown(e) { if (e.key === 'Escape') closeModal(); }

    btn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (backdrop) backdrop.addEventListener('click', closeModal);

    const lookupBtn = $('cl-lookup-btn');
    if (lookupBtn) lookupBtn.addEventListener('click', runCallerLookup_);
    const phoneInput = $('cl-phone');
    if (phoneInput) phoneInput.addEventListener('keydown', function (e) {
      // R8-A3: don't launch a second overlapping lookup while one is in
      // flight -- Enter used to bypass the disabled button entirely.
      if (e.key === 'Enter' && !($('cl-lookup-btn') && $('cl-lookup-btn').disabled)) runCallerLookup_();
    });
  }

</script>
