      const answerable = g.ibAnswered + g.ibMissedFree;
      g.ibAnswerRate = answerable > 0 ? Math.round(g.ibAnswered / answerable * 1000) / 10 : null;
      g.ibAttSec = g.ibAnswered > 0 ? Math.round(g.talkSec / g.ibAnswered) : 0;
      g.impact = answerable > 0 ? (100 - g.ibAnswered / answerable * 100) * answerable : 0;
      g.prior = priorMap[d] || null;   // R11-M
      return g;
    }).sort(function (a, b) {
      return (b.impact - a.impact) || a.dept.localeCompare(b.dept);
    });
  }

  var DIRECT_AGENT_THEAD_ = '<thead><tr>'
    + '<th data-sort="agent">Agent</th>'
    + '<th class="num" data-sort="ibAnswered">IB answered</th>'
    + '<th class="num" data-sort="ibMissedFree">IB missed (free)</th>'
    + '<th class="num" data-sort="ibMissedBusy">IB missed (busy)</th>'
    + '<th class="num" data-sort="ibAnswerRate">Answer %</th>'
    + '<th class="num" data-sort="ibAttSec">IB ATT</th>'
    + '<th class="num" data-sort="obTotal">OB calls</th>'
    + '<th class="num" data-sort="obConnected">OB connected</th>'
    + '<th class="num" data-sort="obAttSec">OB ATT</th>'
    + '</tr></thead>';

  function directCallRenderDeptCards_(agents, wrap) {
    // The dynamic tables are rebuilt wholesale each render (innerHTML swap
    // destroys the old theads while srtWired_ would still claim them wired)
    // -- drop their stale sort machinery so re-renders re-arm cleanly.
    Object.keys(srtWired_).forEach(function (k) {
      if (k.indexOf('direct-dept-tbody-') === 0) {
        delete srtWired_[k]; delete srtState_[k]; delete srtRegistry_[k];
      }
    });
    const groups = directCallDeptGroups_(agents);
    wrap.innerHTML = '<h3 class="al-section-title">Per department'
      + ' <span class="ins-rollup-cap">(click a card for its agents; inbound answer rate excludes &ldquo;missed (busy)&rdquo;)</span></h3>'
      + groups.map(function (g, i) {
        const rateStr = g.ibAnswerRate != null ? g.ibAnswerRate + '%' : '—';
        const rateCls = g.ibAnswerRate != null
          ? benchValueCls_('% answered', g.ibAnswerRate + '%', true, 'direct').trim() : '';
        // R11-M: a left-rail tone on the whole dept row keyed on the 92%
        // answer-rate standard, so a struggling dept reads distinct at a glance.
        const toneCls = g.ibAnswerRate == null ? 'ddc-tone-muted'
          : (g.ibAnswerRate >= answerTarget_('direct') ? 'ddc-tone-good' : 'ddc-tone-warn');
        // R11-M: delta chips vs the prior window (per-dept). answered/OB up=good,
        // missed up=bad, answer% up=good (pctPoints).
        const pr = g.prior;
        const dAns  = pr ? inboundDelta_(g.ibAnswered, pr.ibAnswered, 'pos', false) : '';
        const dMiss = pr ? inboundDelta_(g.ibMissedFree, pr.ibMissedFree, 'neg', false) : '';
        const dOb   = pr ? inboundDelta_(g.obTotal, pr.obTotal, 'pos', false) : '';
        const dRate = (pr && g.ibAnswerRate != null && pr.ibAnswerRate != null)
          ? inboundDelta_(g.ibAnswerRate, pr.ibAnswerRate, 'pos', true) : '';
        return '<details class="direct-dept-card ' + toneCls + '"' + (groups.length === 1 ? ' open' : '') + '>'
          + '<summary class="direct-dept-head">'
          +   '<span class="direct-dept-name">' + escapeHtml(g.dept) + '</span>'
          +   '<span class="direct-dept-stats">'
          +     '<span class="ddc-stat"><b>' + fmtNumber(g.agents) + '</b> agent' + (g.agents === 1 ? '' : 's') + '</span>'
          +     '<span class="ddc-stat"><b>' + fmtNumber(g.ibAnswered) + '</b> IB answered' + dAns + '</span>'
          +     '<span class="ddc-stat"><b>' + fmtNumber(g.ibMissedFree) + '</b> missed (free)' + dMiss + '</span>'
          +     '<span class="ddc-stat"><b>' + fmtNumber(g.ibMissedBusy) + '</b> missed (busy)</span>'
          +     '<span class="ddc-stat"><b' + (rateCls ? ' class="' + rateCls + '"' : '') + '>' + rateStr + '</b> answer' + dRate + '</span>'
          +     '<span class="ddc-stat"><b>' + fmtDuration(g.ibAttSec) + '</b> IB ATT</span>'
          +     '<span class="ddc-stat"><b>' + fmtNumber(g.obTotal) + '</b> OB' + dOb + '</span>'
          +   '</span>'
          + '</summary>'
          + '<div class="direct-dept-body">'
          +   '<table class="qcd-source-table">' + DIRECT_AGENT_THEAD_
          +     '<tbody id="direct-dept-tbody-' + i + '"></tbody></table>'
          + '</div>'
          + '</details>';
      }).join('');
    groups.forEach(function (g, i) {
      const id = 'direct-dept-tbody-' + i;
      const tbEl = $(id);
      if (!tbEl) return;
      srtApply_(id, g.rows, function (sorted) {
        tbEl.innerHTML = sorted.map(directAgentRowHtml_).join('');
      }, directImpact_);
    });
  }

  function directCallDownloadCsv_() {
    if (!directCallLastData || (directCallLastData.meta || {}).available === false) return;
    const d = directCallLastData;
    const meta = d.meta || {};
    const esc = function (v) {
      const s = csvSafeCell_(v == null ? '' : v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    const row = function (cells) { return cells.map(esc).join(','); };
    const lines = [];
    lines.push(row(['Direct Calls report', meta.from + ' to ' + meta.to]));
    lines.push(row(['Scope', meta.companyView ? 'All departments' : (meta.department || '')]));
    lines.push('');
    lines.push(row(['Agent', 'Dept', 'IB answered', 'IB missed (free)', 'IB missed (busy)',
      'Answer %', 'IB ATT sec', 'OB calls', 'OB connected', 'OB ATT sec',
      'IB int answered', 'IB ext answered', 'OB int calls', 'OB ext calls']));
    (d.agents || []).forEach(function (r) {
      lines.push(row([r.agent, r.dept, r.ibAnswered, r.ibMissedFree, r.ibMissedBusy,
        r.ibAnswerRate != null ? r.ibAnswerRate : '', r.ibAttSec, r.obTotal, r.obConnected, r.obAttSec,
        r.ibIntAnswered, r.ibExtAnswered, r.obIntTotal, r.obExtTotal]));
    });
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'direct-calls_' + (meta.from || '') + '_' + (meta.to || '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 0);
  }

  // -- Outbound renderers (shared) -----------------------------------------
  // G3 (owner 2026-10-08): the Outbound report MODAL is retired. Its content
  // lives on My Department -- the Insights Callbacks fold (G1, script-8) and
  // the Outbound / Both table (Batch D, script-5) -- and its company-view
  // callback table on the Overview (G2, script-3). #/report/outbound deep
  // links land on the Callbacks fold (script-4's router). What stays here is
  // the shared drawing code those surfaces call: the callback tiles, the two
  // strips, the daily chart, the not-called-back drill, the per-dept table,
  // the CSV and the email sender -- each aimed at the CALLER's elements.

  // Email the window on screen to the caller (sendOutboundReportEmail). The
  // server recomputes from the window + scope rather than trusting a client
  // payload, so the email cannot drift from the screen; `btn` is the button
  // whose busy state to drive.
  function outboundSendEmailFor_(btn, req) {
    if (!btn || btn.disabled) return;
    const prev = btn.textContent;
    btn.disabled = true; btn.innerHTML = DS_EQ_HTML_ + 'Sending…';
    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false; btn.textContent = prev;
        showToast('Report emailed to ' + ((res && res.to) || 'you') + '.', 'success');
      })
      .withFailureHandler(function (err) {
        btn.disabled = false; btn.textContent = prev;
        showToast('Could not send: ' + (err && err.message ? err.message : String(err)), 'error');
      })
      .sendOutboundReportEmail(req);
  }
  /**
   * The callback tile row ("did we call back the ones who abandoned?"),
   * shared by the Insights Callbacks fold (G1) and the Overview's Callbacks
   * by department section (G2) so the two cannot word or compute a tile
   * differently. `cbp` is
   * the INV-28 prior window's callback block (null = no delta chips).
   * The pending tail is a COUNT, not a caption guess: tracked abandons still
   * inside the callback window that could yet be called back.
   */
  // CE-1 (owner 2026-10-09): the callback tiles count contact EPISODES. Every
  // rate divides by cb.episodes, and own team / another team / got through
  // are SEPARATE tiles by ruling -- never folded into one "called back".
  function outboundCallbackTilesHtml_(cb, cbp) {
    cb = cb || {};
    const pct = function (v) { return v != null ? v + '%' : '—'; };
    const delta = function (cur, prior) {
      return (cbp && cur != null && prior != null) ? inboundDelta_(cur, prior, 'pos', true) : '';
    };
    const tiles = [
      inboundKpiTile_('Contact episodes', fmtNumber(cb.episodes),
        fmtNumber(cb.abandonedTracked) + ' trackable abandon' + (cb.abandonedTracked === 1 ? '' : 's')
        + (cb.repeatEpisodes ? ' · ' + fmtNumber(cb.repeatEpisodes) + ' with 2+ attempts' : '')
        + (cb.queueAnonymous ? ' · ' + fmtNumber(cb.queueAnonymous) + ' anonymous (untrackable)' : ''), ''),
      inboundKpiTile_('Called back by own team', pct(cb.ownPct),
        fmtNumber(cb.own) + ' episode' + (cb.own === 1 ? '' : 's')
        + (cb.pending ? ' · ' + fmtNumber(cb.pending) + ' still in window' : ''),
        delta(cb.ownPct, cbp && cbp.ownPct)),
      // (2) kept: a callback that rang out is not a save. A connected callback
      // includes voicemail and phone menus (owner ruling 2026-09-23), so it is
      // an upper bound on callers reached, and says so.
      inboundKpiTile_('Own callbacks connected', pct(cb.ownConnectedPct),
        fmtNumber(cb.ownConnected) + ' · incl. voicemail',
        delta(cb.ownConnectedPct, cbp && cbp.ownConnectedPct)),
      inboundKpiTile_('Contacted by another team', pct(cb.otherPct),
        fmtNumber(cb.other) + ' · may be unrelated', ''),
      inboundKpiTile_('Caller got through', pct(cb.gotThroughPct),
        fmtNumber(cb.gotThrough) + ' · reached the team on a later call', ''),
      inboundKpiTile_('Not called back', fmtNumber(cb.none),
        'no dial inside the window', ''),
      inboundKpiTile_('Median time to callback',
        cb.medianCallbackSec != null ? fmtDuration(cb.medianCallbackSec) : '—',
        'own team · from the first attempt', ''),
    ];
    // Company view only: the hang-ups that reached no queue, so no team owns
    // them. Counted, labelled, and never in a rate (ruling 1).
    if (cb.phoneMenuAbandons || cb.directLineAbandons) {
      tiles.push(inboundKpiTile_('Not counted (no queue reached)',
        fmtNumber((cb.phoneMenuAbandons || 0) + (cb.directLineAbandons || 0)),
        fmtNumber(cb.phoneMenuAbandons || 0) + ' phone-menu · '
        + fmtNumber(cb.directLineAbandons || 0) + ' on a person’s line', ''));
    }
    return tiles.join('');
  }

  // v5 (CB-1): the per-dept callback table (company view only). Own sort, not
  // srtApply_, because the rows are GROUPED: a sub-queue stays indented under
  // its parent whatever the order, the unmapped row stays last, and the total
  // row (a tfoot) never takes part. Default = worst own-rate first (ruling 1).
  //
  // G2: the surface rendering this table holds its own VIEW -- its element-id
  // prefix (<prefix>-section / -table / -tbody / -tfoot), its own sort and the
  // payload it last painted -- so a second surface could never reorder it.
  // Today the one surface is the admin-only Overview section (G3 retired the
  // modal's copy).
  var OB_CBDEPT_DEFAULT_SORT_ = { key: 'ownPct', dir: 'asc' };
  function obCbDeptView_(prefix) {
    return { prefix: prefix, sort: { key: OB_CBDEPT_DEFAULT_SORT_.key, dir: OB_CBDEPT_DEFAULT_SORT_.dir }, last: null };
  }
  function obCbDeptCmp_(a, b, sort) {
    const srt = sort || OB_CBDEPT_DEFAULT_SORT_;
    const k = srt.key, dir = srt.dir === 'asc' ? 1 : -1;
    const va = a[k], vb = b[k];
    // Nulls (no trackable abandons) sink regardless of direction.
    if (va == null && vb == null) return String(a.dept).localeCompare(String(b.dept));
    if (va == null) return 1;
    if (vb == null) return -1;
    const c = (typeof va === 'number' && typeof vb === 'number')
      ? (va - vb) : String(va).localeCompare(String(vb));
    return (c * dir) || String(a.dept).localeCompare(String(b.dept));
  }
  function obCbDeptOrder_(rows, sort) {
    const cmp = function (a, b) { return obCbDeptCmp_(a, b, sort); };
    const present = {};
    rows.forEach(function (r) { if (!r.unmapped) present[r.dept] = true; });
    const kids = {};
    const tops = [];
    const tail = [];
    rows.forEach(function (r) {
      if (r.unmapped) tail.push(r);
      else if (r.parent && present[r.parent]) (kids[r.parent] || (kids[r.parent] = [])).push(r);
      else tops.push(r);
    });
    const out = [];
    tops.sort(cmp).forEach(function (t) {
      out.push(t);
      (kids[t.dept] || []).sort(cmp).forEach(function (c) { out.push(c); });
    });
    return out.concat(tail);
  }
  // The column definitions, ONE copy for both surfaces (G2). `tilesWord` names
  // where the matching tiles sit ('above' in both today).
  var OB_CBDEPT_COLS_ = [
    { key: 'dept', label: 'Department', num: false, title: '' },
    { key: 'episodes', label: 'Contact episodes', num: true,
      title: 'One caller trying to reach this department, however many times they tried while it stayed open (each try within the callback window of the last). Built from the abandons on its queues that carried caller ID; a parent includes its sub-queues.' },
    { key: 'ownPct', label: 'Called back by own team', num: true,
      title: 'Episodes closed by a dial from an agent on this department’s roster (or its parent’s / a sub-queue’s), connected or not. The ranked column.' },
    { key: 'otherPct', label: 'Another team', num: true,
      title: 'Episodes no own-team dial closed, but where someone else dialed the caller inside the window: another department, an unrostered dialer, or a call with no agent recorded. Kept apart because it may be about something else.' },
    { key: 'gotThroughPct', label: 'Got through', num: true,
      title: 'The caller reached the department on a later call before anyone called back.' },
    { key: 'none', label: 'Not called back', num: true,
      title: 'No dial to the caller inside the window, and they did not get through.' },
    { key: 'ownConnectedPct', label: 'Own connected (upper bound)', num: true,
      title: 'Own-team callbacks where the far end answered: a person, a voicemail greeting or a phone menu. An UPPER BOUND on callers actually reached, as a share of episodes.' },
    { key: 'medianCallbackSec', label: 'Median time', num: true,
      title: 'Median time from the episode’s FIRST attempt to the own-team callback, measured from the caller’s side: it INCLUDES any internal handoff, so it is not agent responsiveness alone.' },
    { key: 'pending', label: 'Still in window', num: true,
      title: 'Not called back yet, but still inside the callback window.' },
  ];
  function obCbDeptTheadHtml_() {
    return '<tr>' + OB_CBDEPT_COLS_.map(function (c) {
      return '<th' + (c.num ? ' class="num sortable"' : ' class="sortable"') + ' data-cbsort="' + c.key + '" tabindex="0"'
        + (c.title ? ' title="' + escapeHtml(c.title) + '"' : '') + '>' + escapeHtml(c.label) + '</th>';
    }).join('') + '</tr>';
  }
  function obCbDeptCellsHtml_(r) {
    const pct = function (v) { return v != null ? v + '%' : '—'; };
    return '<td class="num">' + fmtNumber(r.episodes) + '</td>'
      + '<td class="num"><strong>' + fmtNumber(r.own) + '</strong> · ' + pct(r.ownPct) + '</td>'
      + '<td class="num">' + fmtNumber(r.other) + ' · ' + pct(r.otherPct) + '</td>'
      + '<td class="num">' + fmtNumber(r.gotThrough) + ' · ' + pct(r.gotThroughPct) + '</td>'
      + '<td class="num">' + fmtNumber(r.none) + '</td>'
      + '<td class="num">' + fmtNumber(r.ownConnected) + ' · ' + pct(r.ownConnectedPct) + '</td>'
      + '<td class="num">' + (r.medianCallbackSec != null ? fmtDuration(r.medianCallbackSec) : '—') + '</td>'
      + '<td class="num">' + fmtNumber(r.pending) + '</td>';
  }
  function obCbDeptDetailHtml_(r, t) {
    const kindNote = { own: 'own team', other: 'another team' };
    let html = '';
    if ((r.byCaller || []).length) {
      html += '<table class="al-config-table ob-cbdept-detail"><thead><tr>'
        + '<th>Called by (roster)</th><th>Counted as</th><th class="num">Episodes</th><th class="num">Connected</th>'
        + '</tr></thead><tbody>'
        + r.byCaller.map(function (b) {
          return '<tr><td>' + escapeHtml(b.label) + '</td><td>' + escapeHtml(kindNote[b.kind] || '') + '</td>'
            + '<td class="num">' + fmtNumber(b.calledBack) + '</td>'
            + '<td class="num">' + fmtNumber(b.connected) + '</td></tr>';
        }).join('')
        + '</tbody></table>';
    } else {
      html += '<p class="al-hint">No callbacks in this range.</p>';
    }
    const tl = r.tallies || {};
    const bits = [];
    if (tl.multiRoster) bits.push(fmtNumber(tl.multiRoster) + ' by agents on more than one roster');
    if (tl.unrostered) bits.push(fmtNumber(tl.unrostered) + ' by a dialer on no roster');
    if (tl.noAgent) bits.push(fmtNumber(tl.noAgent) + ' with no agent recorded');
    if (bits.length) html += '<p class="al-hint">Of the calls above: ' + escapeHtml(bits.join(' · ')) + '.</p>';
    if (r.repeatEpisodes) {
      html += '<p class="al-hint">' + fmtNumber(r.repeatEpisodes) + ' of the '
        + fmtNumber(r.episodes) + ' episodes took 2+ attempts (' + fmtNumber(r.attempts)
        + ' trackable abandons in all).</p>';
    }
    if (r.abandonedAnonymous) {
      html += '<p class="al-hint">' + fmtNumber(r.abandonedAnonymous) + ' anonymous abandon(s) not trackable.</p>';
    }
    if (r.unmapped && t && (t.unmappedQueues || []).length) {
      html += '<p class="al-hint">Queues mapped to no department (map them in Dept Config &rarr; '
        + '&ldquo;Inbound queue aliases&rdquo;): '
        + t.unmappedQueues.map(function (u) {
          return escapeHtml(u.queue) + ' (' + fmtNumber(u.tracked) + ')';
        }).join(', ')
        + (t.unmappedQueueCount > t.unmappedQueues.length
          ? ' and ' + fmtNumber(t.unmappedQueueCount - t.unmappedQueues.length) + ' more' : '')
        + '. No team owns these episodes, so the headline leaves them out.</p>';
    }
    return html;
  }
  function outboundPaintCbDept_(view) {
    const v = view;
    if (!v) return;
    const t = v.last;
    const tb = $(v.prefix + '-tbody');
    const tf = $(v.prefix + '-tfoot');
    if (!t || !tb) return;
    tb.innerHTML = obCbDeptOrder_(t.rows || [], v.sort).map(function (r) {
      const child = !!(r.parent && !r.unmapped);
      return '<tr class="qcd-expandable ob-cbdept-row' + (child ? ' ob-cbdept-child' : '')
        + (r.unmapped ? ' ob-cbdept-unmapped' : '') + '">'
        + '<td><button type="button" class="qcd-expand-toggle" aria-expanded="false">'
        + (child ? '<span class="ob-cbdept-indent" aria-hidden="true">&#8627; </span>' : '')
        + escapeHtml(r.dept) + ' <span class="qcd-expand-icon">&#9654;</span></button></td>'
        + obCbDeptCellsHtml_(r)
        + '</tr>'
        + '<tr class="qcd-detail-row" style="display:none;"><td colspan="9"><div class="qcd-detail-wrap">'
        + obCbDeptDetailHtml_(r, t) + '</div></td></tr>';
    }).join('');
    if (tf) {
      tf.innerHTML = t.total
        ? '<tr class="ob-cbdept-total"><td title="Every episode counted once, whichever departments its queue belongs to">'
          + '<strong>All departments</strong></td>' + obCbDeptCellsHtml_(t.total) + '</tr>'
        : '';
    }
    const table = $(v.prefix + '-table');
    if (table) {
      table.querySelectorAll('th[data-cbsort]').forEach(function (th) {
        const on = th.getAttribute('data-cbsort') === v.sort.key;
        th.classList.toggle('srt-asc', on && v.sort.dir === 'asc');
        th.classList.toggle('srt-desc', on && v.sort.dir === 'desc');
        if (on) th.setAttribute('aria-sort', v.sort.dir === 'asc' ? 'ascending' : 'descending');
        else th.removeAttribute('aria-sort');
      });
    }
  }
  function outboundRenderCbDept_(t, meta, view) {
    const v = view;
    if (!v) return;
    const sec = $(v.prefix + '-section');
    if (!sec) return;
    v.last = t || null;
    if (!t || !(t.rows || []).length) { sec.style.display = 'none'; return; }
    sec.style.display = '';
    const tb = $(v.prefix + '-tbody');
    const table = $(v.prefix + '-table');
    const head = table && table.querySelector('thead');
    if (head && !head.children.length) head.innerHTML = obCbDeptTheadHtml_();
    if (tb && !tb._obCbWired) {
      tb._obCbWired = true;
      // Delegated expand (the qcd-expandable contract: the button owns
      // aria-expanded + Enter/Space; the row stays the mouse target).
      tb.addEventListener('click', function (e) {
        const row = e.target.closest('tr.qcd-expandable');
        if (row && tb.contains(row)) qcdToggleExpandRow_(row);
      });
    }
    if (table && !table._obCbWired) {
      table._obCbWired = true;
      const sortBy = function (th) {
        const key = th.getAttribute('data-cbsort');
        if (v.sort.key === key) v.sort.dir = v.sort.dir === 'asc' ? 'desc' : 'asc';
        else { v.sort.key = key; v.sort.dir = (key === 'dept' || key === 'ownPct' || key === 'ownConnectedPct') ? 'asc' : 'desc'; }
        outboundPaintCbDept_(v);
      };
      const thead = table.querySelector('thead');
      if (thead) {
        thead.addEventListener('click', function (e) {
          const th = e.target.closest('th[data-cbsort]');
          if (th) sortBy(th);
        });
        thead.addEventListener('keydown', function (e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const th = e.target.closest && e.target.closest('th[data-cbsort]');
          if (!th) return;
          e.preventDefault();
          sortBy(th);
        });
      }
    }
    outboundPaintCbDept_(v);
  }

  // v2: daily callback-rate line (safeChart_ per the chart-callsite rule;
  // THEME colors per INV-42; per-chart datalabels OFF -- a dense daily line
  // makes labels unreadable, the Overview-trend precedent).
  // (3) The time-to-callback distribution, as a labelled proportional bar
  // plus a count row. Deliberately not a chart: five ordered buckets read
  // faster as a bar than as a fifth canvas on this page, and it survives the
  // email/print clone that a canvas does not.
  //
  // The ladder + its labels come from the SERVER (the same
  // OUTBOUND_CALLBACK_BUCKETS_ that built the SQL), so the client cannot
  // disagree with the buckets it is rendering. Only the ORDER is assumed here.
  var OUTBOUND_DELAY_ORDER_ = ['m15', 'h1', 'h4', 'd1', 'later'];
  var OUTBOUND_DELAY_LABELS_ = {
    m15: 'within 15 min', h1: 'within 1 hour', h4: 'within 4 hours',
    d1: 'within a day', later: 'later',
  };
  function outboundRenderDelayStrip_(cb, target) {
    const el = target;
    if (!el) return;
    const b = cb && cb.delayBuckets;
    const total = Number(cb && cb.own) || 0;   // CE-1: own-team callbacks, timed from the first attempt
    // Nothing to distribute -> stay quiet. An all-zero strip reads as "every
    // callback was slow" rather than "there were no callbacks".
    if (!b || !total) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    const seg = OUTBOUND_DELAY_ORDER_.map(function (k, i) {
      const n = Number(b[k]) || 0;
      if (!n) return '';
      const pct = n / total * 100;
      // Sooner is better, so the ramp runs good -> muted -> warn across the
      // ladder. Tokens, never raw colors (INV-42's discipline).
      const tone = i <= 1 ? 'good' : (i === 2 ? 'accent' : (i === 3 ? 'muted' : 'warn'));
      return '<span class="ob-delay-seg ob-delay-seg--' + tone + '" style="width:'
        + pct.toFixed(2) + '%" title="' + escapeHtml(OUTBOUND_DELAY_LABELS_[k] + ': '
        + n + ' of ' + total + ' (' + (Math.round(pct * 10) / 10) + '%)') + '"></span>';
    }).join('');
    const legend = OUTBOUND_DELAY_ORDER_.map(function (k, i) {
      const n = Number(b[k]) || 0;
      if (!n) return '';
      const tone = i <= 1 ? 'good' : (i === 2 ? 'accent' : (i === 3 ? 'muted' : 'warn'));
      return '<span class="ob-delay-key"><i class="ob-delay-dot ob-delay-dot--' + tone + '"></i>'
        + escapeHtml(OUTBOUND_DELAY_LABELS_[k]) + ' <strong>' + fmtNumber(n) + '</strong></span>';
    }).join('');
    el.innerHTML = '<div class="al-section-subtitle">How fast did the team call back (from the first attempt)?</div>'
      + '<div class="ob-delay-bar">' + seg + '</div>'
      + '<div class="ob-delay-legend">' + legend + '</div>'
      + '<p class="al-hint">A median hides the tail. Sooner is better: inside 15 minutes '
      + 'the caller is plausibly still by the phone, while a callback the next day is a '
      + 'courtesy call rather than a recovery.</p>';
  }

  // (6) Callback rate by the ABANDON's hour.
  //
  // NOT the shared weekday x hour heatmap (renderAbandonHeatmap_), and the
  // reason is worth stating so nobody "unifies" them later: that renderer is
  // hard-wired to ABANDON rate -- its title, its drill, and above all its
  // color polarity, where HIGH is bad. Callback rate inverts that (high is
  // good), so reusing it would tint a great hour red. It also serves two
  // live surfaces, which is a poor thing to generalise under a deadline.
  // Hour-of-day alone is also the right cut here: splitting this volume
  // across five weekdays would leave most cells under the low-signal floor.
  function outboundRenderHourStrip_(rows, target) {
    const el = target;
    if (!el) return;
    const list = (rows || []).filter(function (r) { return Number(r.episodes) > 0; });
    if (!list.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = '';
    // call_start is raw PST (the INV-18 storage convention) -- shift to CST
    // for display exactly as the per-call lists do, never server-side.
    const cells = list.map(function (r) {
      const cstHour = ((Number(r.hour) || 0) + 2) % 24;
      const rate = r.ratePct;
      const n = Number(r.episodes) || 0;
      const lowSignal = n < 3;
      const tone = lowSignal ? 'muted'
        : (rate >= 75 ? 'good' : (rate >= 50 ? 'accent' : 'warn'));
      const label = heatHourLabel_(cstHour);
      const title = label + ' CST · ' + (rate == null ? 'no contact episodes' : rate + '% called back by own team')
        + ' (' + (Number(r.own) || 0) + ' of ' + n + ' episodes)'
        + (lowSignal ? ' · low volume' : '');
      return '<div class="ob-hour-cell" title="' + escapeHtml(title) + '">'
        + '<div class="ob-hour-bar"><span class="ob-hour-fill ob-hour-fill--' + tone
        + '" style="height:' + (rate == null ? 0 : Math.max(2, rate)) + '%"></span></div>'
        + '<div class="ob-hour-rate">' + (rate == null ? '—' : Math.round(rate) + '%') + '</div>'
        + '<div class="ob-hour-h">' + escapeHtml(label) + '</div>'
        + '<div class="ob-hour-n">' + fmtNumber(n) + '</div>'
        + '</div>';
    }).join('');
    el.innerHTML = '<div class="al-section-subtitle">Which abandons fall through the cracks?</div>'
      + '<div class="ob-hour-strip">' + cells + '</div>'
      + '<p class="al-hint">Own-team callback rate by the hour of the episode&rsquo;s FIRST '
      + 'abandoned attempt (CST), over the whole window — the daily trend above says whether '
      + 'we are keeping up, this says which hours we are not. Bar height is the rate; the '
      + 'number underneath is how many contact episodes started that hour. Hours under 3 are '
      + 'muted as low signal.</p>';
  }

  // One chart instance PER CANVAS (keyed by its id), so a second surface's
  // rebuild can never destroy another's chart.
  var outboundCbCharts_ = {};
  function outboundRenderCbChart_(daily, wrapEl, canvasEl) {
    const wrap = wrapEl;
    const canvas = canvasEl;
    if (!wrap || !canvas) return;
    const slot = canvas.id || 'cb-chart';
    if (outboundCbCharts_[slot]) { try { outboundCbCharts_[slot].destroy(); } catch (e) {} outboundCbCharts_[slot] = null; }
    const pts = (daily || []).filter(function (d) { return d.ratePct != null; });
    if (pts.length < 2) { wrap.style.display = 'none'; return; }
    wrap.style.display = '';
    outboundCbCharts_[slot] = safeChart_(canvas, {
      type: 'line',
      data: {
        labels: pts.map(function (d) { return d.date; }),
        datasets: [{
          label: 'Called back by own team %',
          data: pts.map(function (d) { return d.ratePct; }),
          borderColor: THEME.accent,
          backgroundColor: THEME.accent,
          tension: 0.25,
          pointRadius: 2,
        }],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          datalabels: { display: false },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                const d = pts[ctx.dataIndex] || {};
                return d.own + ' of ' + d.episodes + ' contact episodes called back by own team ('
                  + (d.ratePct != null ? d.ratePct : '—') + '%)'
                  + (d.other ? ' · ' + d.other + ' contacted by another team' : '');
              },
            },
          },
        },
        scales: {
          y: { min: 0, max: 100, ticks: { color: THEME.muted, callback: function (v) { return v + '%'; } }, grid: { color: THEME.line } },
          x: { ticks: { color: THEME.muted, maxTicksLimit: 10 }, grid: { display: false } },
        },
      },

  // CE-2: the two drill lists render GROUPED BY EPISODE. Shared row pieces:
  // the stage tick + queue path + facts of the heatmap drill, the dialed line,
  // and parentIdBadge (the call id + copy for admins -- the phone provider's
  // portal shows the number the dashboard never stores -- and "↳ path").
  function outboundAttemptRowHtml_(c) {
    const path = [c.entryQueue, c.finalQueue].filter(Boolean)
      .filter(function (v, i, a) { return a.indexOf(v) === i; })
      .map(escapeHtml).join(' → ');
    const stage = c.abandonedOnHold ? 'on hold' : (c.abandonStage || '');
    const facts = [];
    // CE-3: a person's line that rang out (or went to their voicemail -- the
    // CDR cannot tell) is `missed`, not abandoned.
    if (c.disposition === 'missed') facts.push('not answered');
    else if (stage) facts.push('abandoned ' + escapeHtml(String(stage)));
    if (c.owner) facts.push('rang ' + escapeHtml(String(c.owner)));
    if (c.waitSeconds != null) facts.push('waited ' + escapeHtml(crFormatSecondsShort_(c.waitSeconds)));
    if (c.dialIn) facts.push('dialed ' + escapeHtml(String(c.dialIn)));
    if (c.afterHours) facts.push('after hours');
    const stageCls = c.abandonedOnHold ? 'is-hold'
      : (String(c.abandonStage || '') === 'ivr' ? 'is-ivr' : 'is-q');
    return '<div class="heat-drill-row">'
      + '<span class="hd-stage ' + stageCls + '" aria-hidden="true"></span>'
      + '<span class="heat-drill-inline-date">' + escapeHtml(String(c.callDate || '').slice(5)) + '</span>'
      + '<span class="heat-drill-when">' + escapeHtml(String(c.cstStart || '').slice(0, 5)) + '</span>'
      + '<span class="heat-drill-path">' + (path || '(no queue recorded)')
      +   (facts.length ? ' <span class="heat-drill-facts">· ' + facts.join(' · ') + '</span>' : '')
      + '</span>'
      + parentIdBadge(c.callId, c.callDate)
      + '</div>';
  }

  // CE-2: the not-called-back list. One block per episode: when it started,
  // how many attempts, its STATUS (still inside the window, N days left |
  // missed) and the LATE tags read past the window -- tags only, they never
  // move a figure.
  function outboundUncalledHtml_(resp) {
    const meta = (resp && resp.meta) || {};
    if (meta.available === false) {
      return '<div class="ds-note">Call detail unavailable — the inbound-calls store (Neon) could not be reached.</div>';
    }
    const byKey = {};
    ((resp && resp.calls) || []).forEach(function (c) { byKey[c.callDate + '|' + c.callId] = c; });
    const eps = (resp && resp.episodes) || [];
    const blocks = eps.map(function (ep) {
      const chips = [];
      if (ep.status === 'pending') {
        chips.push('<span class="ds-chip ds-chip--warn">Still inside the window · '
          + (ep.daysLeft > 0 ? ep.daysLeft + ' day' + (ep.daysLeft === 1 ? '' : 's') + ' left' : 'last day')
          + '</span>');
      } else {
        chips.push('<span class="ds-chip ds-chip--bad">Missed</span>');
      }
      const late = ep.late || {};
      if (late.calledBack) {
        chips.push('<span class="ds-chip ds-chip--neutral" title="A dial reached the caller after the '
          + escapeHtml(String(meta.callbackWindowDays || 3)) + '-day window: tagged, never counted">'
          + 'Called back late · day ' + escapeHtml(String(late.calledBack.daysAfter))
          + ' · ' + (late.calledBack.team === 'own' ? 'own team' : 'another team') + '</span>');
      }
      if (late.gotThrough) {
        chips.push('<span class="ds-chip ds-chip--neutral" title="The caller reached the team on a later call, after the window">'
          + 'Got through later · day ' + escapeHtml(String(late.gotThrough.daysAfter)) + '</span>');
      }
      const n = (ep.attempts || []).length;
      const rows = (ep.attempts || []).map(function (a) {
        const c = byKey[a.callDate + '|' + a.callId] || { callDate: a.callDate, callId: a.callId };
        return outboundAttemptRowHtml_(c);
      }).join('');
      return '<div class="ob-ep ob-ep--' + (ep.status === 'pending' ? 'pending' : 'missed') + '">'
        + '<div class="ob-ep-head">'
        +   '<span class="heat-drill-when">' + escapeHtml(String(ep.firstIso || '')) + '</span>'
        +   '<span class="heat-drill-facts">' + n + ' attempt' + (n === 1 ? '' : 's') + '</span>'
        +   chips.join('')
        + '</div>' + rows + '</div>';
    }).join('');
    return '<div class="heat-drill-head"><strong>Not called back</strong> · '
      + eps.length + ' episode' + (eps.length === 1 ? '' : 's')
      + (meta.pending ? ' · ' + meta.pending + ' still inside the window' : '')
      + (meta.truncated ? ' <span class="heat-drill-cap">(newest shown)</span>' : '')
      + '</div><div class="heat-drill-list">' + blocks + '</div>';
  }

  // CE-2: the called-back list. One row per episode a dial decided: when the
  // caller first tried, how many times, who dialed (their roster team, own or
  // another team), how long after the first attempt, whether it connected,
  // and a "↳ path" into the OUTBOUND call beside the abandoned call's own.
  function outboundCalledBackHtml_(resp) {
    const meta = (resp && resp.meta) || {};
    if (meta.available === false) {
      return '<div class="ds-note">Call detail unavailable — the per-call store (Neon) could not be reached.</div>';
    }
    const eps = (resp && resp.episodes) || [];
    const rows = eps.map(function (ep) {
      const f = ep.first || {};
      const own = ep.outcome === 'own';
      const dial = ep.dial || null;
      const dialPath = dial && dial.callId && dial.callDate
        ? '<button type="button" class="pid-journey" data-journey-kind="outbound" '
          + 'data-journey-pid="' + escapeHtml(String(dial.callId)) + '" '
          + 'data-journey-date="' + escapeHtml(String(dial.callDate)) + '" '
          + 'title="View the callback’s path" aria-label="View the callback’s path">↳ callback path</button>'
        : '';
      const facts = [];
      facts.push(escapeHtml(ep.agent || 'No agent recorded') + ' (' + escapeHtml(ep.team || '') + ')');
      if (ep.delaySec != null) facts.push('after ' + escapeHtml(fmtDuration(ep.delaySec)));
      facts.push(ep.connected ? 'connected' : 'did not connect');
      if (dial && dial.callStart) facts.push('callback at ' + escapeHtml(String(dial.callDate || '').slice(5)) + ' '
        + escapeHtml(clCstTime_(dial.callStart).slice(0, 5)) + ' CST');
      return '<div class="heat-drill-row ob-cb-row">'
        + '<span class="heat-drill-inline-date">' + escapeHtml(String(ep.firstIso || '').slice(5)) + '</span>'
        + '<span class="heat-drill-when">' + escapeHtml(String(f.cstStart || '').slice(0, 5)) + '</span>'
        + '<span class="ds-chip ' + (own ? 'ds-chip--good' : 'ds-chip--neutral') + '">'
        +   (own ? 'Own team' : 'Another team') + '</span>'
        + '<span class="heat-drill-path">' + escapeHtml(f.entryQueue || '(no queue recorded)')
        +   ' <span class="heat-drill-facts">· ' + ep.attempts + ' attempt' + (ep.attempts === 1 ? '' : 's')
        +   (f.dialIn ? ' · dialed ' + escapeHtml(String(f.dialIn)) : '')
        +   ' · ' + facts.join(' · ') + '</span></span>'
        + parentIdBadge(f.callId, f.callDate)
        + dialPath
        + '</div>';
    }).join('');
    return '<div class="heat-drill-head"><strong>Called back</strong> · '
      + fmtNumber(meta.own || 0) + ' by own team · ' + fmtNumber(meta.other || 0) + ' by another team'
      + (meta.truncated ? ' <span class="heat-drill-cap">(newest ' + eps.length + ' shown)</span>' : '')
      + '</div><div class="heat-drill-list">' + rows + '</div>';
  }

  // ── CE-3: Direct lines -- calls to a person's line ─────────────────────
  // One block per surface, by element-id prefix ('ins-dl' in the Insights
  // Callbacks fold, 'ov-dl' in the Overview's Callbacks by department). LAZY:
  // getOutboundDirectCallbacks runs only while the block's <details> is open,
  // once per window; a new window orphans an in-flight fetch AND repeat drill.
  var OB_DL_VIEWS_ = {};
  function obDlView_(prefix) {
    return OB_DL_VIEWS_[prefix]
      || (OB_DL_VIEWS_[prefix] = { prefix: prefix, key: null, seq: 0, data: null, inFlight: false, repSeq: 0 });
  }
  function obDlState_(prefix, msg) {
    const el = $(prefix + '-state');
    if (!el) return;
    el.textContent = msg || '';
    el.style.display = msg ? '' : 'none';
  }
  function obDlResetRepeats_(prefix) {
    const btn = $(prefix + '-rep-btn');
    if (btn && btn.dataset.idleLabel) { btn.disabled = false; btn.textContent = btn.dataset.idleLabel; }
    const list = $(prefix + '-rep-list');
    if (list) { list.style.display = 'none'; list.innerHTML = ''; }
    const st = $(prefix + '-rep-status');
    if (st) st.textContent = '';
  }
  // `req` is the surface's window ({department, from, to}; department '' =
  // the company view) or null while it has none.
  function obDlSync_(prefix, req) {
    const fold = $(prefix + '-fold');
    if (!fold || !req) return;
    const v = obDlView_(prefix);
    const key = (req.department || '') + '|' + req.from + '|' + req.to;
    if (key !== v.key) {
      v.key = key; v.data = null; v.inFlight = false;
      v.seq++; v.repSeq++;
      obDlResetRepeats_(prefix);
      const content = $(prefix + '-content'); if (content) content.style.display = 'none';
      obDlState_(prefix, '');
      const head = $(prefix + '-head'); if (head) head.textContent = 'open to load';
    }
    if (!fold.open) return;
    if (v.data) { obDlRender_(prefix, v.data); return; }
    if (v.inFlight) return;
    v.inFlight = true;
    const tok = ++v.seq;
    const head = $(prefix + '-head'); if (head) head.textContent = 'loading…';
    obDlState_(prefix, 'Loading direct-line callbacks…');
    google.script.run
      .withSuccessHandler(function (data) {
        if (tok !== v.seq) return;   // a newer window owns the block
        v.inFlight = false;
        v.data = data || {};
        obDlRender_(prefix, v.data);
      })
      .withFailureHandler(function (err) {
        if (tok !== v.seq) return;
        v.inFlight = false; v.key = null;   // let the next open retry
        if (head) head.textContent = 'unavailable';
        obDlState_(prefix, 'Direct-line callbacks could not be loaded: '
          + ((err && err.message) ? err.message : String(err)));
      })
      .getOutboundDirectCallbacks({ from: req.from, to: req.to, department: req.department || '' });
  }
  function outboundDirectTilesHtml_(s) {
    s = s || {};
    const pct = function (x) { return x != null ? x + '%' : '—'; };
    return [
      inboundKpiTile_('Contact episodes', fmtNumber(s.episodes),
        fmtNumber(s.attempts) + ' unanswered call' + (s.attempts === 1 ? '' : 's')
        + (s.repeatEpisodes ? ' · ' + fmtNumber(s.repeatEpisodes) + ' with 2+ attempts' : ''), ''),
      inboundKpiTile_('Called back by the person', pct(s.ownByPersonPct),
        fmtNumber(s.ownByPerson) + ' · whose line was tried', ''),
      inboundKpiTile_('Called back by their team', pct(s.ownByTeamPct),
        fmtNumber(s.ownByTeam) + ' · a teammate dialed', ''),
      inboundKpiTile_('Contacted by another team', pct(s.otherPct),
        fmtNumber(s.other) + ' · may be unrelated', ''),
      inboundKpiTile_('Caller got through', pct(s.gotThroughPct),
        fmtNumber(s.gotThrough) + ' · reached the team on a later call', ''),
      inboundKpiTile_('Not called back', fmtNumber(s.none),
        s.pending ? fmtNumber(s.pending) + ' more still in window' : 'no dial inside the window', ''),
      inboundKpiTile_('Median time to callback',
        s.medianCallbackSec != null ? fmtDuration(s.medianCallbackSec) : '—',
        'own team · from the first attempt', ''),
    ].join('');
  }
  function obDlRender_(prefix, data) {
    const meta = (data && data.meta) || {};
    const head = $(prefix + '-head');
    const content = $(prefix + '-content');
    if (meta.available === false) {
      if (content) content.style.display = 'none';
      if (head) head.textContent = 'unavailable';
      obDlState_(prefix, 'Direct-line data is unavailable right now (the per-call store, Neon, could not be read).');
      return;
    }
    const c = data.counts || {};
    const all = data.all || {};
    if (!c.calls) {
      if (content) content.style.display = 'none';
      if (head) head.textContent = 'no unanswered direct-line calls in this window';
      obDlState_(prefix, 'No external call to a person’s line went unanswered in this window.');
      return;
    }
    obDlState_(prefix, '');
    if (content) content.style.display = '';
    if (head) {
      head.textContent = (all.ownPct != null ? all.ownPct + '% called back by the team' : 'callback rate –')
        + ' · ' + fmtNumber(all.episodes || 0) + ' contact episode' + (all.episodes === 1 ? '' : 's')
        + (all.none ? ' · ' + fmtNumber(all.none) + ' not called back' : '');
    }
    const bits = [fmtNumber(c.calls) + ' unanswered call' + (c.calls === 1 ? '' : 's') + ' to a person’s line ('
      + fmtNumber(c.missed) + ' rang out or went to voicemail, ' + fmtNumber(c.abandoned) + ' hung up while it rang)'];
    if (c.anonymous) bits.push(fmtNumber(c.anonymous) + ' anonymous (untrackable)');
    if (c.voicemailBox) bits.push(fmtNumber(c.voicemailBox) + ' to the Sales voicemail box');
    if (c.unownedLines) bits.push(fmtNumber(c.unownedLines) + ' to lines on no roster');
    const cnt = $(prefix + '-counts'); if (cnt) cnt.textContent = bits.join(' · ') + '.';
    const w = $(prefix + '-work'); if (w) w.innerHTML = outboundDirectTilesHtml_(data.work);
    const a = $(prefix + '-after'); if (a) a.innerHTML = outboundDirectTilesHtml_(data.after);
  }
  // Wired once per surface: the fold's toggle (with that surface's window)
  // and the repeat-callers drill.
  function obDlWire_(prefix, reqFn) {
    const fold = $(prefix + '-fold');
    if (!fold || fold._obDlWired) return;
    fold._obDlWired = true;
    fold.addEventListener('toggle', function () { if (fold.open) obDlSync_(prefix, reqFn()); });
    const btn = $(prefix + '-rep-btn');
    if (btn) btn.addEventListener('click', function () {
      const v = obDlView_(prefix);
      if (!v.data || !v.data.meta) return;
      outboundLoadDirectRepeatsInto_({
        btn: btn, list: $(prefix + '-rep-list'), status: $(prefix + '-rep-status'),
        meta: v.data.meta,
        nextSeq: function () { return ++v.repSeq; },
        curSeq: function () { return v.repSeq; },
      });
    });
  }

  // CE-3: the repeat-unreturned-callers list (owner ruling 3): one block per
  // episode -- first and last attempt, the lines tried, the team, voicemail
  // when the shared box was rung, CE-2's late tags -- and every attempt row.
  function outboundDirectRepeatsHtml_(resp) {
    const meta = (resp && resp.meta) || {};
    if (meta.available === false) {
      return '<div class="ds-note">Call detail unavailable — the per-call store (Neon) could not be reached.</div>';
    }
    const eps = (resp && resp.episodes) || [];
    const blocks = eps.map(function (ep) {
      const chips = ['<span class="ds-chip ds-chip--bad">Not called back</span>'];
      if (ep.voicemail) chips.push('<span class="ds-chip ds-chip--neutral">Voicemail box</span>');
      const late = ep.late || {};
      if (late.calledBack) {
        chips.push('<span class="ds-chip ds-chip--neutral">Called back late · day '
          + escapeHtml(String(late.calledBack.daysAfter)) + ' · '
          + (late.calledBack.team === 'own' ? 'own team' : 'another team') + '</span>');
      }
      if (late.gotThrough) {
        chips.push('<span class="ds-chip ds-chip--neutral">Got through later · day '
          + escapeHtml(String(late.gotThrough.daysAfter)) + '</span>');
      }
      const n = (ep.attempts || []).length;
      return '<div class="ob-ep ob-ep--missed">'
        + '<div class="ob-ep-head">'
        +   '<span class="heat-drill-when">' + escapeHtml(String(ep.firstIso || ''))
        +     (ep.lastIso && ep.lastIso !== ep.firstIso ? ' → ' + escapeHtml(String(ep.lastIso)) : '') + '</span>'
        +   '<span class="heat-drill-facts">' + n + ' attempts · ' + escapeHtml((ep.lines || []).join(', ') || '(unknown line)')
        +     ' · ' + escapeHtml(ep.team || '') + '</span>'
        +   chips.join('')
        + '</div>' + (ep.attempts || []).map(outboundAttemptRowHtml_).join('') + '</div>';
    }).join('');
    return '<div class="heat-drill-head"><strong>Repeat unreturned callers</strong> · '
      + eps.length + ' caller episode' + (eps.length === 1 ? '' : 's') + ' with 2+ unanswered attempts and no callback'
      + (meta.truncated ? ' <span class="heat-drill-cap">(newest shown)</span>' : '')
      + '</div><div class="heat-drill-list">' + blocks + '</div>';
  }

  // The repeat drill: the UI-5 pattern (its own per-request token from the
  // caller, both handlers drop a superseded response; a second click closes).
  function outboundLoadDirectRepeatsInto_(ctx) {
    const btn = ctx.btn;
    const list = ctx.list;
    const status = ctx.status;
    if (!btn || !list) return;
    const meta = ctx.meta || {};
    if (!meta.from) return;
    if (list.style.display !== 'none' && list.innerHTML) {
      list.style.display = 'none'; list.innerHTML = '';
      if (status) status.textContent = '';
      return;
    }
    if (!btn.dataset.idleLabel) btn.dataset.idleLabel = btn.textContent;
    const prev = btn.dataset.idleLabel;
    btn.disabled = true; btn.textContent = 'Loading…';
    const tok = ctx.nextSeq();
    google.script.run
      .withSuccessHandler(function (resp) {
        if (tok !== ctx.curSeq()) return;   // a newer render / drill owns the panel
        btn.disabled = false; btn.textContent = prev;
        initClipboardOnce();
        const isEmpty = resp && (resp.episodes || []).length === 0
          && (!resp.meta || resp.meta.available !== false);
        list.innerHTML = isEmpty
          ? '<div class="ds-note">No caller tried a person’s line twice or more without a callback in this window.</div>'
          : outboundDirectRepeatsHtml_(resp);
        list.style.display = '';
        if (status) {
          const m = (resp && resp.meta) || {};
          status.textContent = m.available === false ? ''
            : ((resp.episodes || []).length + ' caller episode(s)' + (m.truncated ? ' (newest shown)' : ''));
        }
      })
      .withFailureHandler(function (err) {
        if (tok !== ctx.curSeq()) return;
        btn.disabled = false; btn.textContent = prev;
        if (status) status.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      })
      .getOutboundDirectRepeats({ from: meta.from, to: meta.to,
        department: meta.companyView ? '' : (meta.department || '') });
  }

  // The called-back drill: the not-called-back drill's pattern exactly (its
  // own per-request token from the caller, both handlers drop a superseded
  // response -- UI-5; a second click closes the list).
  function outboundLoadCalledBackInto_(ctx) {
    const btn = ctx.btn;
    const list = ctx.list;
    const status = ctx.status;
    if (!btn || !list) return;
    const meta = ctx.meta || {};
    if (!meta.from) return;
    if (list.style.display !== 'none' && list.innerHTML) {
      list.style.display = 'none'; list.innerHTML = '';
      if (status) status.textContent = '';
      return;
    }
    if (!btn.dataset.idleLabel) btn.dataset.idleLabel = btn.textContent;
    const prev = btn.dataset.idleLabel;
    btn.disabled = true; btn.textContent = 'Loading…';
    const tok = ctx.nextSeq();
    google.script.run
      .withSuccessHandler(function (resp) {
        if (tok !== ctx.curSeq()) return;   // a newer render / drill owns the panel
        btn.disabled = false; btn.textContent = prev;
        initClipboardOnce();
        const isEmpty = resp && (resp.episodes || []).length === 0
          && (!resp.meta || resp.meta.available !== false);
        list.innerHTML = isEmpty
          ? '<div class="ds-note">No contact episode in this range was called back.</div>'
          : outboundCalledBackHtml_(resp);
        list.style.display = '';
        if (status) {
          const m = (resp && resp.meta) || {};
          status.textContent = m.available === false ? ''
            : ((resp.episodes || []).length + ' episode(s)' + (m.truncated ? ' (newest shown)' : ''));
        }
      })
      .withFailureHandler(function (err) {
        if (tok !== ctx.curSeq()) return;
        btn.disabled = false; btn.textContent = prev;
        if (status) status.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      })
      .getOutboundCalledBack({ from: meta.from, to: meta.to,
        department: meta.companyView ? '' : (meta.department || '') });
  }

  // v2: the not-called-back drill. Since CE-2 its rows come grouped by
  // episode (outboundUncalledHtml_); each still carries the stage tick + facts + "↳
  // path" journey chip; initClipboardOnce arms the delegated handler.
  // The not-called-back drill (the Insights Callbacks fold, G1): `ctx` names
  // the button / list / status elements, the report meta whose window and
  // scope it re-queries, and the caller's OWN sequence counter (a fresh
  // render orphans an in-flight drill, UI-5).
  function outboundLoadUncalledInto_(ctx) {
    const btn = ctx.btn;
    const list = ctx.list;
    const status = ctx.status;
    if (!btn || !list) return;
    const meta = ctx.meta || {};
    if (!meta.from) return;
    // Second click toggles the open list closed.
    if (list.style.display !== 'none' && list.innerHTML) {
      list.style.display = 'none'; list.innerHTML = '';
      if (status) status.textContent = '';
      return;
    }
    if (!btn.dataset.idleLabel) btn.dataset.idleLabel = btn.textContent;
    const prev = btn.dataset.idleLabel;
    btn.disabled = true; btn.textContent = 'Loading…';
    const tok = ctx.nextSeq();
    google.script.run
      .withSuccessHandler(function (resp) {
        if (tok !== ctx.curSeq()) return;   // a newer render / drill owns the panel
        btn.disabled = false; btn.textContent = prev;
        initClipboardOnce();
        // Empty here is GOOD news -- say so rather than "no calls".
        const isEmpty = resp && (resp.episodes || []).length === 0
          && (!resp.meta || resp.meta.available !== false);
        list.innerHTML = isEmpty
          ? '<div class="ds-note">Every contact episode in this range was called back, got through '
            + 'or was contacted by another team within '
            + escapeHtml(String((resp.meta && resp.meta.callbackWindowDays) || 3)) + ' days.</div>'
          : outboundUncalledHtml_(resp);
        list.style.display = '';
        if (status) {
          const m = (resp && resp.meta) || {};
          status.textContent = m.available === false ? ''
            : ((resp.calls || []).length + ' call(s)'
              + (m.episodes != null ? ' in ' + m.episodes + ' episode' + (m.episodes === 1 ? '' : 's') : '')
              + (m.truncated ? ' (newest shown)' : ''));
        }
      })
      .withFailureHandler(function (err) {
        if (tok !== ctx.curSeq()) return;
        btn.disabled = false; btn.textContent = prev;
        if (status) status.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
      })
      .getOutboundUncalled({ from: meta.from, to: meta.to,
        department: meta.companyView ? '' : (meta.department || '') });
  }

  function outboundDownloadCsv_(data, cbDeptSort) {
    const d = (data && data.meta) ? data : null;
    if (!d || (d.meta || {}).available === false) return;
    const meta = d.meta || {};
    const cb = d.callback || {};
    const esc = function (v) {
      const s = csvSafeCell_(v == null ? '' : v);
      if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    };
    const row = function (cells) { return cells.map(esc).join(','); };
    const lines = [];
    lines.push(row(['Outbound report', meta.from + ' to ' + meta.to]));
    lines.push(row(['Scope', meta.companyView ? 'All departments' : (meta.department || '')]));
    lines.push(row(['Abandoned', cb.abandonedTotal, 'Anonymous', cb.abandonedAnonymous,
      'Trackable queue abandons', cb.abandonedTracked,
      'Phone-menu hang-ups (not counted)', cb.phoneMenuAbandons || 0,
      'Direct-line hang-ups (not counted)', cb.directLineAbandons || 0]));
    lines.push(row(['Contact episodes', cb.episodes, 'With 2+ attempts', cb.repeatEpisodes,
      'Called back by own team', cb.own, 'Own %', cb.ownPct != null ? cb.ownPct : '',
      'Own connected', cb.ownConnected,
      'Another team', cb.other, 'Got through', cb.gotThrough,
      'Not called back', cb.none, 'Still in window', cb.pending,
      'Median own callback sec', cb.medianCallbackSec != null ? cb.medianCallbackSec : '']));
    // CB-1 on CE-1: the per-dept callback table, when the view carries one.
    const cbd = d.callbackByDept;
    if (cbd && (cbd.rows || []).length) {
      lines.push('');
      lines.push(row(['Department', 'Parent', 'Contact episodes', 'Trackable abandons',
        'Called back by own team', 'Own %', 'Another team', 'Got through', 'Not called back',
        'Own connected (upper bound)', 'Own connected %', 'Median callback sec', 'Still in window']));
      const cbdRow = function (name, parent, r) {
        return row([name, parent || '', r.episodes, r.attempts, r.own, r.ownPct != null ? r.ownPct : '',
          r.other, r.gotThrough, r.none, r.ownConnected, r.ownConnectedPct != null ? r.ownConnectedPct : '',
          r.medianCallbackSec != null ? r.medianCallbackSec : '', r.pending]);
      };
      obCbDeptOrder_(cbd.rows, cbDeptSort).forEach(function (r) { lines.push(cbdRow(r.dept, r.parent, r)); });
      if (cbd.total) lines.push(cbdRow('All departments (each episode once)', '', cbd.total));
    }
    lines.push('');
    lines.push(row(['Agent', 'Roster dept', 'OB calls', 'Connected', 'Connect %',
      'Talk sec', 'ATT sec', 'Attempts']));
    (d.agents || []).forEach(function (r) {
      lines.push(row([r.agent, r.dept, r.obTotal, r.obConnected,
        r.obConnectRate != null ? r.obConnectRate : '', r.obTalkSec, r.obAttSec, r.attempts]));
    });
    const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'outbound_' + (meta.from || '') + '_' + (meta.to || '') + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 0);
  }

  // -- Caller Lookup (admin) ----------------------------------------------
  // "Explain the full call path for this caller on this day." Phone +
  // date range -> getCallerLookup (CallerLookup.gs) -> one timeline card
  // per inbound call. Calls captured since the journey extension render
  // the leg-by-leg path; older rows fall back to the entry->final queue
  // summary. The raw number never leaves the request payload -- the
  // server hashes it in memory and queries by hash.

  // -- System Health (admin-only) ---------------------------------------
  // Read-only status table from getSystemHealth() (SystemHealth.gs) + the
  // Neon-backup service controls (NeonBackup.gs). Rows carry a status chip
  // (ok / warn / muted) and a remediation hint on warn rows.
  function initSystemHealth_() {
    const btn = $('system-health-btn');
    const modal = $('health-modal');
    if (!btn || !modal) return;
    const closeBtn = modal.querySelector('.modal-close');
    const backdrop = modal.querySelector('[data-close]');
    function openModal() {
      modal.style.display = '';
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      trapFocus_(modal);
      initModalDragResize_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.addEventListener('keydown', onKeyDown);
      healthLoad_();
    }
    function closeModal() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      releaseFocus_();
      resetModalTransform_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKeyDown);
      btn.focus();
    }
    function onKeyDown(e) { if (e.key === 'Escape') closeModal(); }
    btn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (backdrop) backdrop.addEventListener('click', closeModal);
    if ($('health-refresh-btn')) $('health-refresh-btn').addEventListener('click', healthLoad_);
    const wireBackup = function (id, fnName, busyLabel) {
      const b = $(id);
      if (!b) return;
      b.addEventListener('click', function () {
        const prev = b.textContent;
        b.disabled = true; b.textContent = busyLabel;
        google.script.run
          .withSuccessHandler(function (st) {
            b.disabled = false; b.textContent = prev;
            healthRenderBackup_(st);
            healthLoad_();   // outcome rows changed
          })
          .withFailureHandler(function (err) {
            b.disabled = false; b.textContent = prev;
            const el = $('health-backup-status');
            if (el) el.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
          })[fnName]();
      });
    };
    wireBackup('health-backup-install',   'installNeonBackupTrigger',   'Installing…');
    wireBackup('health-backup-uninstall', 'uninstallNeonBackupTrigger', 'Uninstalling…');
    wireBackup('health-backup-now',       'runNeonBackupNow',           'Backing up… (can take a minute)');
    // R7 (G-3): UI surface toggles editor.
    const uiSave = $('health-uiflags-save');
    if (uiSave) uiSave.addEventListener('click', function () {
      const list = $('health-uiflags-list');
      if (!list) return;
      const flags = Array.prototype.slice.call(list.querySelectorAll('input[type=checkbox]:checked'))
        .map(function (cb) { return cb.getAttribute('data-flag'); });
      const st = $('health-uiflags-status');
      if (st) st.textContent = 'Saving…';
      uiSave.disabled = true;
      google.script.run
        .withSuccessHandler(function (resp) {
          uiSave.disabled = false;
          if (st) st.textContent = 'Saved — '
            + ((resp && resp.flags && resp.flags.length) ? (resp.flags.length + ' surface(s) hidden') : 'all surfaces visible')
            + '. Users pick this up on their next page load.';
        })
        .withFailureHandler(function (err) {
          uiSave.disabled = false;
          if (st) st.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
        })
        .saveUiFlags({ flags: flags });
    });
  }

  // R7 (G-3): render the UI-toggle checkboxes from the server registry
  // (checked = HIDDEN). Loaded alongside the health table.
  function healthLoadUiFlags_() {
    const list = $('health-uiflags-list');
    const section = $('health-uiflags-section');
    if (!list || !section) return;
    google.script.run
      .withSuccessHandler(function (resp) {
        if (!resp || !resp.registry) { section.style.display = 'none'; return; }
        section.style.display = '';
        const flags = resp.flags || [];
        list.innerHTML = Object.keys(resp.registry).map(function (k) {
          const on = flags.indexOf(k) !== -1;
          return '<label class="health-uiflag-row"><input type="checkbox" data-flag="' + escapeHtml(k) + '"'
            + (on ? ' checked' : '') + '> ' + escapeHtml(resp.registry[k])
            + ' <code class="health-uiflag-key">' + escapeHtml(k) + '</code></label>';
        }).join('');
      })
      .withFailureHandler(function () { section.style.display = 'none'; })
      .getUiFlags();
  }

  // R21: two-pass load. The fast part (property reads + bounded sheet tails)
  // paints immediately; the Neon part -- the ONLY rows that open a live Neon
  // connection, which pays a free-tier cold start of up to ~15s outside the
  // keep-warm window -- streams in and replaces a "checking…" placeholder.
  // A stale-token guard keeps a slow Neon response from a PREVIOUS refresh
  // from painting over a newer one.
  var healthLoadSeq_ = 0;
  var healthFastData_ = null;
  var healthNeonData_ = null;

  function healthMergedRows_() {
    var fast = (healthFastData_ && healthFastData_.rows) || [];
    var neon = healthNeonData_ ? (healthNeonData_.rows || []) : [{
      section: 'neon', key: 'mirror-pending', label: 'Neon mirror health',
      status: 'muted', value: 'checking… (can take ~15 s if Neon is waking from idle)', hint: '',
    }];
    // Insert the mirror rows right after the last fast 'neon'-section row so
    // the section renders as one group (the renderer keys headers on section
    // transitions).
    var idx = -1;
    for (var i = 0; i < fast.length; i++) if (fast[i].section === 'neon') idx = i;
    if (idx === -1) return fast.concat(neon);
    return fast.slice(0, idx + 1).concat(neon, fast.slice(idx + 1));
  }

  function healthPaint_() {
    if (!healthFastData_) return;
    var warns = (Number(healthFastData_.warnCount) || 0)
      + (healthNeonData_ ? (Number(healthNeonData_.warnCount) || 0) : 0);
    healthRender_({ rows: healthMergedRows_(), warnCount: warns });
    if (!healthNeonData_) {
      var sum = $('health-summary');
      if (sum) sum.textContent += ' · Neon check still running…';
    }
  }

  function healthLoad_() {
    var tok = ++healthLoadSeq_;
    healthFastData_ = null;
    healthNeonData_ = null;
    reportSetStatus_('health-status', 'loading', 'Checking…');
    if ($('health-table')) $('health-table').style.display = 'none';
    healthLoadUiFlags_();   // R7 (G-3): the toggle editor loads alongside
    google.script.run
      .withSuccessHandler(function (data) {
        if (tok !== healthLoadSeq_) return;
        reportSetStatus_('health-status', '');
        healthFastData_ = data || { rows: [] };
        healthPaint_();
      })
      .withFailureHandler(function (err) {
        if (tok !== healthLoadSeq_) return;
        reportSetStatus_('health-status', 'error', 'Error: ' + (err && err.message ? err.message : String(err)));
      })
      .getSystemHealth({ part: 'fast' });
    google.script.run
      .withSuccessHandler(function (data) {
        if (tok !== healthLoadSeq_) return;
        healthNeonData_ = data || { rows: [] };
        healthPaint_();
      })
      .withFailureHandler(function (err) {
        if (tok !== healthLoadSeq_) return;
        healthNeonData_ = { rows: [{ section: 'neon', key: 'mirror-health', label: 'Neon mirror health',
          status: 'warn', value: 'probe failed', hint: (err && err.message ? err.message : String(err)) }], warnCount: 1 };
        healthPaint_();
      })
      .getSystemHealth({ part: 'neon' });
    google.script.run
      .withSuccessHandler(healthRenderBackup_)
      .withFailureHandler(function () { /* section stays hidden for non-admins/errors */ })
      .getNeonBackupStatus();
  }

  const HEALTH_SECTIONS_ = {
    presence: 'Active now',                 // live-presence heartbeats (pre-deploy glance)
    pipeline: 'Pipeline', neon: 'Neon', triggers: 'Trigger-driven services',
    config: 'Script Properties', sheets: 'Sheets',
    props: 'All Script Properties (inventory)',  // the >50-cap complete view (PROP_REGISTRY_)
    usage: 'Report usage (last 30 days)',   // the consolidation/un-gating evidence
    users: 'User activity (last 30 days)',  // R19: per-user rollup, collapsed by default
  };
  // R19: sections rendered COLLAPSED behind a clickable header ('users' -- one
  // row per user gets long with real adoption -- and 'props', the full
  // property inventory, a drill-in view by nature). State is per-render (a
  // refresh re-collapses), which is the right default for a drill-in section.
  const HEALTH_FOLDED_SECTIONS_ = { users: true, props: true };

  function healthRender_(data) {
    const tbody = $('health-tbody');
    if (!tbody) return;
    const rows = data.rows || [];
    const chip = function (st) {
      const cls = st === 'ok' ? 'sh-ok' : st === 'warn' ? 'sh-warn' : 'sh-muted';
      const label = st === 'ok' ? 'OK' : st === 'warn' ? 'ATTENTION' : 'info';
      return '<span class="sh-chip ' + cls + '">' + label + '</span>';
    };
    let html = '', lastSection = null;
    rows.forEach(function (r) {
      const folded = !!HEALTH_FOLDED_SECTIONS_[r.section];
      if (r.section !== lastSection) {
        lastSection = r.section;
        if (folded) {
          const n = rows.filter(function (x) { return x.section === r.section; }).length;
          // C2-9 (the E-8 house rule): the toggle is a real <button> INSIDE
          // the cell, never role=button on the <tr> -- that overrides the
          // implicit row role and the table stops being a grid for screen
          // readers. The row stays the click target via bubbling.
          html += '<tr class="sh-section sh-fold-head" data-fold="' + escapeHtml(r.section) + '">'
            + '<td colspan="3"><button type="button" class="sh-fold-btn" aria-expanded="false">'
            + '<span class="sh-fold-arrow" aria-hidden="true">▸</span> '
            + escapeHtml(HEALTH_SECTIONS_[r.section] || r.section)
            + ' <span class="sh-fold-count">(' + n + ' — click to expand)</span></button></td></tr>';
        } else {
          html += '<tr class="sh-section"><td colspan="3">'
            + escapeHtml(HEALTH_SECTIONS_[r.section] || r.section) + '</td></tr>';
        }
      }
      html += '<tr' + (folded ? ' class="sh-fold-row" data-fold-of="' + escapeHtml(r.section) + '" style="display:none"' : '') + '>'
        + '<td>' + escapeHtml(r.label) + '</td>'
        + '<td>' + chip(r.status) + '</td>'
        + '<td>' + escapeHtml(r.value || '')
        + (r.hint ? '<span class="sh-hint">' + escapeHtml(r.hint) + '</span>' : '')
        + '</td></tr>';
    });
    tbody.innerHTML = html || '<tr><td colspan="3" class="al-empty">No checks returned.</td></tr>';
    // Fold toggles (delegated per render; innerHTML replaced the old rows).
    Array.prototype.forEach.call(tbody.querySelectorAll('.sh-fold-head'), function (head) {
      const btn = head.querySelector('.sh-fold-btn');
      const toggle = function () {
        const key = head.getAttribute('data-fold');
        const open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        const arrow = head.querySelector('.sh-fold-arrow');
        if (arrow) arrow.textContent = open ? '▸' : '▾';
        Array.prototype.forEach.call(
          tbody.querySelectorAll('.sh-fold-row[data-fold-of="' + key + '"]'),
          function (tr) { tr.style.display = open ? 'none' : ''; });
      };
      // The inner <button> owns Enter/Space natively (C2-9); a row keydown
      // handler here would fire a SECOND toggle on the same keypress.
      head.addEventListener('click', toggle);
    });
    if ($('health-table')) $('health-table').style.display = '';
    const sum = $('health-summary');
    if (sum) {
      const warns = Number(data.warnCount) || 0;
      sum.textContent = warns
        ? warns + ' item(s) need attention'
        : 'All checks healthy';
    }
  }

  function healthRenderBackup_(st) {
    const sec = $('health-backup-section');
    if (!sec || !st) return;
    sec.style.display = '';
    const el = $('health-backup-status');
    if (el) {
      el.textContent = (st.installed ? 'Weekly trigger installed (Sat ' + st.hour + ':00). ' : 'No trigger installed. ')
        + (st.lastRun ? ('Last run ' + st.lastRun + ' — ' + (st.lastResult || '')) : 'Never run.');
      // Sheets fallback (Drive blocked by policy): link the backup workbook.
      // DOM nodes, not innerHTML -- the URL is server-built but stays text.
      if (st.sheetsUrl && /^https:\/\/docs\.google\.com\//.test(st.sheetsUrl)) {
        el.appendChild(document.createTextNode(' '));
        const a = document.createElement('a');
        a.href = st.sheetsUrl;
        a.target = '_blank';
        a.rel = 'noopener';
        a.textContent = st.store === 'sheets' ? 'Open backup workbook' : 'Backup workbook (fallback)';
        el.appendChild(a);
      }
    }
  }

  function initCallerLookup() {
    const btn = $('caller-lookup-btn');
    const modal = $('caller-lookup-modal');
    if (!btn || !modal) return;
    const closeBtn = modal.querySelector('.modal-close');
    const backdrop = modal.querySelector('[data-close]');

    function openModal() {
      modal.style.display = '';
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      trapFocus_(modal);
      initModalDragResize_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.addEventListener('keydown', onKeyDown);
      clSetDefaultDates_();
      const phone = $('cl-phone');
      if (phone) phone.focus();
    }
    function closeModal() {
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
      releaseFocus_();
      resetModalTransform_(modal.querySelector('.modal-panel') || modal.querySelector('.modal-panel-wide'));
      document.body.style.overflow = '';
      document.removeEventListener('keydown', onKeyDown);
      btn.focus();
    }
    function onKeyDown(e) { if (e.key === 'Escape') closeModal(); }

    btn.addEventListener('click', openModal);
    if (closeBtn) closeBtn.addEventListener('click', closeModal);
    if (backdrop) backdrop.addEventListener('click', closeModal);

    const lookupBtn = $('cl-lookup-btn');
    if (lookupBtn) lookupBtn.addEventListener('click', runCallerLookup_);
    const phoneInput = $('cl-phone');
    if (phoneInput) phoneInput.addEventListener('keydown', function (e) {
      // R8-A3: don't launch a second overlapping lookup while one is in
      // flight -- Enter used to bypass the disabled button entirely.
      if (e.key === 'Enter' && !($('cl-lookup-btn') && $('cl-lookup-btn').disabled)) runCallerLookup_();
    });
  }

</script>
