name: CI

# Runs the zero-dep regression harness (node --test) and the INV-16
# duplicated-file guard on every push to main and every PR, so a failing
# test or a drifted neonWrite.js / buildDQEHistoricalData.js copy is caught
# before it can be deployed (previously these ran only locally / via the
# non-blocking SessionStart hook). node --test also includes a
# cache-version-sync guard that fails on docs<->code cache-version drift
# (INV-30).

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Match the Apps Script manifest timezone so harness Date
      # construction (new Date(y, m, d)) renders the same calendar
      # labels CI-side as production -- on a UTC host the label
      # formatting shifts a day (the trend-label artifact documented
      # in insights-report.test.js).
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # tests need Node >= 18; dev on 22
      - name: Unit tests (node --test)
        run: node --test
      - name: INV-16 duplicated-file guard
        run: bash scripts/check-duplicated-files.sh
      # T-3 (2026-09-17): docs/module-dependencies.md is GENERATED and was found
      # stale by its own checker (OutboundReport.gs 47 -> 109 symbols unrecorded).
      # The fix is one command (`node scripts/module-deps.mjs --write`), so the
      # gate is cheap; a stale map is silent.
      - name: Module-dependency map is current (node scripts/module-deps.mjs --check)
        run: node scripts/module-deps.mjs --check

  # H3: the undeclared-identifier net (ported from team-tools' lint-server).
  # SEPARATE job because it needs eslint (`npm ci`), while `test` above stays
  # deliberately zero-dep. It lints each Apps Script project as ONE
  # concatenation -- the one global scope the platform actually loads -- so a
  # name that reads fine and throws ReferenceError at runtime is caught
  # statically, which no selective-load suite and no shape pin can do. Under
  # CI=true the script FAILS when eslint is absent (the F-9 rule), so a
  # workflow refactor that loses the install step cannot turn it silently green.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install eslint (devDependency)
        run: npm ci --no-audit --no-fund
      - name: Undeclared-identifier net (npm run lint:gas)
        run: npm run lint:gas

  # F7: the rendered-UI gate. SEPARATE job because it needs playwright + a
  # browser download, while the unit suite above is deliberately zero-dep. It
  # boots the REAL client (dashboard.html + script.html + styles.html) in
  # headless Chromium against payloads computed by the REAL server code and
  # asserts the failure classes the .gs harness structurally cannot see: page /
  # console errors, unmocked RPCs, BLANK chart canvases (the R12-1 class), and
  # horizontal page overflow -- plus the S39 keyboard-access walk (F13).
  #
  # BLOCKING since 2026-07. It ran `continue-on-error` while it proved itself,
  # and it has now caught two bugs that reached production and that nothing else
  # could see: CSS appended after `</style>` rendering as visible text at the top
  # of the page, and the header department selector throwing a ReferenceError so
  # that no admin could change departments. Both were invisible to `node --test`
  # -- one is markup structure, the other needs a real click -- and both were
  # found by an assertion that only exists here. Advisory was the right call on
  # day one and the wrong one now: a gate nobody has to heed is a gate that
  # reports the next one just as quietly.
  ui-harness:
    runs-on: ubuntu-latest
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Vendor bundles (Chart.js, datalabels, html2canvas-pro) are COMMITTED
      # under tools/ui-harness/vendor/, so playwright is the only install --
      # and `npx playwright install` fetches the browser it needs.
      # S7: PINNED -- this library executes the BLOCKING gate, and an unpinned
      # `npm i playwright` took latest on every run: a breaking playwright
      # release changed gate behavior for every PR at once with no repo change
      # to bisect. Bump deliberately (update the version here, watch one green
      # run). chromium-path.js globs the browser revision, so the pin does not
      # couple to a chromium path.
      - name: Install playwright
        working-directory: tools/ui-harness
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Rendered-UI gate (npm run ci:ui)
        run: npm run ci:ui
